      ctx.beginPath(); ctx.arc(-11, -28, 3.5, 0, 7); ctx.stroke();
    }

    // --- cabeza y cara
    ctx.fillStyle = look.piel;
    ctx.beginPath(); ctx.arc(0, -46, 14, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    ctx.beginPath(); ctx.arc(-5, -47, 2.1, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -47, 2.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath(); ctx.arc(-4.3, -47.8, 0.7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(5.7, -47.8, 0.7, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(240,140,150,0.45)';
    ctx.beginPath(); ctx.arc(-8, -42, 2.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -42, 2.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8A5A4A'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -43.5, 3.2, 0.25, Math.PI - 0.25); ctx.stroke();

    // --- peinado por delante
    ctx.fillStyle = pelo;
    ctx.beginPath(); ctx.arc(0, -48, 14.4, Math.PI, 0); ctx.fill();
    ctx.fillRect(-14.4, -50, 28.8, 4);
    if (look.peinado === 'coleta') {
      ctx.beginPath(); ctx.ellipse(0, -62, 6, 5, 0, 0, 7); ctx.fill();
    }
    if (look.peinado === 'trenzas') {
      ctx.beginPath(); ctx.arc(-14, -52, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(14, -52, 4, 0, 7); ctx.fill();
    }
    if (look.peinado === 'monyo') {
      ctx.beginPath(); ctx.arc(0, -63, 8, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.arc(0, -63, 8, 0.6, 2.4); ctx.fill();
    }
    if (look.peinado === 'media') {
      ctx.beginPath(); ctx.ellipse(0, -60, 7, 5, 0, 0, 7); ctx.fill();
    }
    if (look.peinado === 'monyos') {                     // dos moñitos
      [-11, 11].forEach(mx2 => {
        ctx.beginPath(); ctx.arc(mx2, -60, 7.5, 0, 7); ctx.fill();
      });
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      [-11, 11].forEach(mx2 => {
        ctx.beginPath(); ctx.arc(mx2, -60, 7.5, 0.7, 2.5); ctx.fill();
      });
      ctx.fillStyle = pelo;
    }
    if (look.peinado === 'coletas') {
      ctx.fillStyle = '#F26FA8';                         // las gomitas
      [-13, 13].forEach(cx2 => {
        ctx.beginPath(); ctx.arc(cx2, -55, 3.2, 0, 7); ctx.fill();
      });
      ctx.fillStyle = pelo;
    }
    if (look.peinado === 'bob') {                        // flequillo recto
      ctx.fillRect(-14.4, -53, 28.8, 6);
    }
    if (look.peinado === 'rizos') {
      [[-10, -56], [0, -59], [10, -56], [-15, -50], [15, -50]].forEach(r => {
        ctx.beginPath(); ctx.arc(r[0], r[1], 6, 0, 7); ctx.fill();
      });
    }
    if (look.peinado === 'cresta') {
      [[-9, 8], [-4.5, 14], [0, 17], [4.5, 14], [9, 8]].forEach(pi => {
        ctx.beginPath();
        ctx.moveTo(pi[0] - 3.4, -56); ctx.lineTo(pi[0], -56 - pi[1]); ctx.lineTo(pi[0] + 3.4, -56);
        ctx.closePath(); ctx.fill();
      });
    }
    if (look.peinado === 'trenzaslargas') {

      ctx.fillStyle = pelo;
    }
    if (look.peinado === 'melenasirena') {

      ctx.beginPath(); ctx.arc(-11, -55, 2.6, 0, 7); ctx.fill();

    }

    // --- las joyas: pendientes en las orejas y collar en el cuello
    this.dibujarJoyas(ctx, look);

    // --- complemento por delante
    if (look.complemento === 'corona') {
      const flores = ['#FF8FA3', '#FFD166', '#B7E4C7', '#FFADAD', '#A0C4FF'];
      flores.forEach((c, i) => {

    const enOrejas = (f) => [-13.5, 13.5].forEach(ox => f(ox));

    if (j === 'perlitas' || j === 'juegoperla') {
      enOrejas(ox => {
        ctx.fillStyle = perla;
        ctx.beginPath(); ctx.arc(ox, -44, 2.8, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.10)';
        ctx.beginPath(); ctx.arc(ox, -43.4, 2.8, 0.6, 2.5); ctx.fill();
      });
    }
    if (j === 'aros') {
      ctx.strokeStyle = oro; ctx.lineWidth = 1.6;
      enOrejas(ox => { ctx.beginPath(); ctx.arc(ox, -40, 4.5, 0, 7); ctx.stroke(); });
    }
    if (j === 'estrellitas' || j === 'juegoestrellas') {
      enOrejas(ox => {
        ctx.fillStyle = '#FFE066';
        this.estrella(ctx, ox, -42, 5, 2.1, 5);
        ctx.fillStyle = '#FFF';
        this.estrella(ctx, ox, -42, 2, 0.9, 5);
      });
    }
    if (j === 'cerezas') {
      enOrejas(ox => {
        ctx.strokeStyle = '#5E9E3E'; ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(ox, -45); ctx.lineTo(ox - 2, -38); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, -45); ctx.lineTo(ox + 2.4, -39); ctx.stroke();
        ctx.fillStyle = '#E8506B';
        ctx.beginPath(); ctx.arc(ox - 2.4, -36.5, 2.6, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(ox + 2.8, -37.5, 2.6, 0, 7); ctx.fill();
      });
    }
    if (j === 'gotas') {
      enOrejas(ox => {
        ctx.fillStyle = oro;
        ctx.beginPath(); ctx.arc(ox, -45, 1.8, 0, 7); ctx.fill();
        ctx.fillStyle = '#8FD3F4';
        ctx.beginPath();
        ctx.moveTo(ox, -43);
        ctx.quadraticCurveTo(ox + 3.4, -38, ox, -34);
        ctx.quadraticCurveTo(ox - 3.4, -38, ox, -43);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath(); ctx.arc(ox - 1, -39, 0.9, 0, 7); ctx.fill();
      });
    }
    if (j === 'juegocoral') {
      enOrejas(ox => {
        ctx.strokeStyle = '#FF8FA3'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ox, -44); ctx.lineTo(ox, -36); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, -40); ctx.lineTo(ox - 3, -36); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, -39); ctx.lineTo(ox + 3, -35); ctx.stroke();
      });
    }

    // --- los collares
    const cadena = (color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, -36, 9, 0.35, Math.PI - 0.35); ctx.stroke();
    };
    if (j === 'gargantilla') {
      ctx.strokeStyle = '#5B4B9B'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, -37, 8, 0.3, Math.PI - 0.3); ctx.stroke();
      ctx.fillStyle = '#F26FA8';
      ctx.beginPath(); ctx.arc(0, -29.5, 2.2, 0, 7); ctx.fill();
    }
    if (j === 'collarluna') {
      cadena('#C9C4BC');
      ctx.fillStyle = '#FFE066';                        // una luna en cuarto
      ctx.beginPath();
      ctx.arc(0, -27, 4.4, 0.7, 5.0);
      ctx.arc(2.2, -27.6, 3.8, 4.7, 1.1, true);
      ctx.closePath(); ctx.fill();
    }
    if (j === 'collarcorazon') {
      cadena(oro);
      ctx.fillStyle = '#E8506B';
      ctx.beginPath();
      ctx.moveTo(0, -23);
      ctx.bezierCurveTo(-6, -30, -2.6, -34, 0, -30.5);
      ctx.bezierCurveTo(2.6, -34, 6, -30, 0, -23);
      ctx.fill();
    }
    if (j === 'collarllave') {
      cadena(oro);
      ctx.fillStyle = oro;                              // una llavecita
      ctx.beginPath(); ctx.arc(0, -30, 3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.arc(0, -30, 1.2, 0, 7); ctx.fill();
      ctx.fillStyle = oro;
      ctx.fillRect(-0.9, -28, 1.8, 7);
      ctx.fillRect(0.9, -24, 2.6, 1.5);
      ctx.fillRect(0.9, -22, 2, 1.5);
    }
    if (j === 'juegoperla') {
      ctx.fillStyle = perla;                            // sarta de perlas
      for (let k = -3; k <= 3; k++) {
        const a = Math.PI / 2 + k * 0.30;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 11, -36 + Math.sin(a) * 9, 2.1, 0, 7); ctx.fill();
      }
    }
    if (j === 'juegocoral') {
      cadena('#FF8FA3');
      ctx.fillStyle = '#FF8FA3';                        // una ramita de coral
      ctx.beginPath(); ctx.arc(0, -27, 3.4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#FF8FA3'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      [[-4, -23], [0, -21], [4, -23]].forEach(r => {
        ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(r[0], r[1]); ctx.stroke();
      });
    }
    if (j === 'juegoestrellas') {
      cadena('#FFE066');
      ctx.fillStyle = '#FFE066';
      this.estrella(ctx, 0, -27, 5.5, 2.3, 5);
      ctx.fillStyle = '#FFF';
      this.estrella(ctx, 0, -27, 2.2, 0.9, 5);
    }
  },

  /* Una estrella de las de toda la vida, para varitas, capas y sombreros */
  estrella(ctx, cx, cy, fuera, dentro, puntas) {
    ctx.beginPath();
    for (let k = 0; k < puntas * 2; k++) {
      const r = k % 2 ? dentro : fuera;
      const a = -Math.PI / 2 + k * Math.PI / puntas;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
  },

  capsula(ctx, cx, cy, ancho, alto) {
    ctx.beginPath();
    ctx.roundRect(cx - ancho / 2, cy - alto / 2, ancho, alto, ancho / 2);
    ctx.fill();
  },

  /* La mascota que la sigue */
  dibujarMascota(ctx, x, yPies, esc, id, mirando, t) {
    if (!id) return;                                 // todavía no tiene mascota
    const m = ROPA.mascotas.find(e => e.id === id);
    if (!m) return;
    if (m.id === 'gatito') return this.dibujarGato(ctx, x, yPies, esc, m, mirando, t);
    if (m.id === 'nutria') return this.dibujarNutria(ctx, x, yPies, esc, m, mirando, t);
    if (m.id === 'dragon') return this.dibujarDragon(ctx, x, yPies, esc, m, mirando, t);
    if (m.forma) return this.dibujarBicho(ctx, x, yPies, esc, m, mirando, t);
    ctx.save();
    ctx.translate(x, yPies);
    ctx.scale(esc * (mirando < 0 ? -1 : 1), esc);

    ctx.fillStyle = m.detalle;                       // cola
    const cola = Math.sin(t * 3) * 0.35;
    ctx.save(); ctx.translate(-9, -12); ctx.rotate(-0.5 + cola);
    ctx.beginPath(); ctx.ellipse(-5, 0, 7, 4, 0, 0, 7); ctx.fill();
    ctx.restore();

    ctx.fillStyle = m.color;                         // cuerpo
    ctx.beginPath(); ctx.ellipse(0, -10, 10, 7, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -17, 7, 0, 7); ctx.fill();   // cabeza
    ctx.fillStyle = m.detalle;                        // orejas
    ctx.beginPath(); ctx.moveTo(4, -22); ctx.lineTo(6, -28); ctx.lineTo(9, -22); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, -22); ctx.lineTo(13, -28); ctx.lineTo(14, -22); ctx.fill();
    ctx.fillStyle = '#3A3A3A';                        // ojo y hocico
    ctx.beginPath(); ctx.arc(10, -18, 1.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(14.5, -16, 1.4, 0, 7); ctx.fill();
    ctx.fillStyle = m.color;                          // patas
    const p = Math.sin(t * 8) * 1.5;
    ctx.fillRect(-5 + p, -5, 3, 5);
    ctx.fillRect(4 - p, -5, 3, 5);
    ctx.restore();
  },

  /* LAS MASCOTAS NUEVAS
     Todas se dibujan aquí, cada una con su forma. El truco de que parezcan
     vivas es siempre el mismo: algo que se mueve con el tiempo t (la cola,
     las orejas, las alas) y un ojo con su brillito. */
  dibujarBicho(ctx, x, yPies, esc, m, mirando, t) {
    ctx.save();
    ctx.translate(x, yPies);
    ctx.scale(esc * (mirando < 0 ? -1 : 1), esc);
    const vaiven = Math.sin(t * 3);
    const patas = Math.sin(t * 8) * 1.5;

    if (m.forma === 'conejo') {
      ctx.fillStyle = m.color;
      [[-1, 1], [1, -1]].forEach((o, i) => {             // las orejas larguísimas
        ctx.save(); ctx.translate(5 + i * 5, -22); ctx.rotate(o[0] * 0.25 + vaiven * 0.12);
        ctx.beginPath(); ctx.ellipse(0, -9, 3, 10, 0, 0, 7); ctx.fill();
        ctx.fillStyle = m.detalle;
        ctx.beginPath(); ctx.ellipse(0, -9, 1.5, 7, 0, 0, 7); ctx.fill();
        ctx.fillStyle = m.color;
        ctx.restore();
      });
      ctx.beginPath(); ctx.ellipse(0, -9, 10, 8, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -17, 6.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFF';                            // la colita de algodón
      ctx.beginPath(); ctx.arc(-9, -10, 4, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(10, -18, 1.4, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;
      ctx.beginPath(); ctx.arc(14, -16, 1.6, 0, 7); ctx.fill();
      ctx.fillStyle = m.color;
      ctx.fillRect(-4 + patas, -3, 3, 3); ctx.fillRect(5 - patas, -3, 3, 3);

    } else if (m.forma === 'erizo') {
      ctx.fillStyle = m.detalle;                         // las púas
      for (let k = 0; k < 11; k++) {
        const a = Math.PI + 0.15 + k * 0.27;
        ctx.beginPath();
        ctx.moveTo(-2 + Math.cos(a) * 9, -9 + Math.sin(a) * 8);
        ctx.lineTo(-2 + Math.cos(a) * 15, -9 + Math.sin(a) * 14);
        ctx.lineTo(-2 + Math.cos(a + 0.2) * 9, -9 + Math.sin(a + 0.2) * 8);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(-2, -9, 10, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#E8C9A0';                         // la carita
      ctx.beginPath(); ctx.ellipse(9, -10, 6, 5.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(10, -12, 1.3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(14.5, -10, 1.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#E8C9A0';
      ctx.fillRect(-3 + patas, -2.5, 3, 3); ctx.fillRect(5 - patas, -2.5, 3, 3);

    } else if (m.forma === 'cangrejo') {
      ctx.fillStyle = m.color;
      [[-1, -9], [1, 9]].forEach(g => {                  // las pinzas
        ctx.save(); ctx.translate(g[1], -13); ctx.rotate(g[0] * (0.3 + Math.abs(vaiven) * 0.3));
        ctx.beginPath(); ctx.ellipse(0, 0, 4.5, 3.4, 0, 0, 7); ctx.fill();
        ctx.fillStyle = m.detalle;
        ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(5, -1); ctx.lineTo(0, 0); ctx.fill();
        ctx.fillStyle = m.color;
        ctx.restore();
      });
      ctx.strokeStyle = m.color; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      [-7, -2, 3, 8].forEach((px, i) => {                // las paticas
        ctx.beginPath(); ctx.moveTo(px, -6);
        ctx.lineTo(px + (i < 2 ? -3 : 3), -1 + Math.sin(t * 8 + i) * 0.8); ctx.stroke();
      });
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, -9, 11, 7, 0, 0, 7); ctx.fill();
      [[-4, -16], [4, -16]].forEach(o => {               // los ojos con tallo
        ctx.strokeStyle = m.color; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(o[0], -12); ctx.lineTo(o[0], o[1]); ctx.stroke();
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(o[0], o[1], 2.4, 0, 7); ctx.fill();
        ctx.fillStyle = '#3A3A3A';
        ctx.beginPath(); ctx.arc(o[0], o[1], 1.1, 0, 7); ctx.fill();
      });

    } else if (m.forma === 'tortuga') {
      ctx.fillStyle = m.color;                           // patas y cabeza
      ctx.fillRect(-7 + patas, -5, 4, 5); ctx.fillRect(4 - patas, -5, 4, 5);
      ctx.beginPath(); ctx.arc(10, -12, 5, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                         // el caparazón
      ctx.beginPath(); ctx.ellipse(0, -12, 12, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      [[0, -17], [-6, -11], [6, -11], [0, -8]].forEach(g => {
        ctx.beginPath(); ctx.arc(g[0], g[1], 3, 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(12, -13, 1.3, 0, 7); ctx.fill();
      ctx.fillStyle = '#F8B8C8';
      ctx.beginPath(); ctx.arc(11, -9.5, 1.6, 0, 7); ctx.fill();

    } else if (m.forma === 'pinguino') {
      ctx.fillStyle = m.detalle;                          // las patitas
      ctx.beginPath(); ctx.ellipse(-3 + patas, -1, 4, 2, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(4 - patas, -1, 4, 2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = m.color;                            // el cuerpo
      ctx.beginPath(); ctx.ellipse(0, -12, 9, 12, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFF';                             // la barriga
      ctx.beginPath(); ctx.ellipse(1, -11, 6, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = m.color;                            // el ala
      ctx.save(); ctx.translate(-7, -14); ctx.rotate(vaiven * 0.3);
      ctx.beginPath(); ctx.ellipse(0, 3, 2.6, 7, 0, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = m.detalle;                          // el pico
      ctx.beginPath(); ctx.moveTo(7, -19); ctx.lineTo(13, -17); ctx.lineTo(7, -15.5); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(5, -21, 2.2, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(5.4, -21, 1.2, 0, 7); ctx.fill();

    } else if (m.forma === 'pajaro') {
      const vuelo = Math.sin(t * 6) * 3;                  // va volando al lado
      ctx.translate(0, -14 + vuelo);
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 6, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -5, 5, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                          // el ala que aletea
      ctx.save(); ctx.rotate(Math.sin(t * 12) * 0.5);
      ctx.beginPath(); ctx.ellipse(-2, -3, 7, 3.4, -0.3, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = m.detalle;                          // cola y pico
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-14, -3); ctx.lineTo(-14, 3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(11, -5); ctx.lineTo(16, -4); ctx.lineTo(11, -2.5); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(8.5, -6, 2, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(9, -6, 1.1, 0, 7); ctx.fill();

    } else if (m.forma === 'unicornio') {
      const crin = ['#F26FA8', '#FFE066', '#8FD3F4', '#B58BE0'];
      ctx.fillStyle = m.color;
      ctx.fillRect(-6 + patas, -6, 3.4, 6); ctx.fillRect(5 - patas, -6, 3.4, 6);
      ctx.beginPath(); ctx.ellipse(0, -11, 11, 7.5, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(9, -19, 6, 0, 7); ctx.fill();
      crin.forEach((c, i) => {                            // la crin de colores
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.ellipse(2 - i * 3.4, -20 + i, 3, 5.5, 0.3, 0, 7); ctx.fill();
      });
      ctx.fillStyle = crin[0];                            // la cola
      ctx.save(); ctx.translate(-10, -12); ctx.rotate(vaiven * 0.25);
      crin.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.beginPath(); ctx.ellipse(-3, i * 2, 5, 2.2, 0.5, 0, 7); ctx.fill();
      });
      ctx.restore();
      ctx.fillStyle = '#FFE066';                          // el cuernito
      ctx.beginPath(); ctx.moveTo(10, -25); ctx.lineTo(12.5, -34); ctx.lineTo(13.5, -24); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,170,0.6)';
      ctx.beginPath(); ctx.arc(12.5, -34, 3, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(11, -20, 1.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#F8B8C8';
      ctx.beginPath(); ctx.arc(14, -17, 1.6, 0, 7); ctx.fill();

    } else if (m.forma === 'pez') {
      /* EL PEZ VA EN PECERA (lo pidió Gala). No tiene patas: la pecera se
         apoya en el suelo y se bambolea, y el agua se mueve con ella. */
      const bamba = Math.sin(t * 3) * 0.09;
      ctx.save(); ctx.translate(0, -13); ctx.rotate(bamba);
      ctx.fillStyle = '#C9BFA8';                          // el pie de la pecera
      ctx.beginPath(); ctx.ellipse(0, 12, 8, 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(120,200,225,0.55)';           // el agua
      ctx.beginPath(); ctx.arc(0, 0, 11.5, 0.5, 2.64); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -4 + Math.sin(t * 2) * 0.8, 10.4, 3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#D8C9A8';                          // la arenita del fondo
      ctx.beginPath(); ctx.ellipse(0, 9, 8, 2.6, 0, 0, 7); ctx.fill();
      const px = Math.sin(t * 1.6) * 4.5, mira = Math.cos(t * 1.6) > 0 ? 1 : -1;
      ctx.save(); ctx.translate(px, 2 + Math.sin(t * 3.1) * 1.6); ctx.scale(mira, 1);
      ctx.fillStyle = m.color;                            // y el pez, nadando
      ctx.beginPath(); ctx.ellipse(0, 0, 4.6, 3.1, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-8, -2.6);
      ctx.lineTo(-8, 2.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = m.detalle;                          // la aleta de arriba
      ctx.beginPath(); ctx.moveTo(-1, -2.6); ctx.lineTo(1.5, -5); ctx.lineTo(2.5, -2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(2.4, -0.8, 1.3, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(2.7, -0.8, 0.7, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';            // burbujitas
      for (let k = 0; k < 3; k++) {
        const sube = ((t * 14 + k * 7) % 16);
        ctx.beginPath(); ctx.arc(3 + k * 2 - 2, 8 - sube, 0.9 + k * 0.2, 0, 7); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';         // el cristal
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 8.5, 3.5, 4.4); ctx.stroke();   // el brillo
      ctx.restore();

    /* ---------------- LOS BICHOS RAROS de la Casa dels Bitxos -----------
       Son los caros. Cada uno tiene una cosa que se mueve y que ninguno de
       los demás tiene: por eso vale la pena ahorrar para ellos. */
    } else if (m.forma === 'flamenco') {
      ctx.strokeStyle = m.color; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(1, -10);                // la pata de palo
      ctx.lineTo(1 + Math.sin(t * 2) * 1.5, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-2, -10); ctx.lineTo(-5, -6); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, -15, 9, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                          // el ala
      ctx.beginPath(); ctx.ellipse(-2, -16, 6, 4, vaiven * 0.15, 0, 7); ctx.fill();
      ctx.strokeStyle = m.color; ctx.lineWidth = 2.6;     // el cuello en S
      ctx.beginPath(); ctx.moveTo(6, -18);
      ctx.quadraticCurveTo(14, -22 + vaiven, 10, -29); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(10, -30, 3.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.moveTo(12, -31); ctx.lineTo(17, -28); ctx.lineTo(12, -28); ctx.fill();
      ctx.beginPath(); ctx.arc(11, -31, 1.1, 0, 7); ctx.fill();

    } else if (m.forma === 'pulpo') {
      ctx.strokeStyle = m.color; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
      for (let k = 0; k < 6; k++) {                       // los ocho brazos (se ven seis)
        const o = -11 + k * 4.4, curva = Math.sin(t * 2.4 + k * 0.8);
        ctx.beginPath(); ctx.moveTo(o * 0.55, -9);
        ctx.quadraticCurveTo(o + curva * 3, -4, o * 1.35 + curva * 4, 0);
        ctx.stroke();
      }
      ctx.fillStyle = m.color;                            // la cabezota
      ctx.beginPath(); ctx.ellipse(0, -14, 11, 8.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                          // los lunares de arriba
      [[-5, -18], [1, -20], [6, -17]].forEach(g => {
        ctx.beginPath(); ctx.ellipse(g[0], g[1], 2, 1.4, 0, 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(-4, -13, 3.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, -13, 3.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(-3.4 + vaiven * 0.9, -13, 1.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(5.1 + vaiven * 0.9, -13, 1.6, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                          // la sonrisilla
      ctx.beginPath(); ctx.ellipse(0.5, -8.5, 2, 1.2, 0, 0, 7); ctx.fill();

    } else if (m.forma === 'pavoreal') {
      const plumas = ['#2E8B96', '#3FC1C9', '#4E8ED8', '#8FD3F4', '#3FC1C9'];
      plumas.forEach((c, k) => {                          // la cola en abanico
        const a = -2.5 + k * 0.42 + Math.sin(t * 1.5) * 0.06;
        ctx.strokeStyle = c; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-6, -12);
        ctx.lineTo(-6 + Math.cos(a) * 16, -12 + Math.sin(a) * 16); ctx.stroke();
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.ellipse(-6 + Math.cos(a) * 17, -12 + Math.sin(a) * 17, 3.4, 2.6, a, 0, 7); ctx.fill();
        ctx.fillStyle = '#FFE066';
        ctx.beginPath();
        ctx.arc(-6 + Math.cos(a) * 17, -12 + Math.sin(a) * 17, 1.1, 0, 7); ctx.fill();
      });
      ctx.fillStyle = m.detalle;
      ctx.fillRect(-2 + patas, -5, 2, 5); ctx.fillRect(3 - patas, -5, 2, 5);
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, -11, 8, 7, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = m.color; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(5, -15); ctx.lineTo(8, -23); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(8, -24, 3.2, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3FC1C9'; ctx.lineWidth = 1;     // la cresta
      [-0.3, 0, 0.3].forEach(d => {
        ctx.beginPath(); ctx.moveTo(8, -27); ctx.lineTo(8 + d * 8, -31); ctx.stroke();
      });
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(9, -25, 1.1, 0, 7); ctx.fill();
      ctx.fillStyle = '#E8C33D';
      ctx.beginPath(); ctx.moveTo(11, -24.5); ctx.lineTo(15, -23.5); ctx.lineTo(11, -22.5); ctx.fill();

    } else if (m.forma === 'camaleon') {
      ctx.strokeStyle = m.color; ctx.lineWidth = 2.2;     // la cola enrollada
      ctx.beginPath(); ctx.arc(-11, -12, 4.5, 0.4 + vaiven * 0.2, 5.2); ctx.stroke();
      ctx.fillStyle = m.detalle;
      ctx.fillRect(-4 + patas, -5, 2.6, 5); ctx.fillRect(4 - patas, -5, 2.6, 5);
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, -12, 10, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                          // las manchas que cambian
      [[-4, -14], [1, -16], [5, -12]].forEach((g, i) => {
        ctx.globalAlpha = 0.5 + Math.sin(t * 2 + i * 2) * 0.4;
        ctx.beginPath(); ctx.arc(g[0], g[1], 2.4, 0, 7); ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(9, -18, 5.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5, -24); ctx.lineTo(11, -26); ctx.lineTo(12, -21); ctx.fill();
      ctx.fillStyle = '#FFE066';                          // el ojo giratorio
      ctx.beginPath(); ctx.arc(11, -19, 2.8, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath();
      ctx.arc(11 + Math.cos(t * 2) * 1.2, -19 + Math.sin(t * 2) * 1.2, 1.3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#F8B8C8'; ctx.lineWidth = 1.4;   // la lengua, de vez en cuando
      if (Math.sin(t * 1.3) > 0.93) {
        ctx.beginPath(); ctx.moveTo(14, -17); ctx.lineTo(22, -16); ctx.stroke();
      }

    } else if (m.forma === 'tucan') {
      ctx.fillStyle = m.detalle;
      ctx.fillRect(-2 + patas, -5, 2.2, 5); ctx.fillRect(3 - patas, -5, 2.2, 5);
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, -13, 9, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFF6E0';                          // el pecho
      ctx.beginPath(); ctx.ellipse(4, -14, 5, 5.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = m.color;                            // el ala
      ctx.save(); ctx.translate(-5, -15); ctx.rotate(vaiven * 0.25);
      ctx.beginPath(); ctx.ellipse(0, 0, 4, 6.5, 0, 0, 7); ctx.fill();
      ctx.restore();
      ctx.fillStyle = m.detalle;                          // el pico enorme
      ctx.beginPath(); ctx.moveTo(7, -20); ctx.lineTo(21, -19);
      ctx.lineTo(20, -15); ctx.lineTo(7, -14); ctx.fill();
      ctx.fillStyle = '#E8506B';
      ctx.beginPath(); ctx.moveTo(14, -19.4); ctx.lineTo(21, -19); ctx.lineTo(20.5, -16.5); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(5, -21, 2.8, 0, 7); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(5.6, -21, 1.4, 0, 7); ctx.fill();

    } else if (m.forma === 'axolote') {
      ctx.strokeStyle = m.color; ctx.lineWidth = 2.6;     // la cola de renacuajo
      ctx.beginPath(); ctx.moveTo(-8, -8);
      ctx.quadraticCurveTo(-14, -8 + vaiven * 3, -17, -10); ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.ellipse(0, -9, 10, 6, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(9, -13, 7, 0, 7); ctx.fill();
      ctx.fillStyle = m.detalle;                          // las branquias de plumero
      [[-0.9, 4], [-0.3, 5], [0.3, 4]].forEach((g, i) => {
        const a = g[0] + Math.sin(t * 2.5 + i) * 0.18;
        ctx.beginPath();
        ctx.ellipse(4 + Math.cos(a + 3) * g[1], -17 + Math.sin(a) * 2, 4, 1.8, a, 0, 7); ctx.fill();
        ctx.beginPath();
        ctx.ellipse(14 - Math.cos(a + 3) * g[1], -17 + Math.sin(a) * 2, 4, 1.8, -a, 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(7, -14, 1.3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(12.5, -14, 1.3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3A3A3A'; ctx.lineWidth = 1;     // la sonrisa de siempre
      ctx.beginPath(); ctx.arc(10, -11, 3, 0.3, 2.8); ctx.stroke();
    }
    ctx.restore();
  },

  /* El gatito de la tienda */
  dibujarGato(ctx, x, yPies, esc, m, mirando, t) {
    ctx.save();
    ctx.translate(x, yPies);
    ctx.scale(esc * (mirando < 0 ? -1 : 1), esc);
    ctx.strokeStyle = m.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, -12);
    ctx.quadraticCurveTo(-18, -18 + Math.sin(t * 3) * 4, -14, -26); ctx.stroke();
    ctx.fillStyle = m.color;
    ctx.beginPath(); ctx.ellipse(0, -10, 10, 7, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -18, 7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, -23); ctx.lineTo(4, -30); ctx.lineTo(9, -24); ctx.fill();
    ctx.beginPath(); ctx.moveTo(11, -24); ctx.lineTo(15, -29); ctx.lineTo(15, -22); ctx.fill();
    ctx.fillStyle = m.detalle;
    ctx.beginPath(); ctx.ellipse(2, -6, 6, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    ctx.beginPath(); ctx.arc(11, -19, 1.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -19, 1.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#E8607F';
    ctx.beginPath(); ctx.arc(13.5, -16, 1.4, 0, 7); ctx.fill();
    ctx.fillStyle = m.color;
    const pa = Math.sin(t * 8) * 1.5;
    ctx.fillRect(-5 + pa, -5, 3, 5); ctx.fillRect(4 - pa, -5, 3, 5);
    ctx.restore();
  },

  /* La nutria de l'Illa Petita */
  dibujarNutria(ctx, x, yPies, esc, m, mirando, t) {
    ctx.save();
    ctx.translate(x, yPies);
    ctx.scale(esc * (mirando < 0 ? -1 : 1), esc);
    ctx.fillStyle = m.color;                                   // cola gorda
    ctx.beginPath(); ctx.ellipse(-14, -8, 10, 5, 0.3 + Math.sin(t * 3) * 0.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -10, 12, 8, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -18, 7, 0, 7); ctx.fill();
    ctx.fillStyle = m.detalle;                                  // barriga y morro
    ctx.beginPath(); ctx.ellipse(2, -7, 7, 4, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, -16, 5, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = m.color;
    ctx.beginPath(); ctx.arc(6, -24, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(14, -24, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    ctx.beginPath(); ctx.arc(9, -19, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(15, -18, 1.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(18, -15, 1.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#B5B0A8';                                  // su piedra
    ctx.beginPath(); ctx.ellipse(-2, -18, 5, 3.5, 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = m.color;
    const p = Math.sin(t * 8) * 1.2;
    ctx.fillRect(-5 + p, -4, 3, 4); ctx.fillRect(5 - p, -4, 3, 4);
    ctx.restore();
  },

  /* El dragoncito del huevo: revolotea un poco por encima del suelo */
  dibujarDragon(ctx, x, yPies, esc, m, mirando, t) {
    ctx.save();
    ctx.translate(x, yPies - 6 + Math.sin(t * 3) * 3);
    ctx.scale(esc * (mirando < 0 ? -1 : 1), esc);

    const bat = Math.sin(t * 9);
    ctx.fillStyle = 'rgba(126,214,165,0.75)';                 // alas
    ctx.beginPath(); ctx.ellipse(-4, -18, 11, 6 + bat * 4, -0.7, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -20, 10, 6 + bat * 4, -0.4, 0, 7); ctx.fill();

    ctx.fillStyle = m.detalle;                                // cola
    ctx.beginPath(); ctx.moveTo(-8, -10);
    ctx.quadraticCurveTo(-20, -6 + bat * 2, -16, -16); ctx.fill();

    ctx.fillStyle = m.color;                                  // cuerpo y cabeza
    ctx.beginPath(); ctx.ellipse(0, -11, 10, 8, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -19, 7, 0, 7); ctx.fill();
    ctx.fillStyle = m.detalle;                                // cuernos y cresta
    ctx.beginPath(); ctx.moveTo(5, -25); ctx.lineTo(6, -31); ctx.lineTo(9, -25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2, -18); ctx.lineTo(-1, -23); ctx.lineTo(2, -18); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    ctx.beginPath(); ctx.arc(11, -20, 1.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFB3C6';
    ctx.beginPath(); ctx.ellipse(0, -6, 7, 4, 0, 0, 7); ctx.fill();
    ctx.restore();
  },
};

</script>
<script>
/* === motor/ui.js === */
/* LA INTERFAZ: pantallas, diálogos, avisos y el botón de altavoz.
   Los textos van en HTML (no dibujados en el lienzo) para que se puedan leer
   con letra grande y funcionen bien tocando en la tableta.

   Regla de manejo: el botón grande de cada ventana se pulsa con la barra
   espaciadora o con la J, sin soltar las manos del teclado. Para salir hay que
   ir a propósito a la X de la esquina. Así jugar es rápido y salirse no. */

const UI = {

  modal: null,
  temporizadorVoz: null,

  iniciar() {
    this.modal = document.getElementById('modal');
  },

  pantalla(id) {
    ['inicio', 'crear', 'juego'].forEach(p => {
      document.getElementById(p).classList.toggle('oculto', p !== id);
    });
  },

  /* html = contenido; alCerrar = qué hace la X (si no, cerrar sin más) */
  abrir(html, alCerrar) {
    this.modal.innerHTML =
      '<div class="caja"><button class="cerrar" title="Salir">✕</button>' + html + '</div>';
    this.modal.classList.remove('oculto');
    // En el móvil, Lumi se aparta mientras hay una ventana abierta
    document.body.classList.add('con-modal');
    this.modal.querySelector('.cerrar').onclick = () => {
      Sonido.clic();
      if (alCerrar) alCerrar(); else this.cerrar();
    };
  },

  cerrar() {
    this.modal.classList.add('oculto');
    document.body.classList.remove('con-modal');
    this.modal.innerHTML = '';
    this.pararVoz();
    if (window.Musica && Estado.actual) Musica.segunSitio();
  },

  estaAbierto() { return !this.modal.classList.contains('oculto'); },

  /* Espacio, J o Enter pulsan el botón grande. Escape es la salida. */
  tecla(k) {
    if (k === 'Escape') {
      const x = this.modal.querySelector('.cerrar');
      if (x) x.click();
      return;
    }
    if (k === ' ' || k === 'j' || k === 'J' || k === 'Enter') {
      const b = this.modal.querySelector('.defecto');
      if (b && !b.disabled) b.click();
    }
  },

  /* Diálogo de un personaje. El primero de la lista es el botón grande. */
  dialogo(quien, texto, opciones) {
    const ops = opciones || [{ texto: 'Vale', accion: () => UI.cerrar() }];
    const botones = ops.map((o, i) =>
      `<button class="btn ${i === 0 ? 'defecto' : ''}" data-i="${i}">${o.texto}` +
      (i === 0 ? '<span class="tecla">espacio</span>' : '') + '</button>').join('');

    this.abrir(`
      ${quien ? `<div class="quien">${quien}</div>` : ''}
      <p class="dice">${texto}</p>
      <div class="altavoz" id="zonaVoz"></div>
      <div class="botones">${botones}</div>
    `);
    this.modal.querySelectorAll('.btn').forEach(b => {
      b.onclick = () => { Sonido.clic(); ops[+b.dataset.i].accion(); };
    });
    this.prepararAltavoz(texto);
  },

  // --- El altavoz: no está, aparece --------------------------------------
  prepararAltavoz(texto) {
    if (!AJUSTES.vozActivada) return;
    const zona = document.getElementById('zonaVoz');
    if (!zona) return;
    const nivel = Estado.actual ? Estado.actual.nivel : 'mayor';
    const espera = AJUSTES.segundosAltavoz[nivel] * 1000;
    clearTimeout(this.temporizadorVoz);
    this.temporizadorVoz = setTimeout(() => {
      if (!document.body.contains(zona)) return;
      zona.innerHTML = '<button class="btn-voz">🔊 Escuchar</button>';
      zona.querySelector('.btn-voz').onclick = () => UI.hablar(texto);
    }, espera);
  },

  hablar(texto) {
    if (!AJUSTES.vozActivada || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const v = new SpeechSynthesisUtterance(texto.replace(/<[^>]*>/g, ' '));
    v.lang = 'es-ES';
    v.rate = 0.92;
    speechSynthesis.speak(v);
  },

  pararVoz() {
    clearTimeout(this.temporizadorVoz);
    if (window.speechSynthesis) speechSynthesis.cancel();
  },

  aviso(texto, duracion) {
    const d = document.createElement('div');
    d.className = 'aviso';
    d.innerHTML = texto;
    document.getElementById('juego').appendChild(d);
    setTimeout(() => d.remove(), duracion || 2600);
  },

  refrescarHud() {
    const p = Estado.actual;
    if (!p) return;
    document.getElementById('conchas').textContent = p.conchas;
    document.getElementById('cristales').textContent = p.cristales.length + '/5';
    document.getElementById('nombreJugadora').textContent = p.nombre;
    document.getElementById('mandos').classList.toggle('oculto',
      p.control !== 'raton' && !UI.esTactil());
  },

  esTactil() {
    return window.matchMedia('(pointer: coarse)').matches;
  },
};

</script>
<script>
/* === motor/desafios.js === */
/* EL MOTOR DE LOS RETOS
   Se ocupa de la fase 1 (elegir qué operación toca) y de las mecánicas de la
   fase 2 que ocurren en una ventana: coger la cantidad justa y repartir en
   cestas. El camino de piedras ocurre dentro del mundo, y está en juego.js */

/* Números al azar dentro de un rango: la base para que nada se repita */
function AZ(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

/* Sustituye {a}, {b}, {sol}… por los números de esta vez */
function rellenar(texto, v) {
  if (typeof texto !== 'string') return texto;
  return texto.replace(/\{(\w+)\}/g, (m, k) => (v[k] !== undefined ? v[k] : m));
}

/* Coge un reto o un problema con marcadores y lo deja listo con sus números.
   Si no tiene 'vars', se devuelve tal cual: los de siempre siguen funcionando. */
function montarConNumeros(base) {
  if (!base || !base.vars) return base;
  const v = base.vars();
  const salida = {};
  Object.keys(base).forEach(k => {
    if (k === 'vars') return;
    const val = base[k];
    if (typeof val === 'string') {
      const puesto = rellenar(val, v);
      // los campos que son números (objetivo, total, sol…) vuelven a ser números
      salida[k] = /^-?\d+$/.test(puesto) ? +puesto : puesto;
    } else if (Array.isArray(val)) {
      salida[k] = val.map(x => (typeof x === 'string' ? rellenar(x, v) : x));
    } else if (val && typeof val === 'object') {
      const o = {};
      Object.keys(val).forEach(k2 => { o[k2] = rellenar(val[k2], v); });
      salida[k] = o;
    } else salida[k] = val;
  });
  if (salida.preguntas) {
    salida.preguntas = base.preguntas.map(p => ({
      texto: rellenar(p.texto, v),
      sol: typeof p.sol === 'string' ? +rellenar(p.sol, v) : p.sol,
    }));
  }
  if (v.sol !== undefined && salida.sol === undefined) salida.sol = v.sol;
  return salida;
}

/* La pregunta, en su propia línea y en negrita: es lo que más hay que leer,
   porque la misma escena puede preguntar cosas distintas. */
function conPregunta(texto) {
  if (typeof texto !== 'string') return texto;
  const i = texto.lastIndexOf('¿');
  if (i <= 0) return texto;
  return texto.slice(0, i).trim() + '<br><b>' + texto.slice(i) + '</b>';
}

function barajar(lista) { return lista.slice().sort(() => Math.random() - 0.5); }

/* Las tarjetas salen unos segundos después del texto: primero se lee */
function esperarTarjetas() {
  const t = UI.modal.querySelector('.tarjetas');
  if (!t) return;
  t.classList.add('esperando');
  setTimeout(() => t.classList.remove('esperando'),
    AJUSTES.segundosAntesDeTarjetas[Estado.actual.nivel] * 1000);
}

const Desafio = {

  parada: null,
  reto: null,
  fallos: 0,
  alTerminar: null,

  /* Devuelve el reto que toca: el fácil si el personaje se durmió, y si no,
     una variante al azar (nunca la misma que la última vez), para que no se
     pueda hacer de memoria sin leer. */
  elegir(id) {
    const p = Estado.actual;
    const bloque = RETOS[id][p.nivel];
    if (!p.facilitados) p.facilitados = {};
    if (!p.ultimaVariante) p.ultimaVariante = {};
    let r;
    if (p.facilitados[id]) r = montarConNumeros(bloque.facil);
    else {
      const n = bloque.variantes.length;
      let i = Math.floor(Math.random() * n);
      if (n > 1 && i === p.ultimaVariante[id]) i = (i + 1 + Math.floor(Math.random() * (n - 1))) % n;
      p.ultimaVariante[id] = i;
      r = bloque.variantes[i].delBanco ? this.retoDelBanco(p.nivel) : montarConNumeros(bloque.variantes[i]);
    }
    r.enunciado = conPregunta(r.enunciado);
    return r;
  },

  /* Un problema del banco hecho reto: el dueño de la atracción te lo plantea
     y se contesta con el teclado. Así en cualquier sitio puede salir
     cualquier forma de problema. */
  retoDelBanco(nivel) {
    const pr = montarConNumeros(problemaPara(nivel, this.ultimoTipo, Estado.actual.problemas));
    this.ultimoTipo = pr.tipo;
    return Object.assign({}, pr, {
      mecanica: 'cerradura', preguntas: [{ texto: '', sol: pr.sol }],
      moralejaPropia: { titulo: 'Lo que había que ver', texto: pr.clave },
    });
  },

  quien(id) {
    const p = MUNDO.lugares.find(x => x.id === id);
    return (p && p.personaje) || RETOS[id].quien || null;
  },

  abrir(id, alTerminar) {
    Musica.poner('reto');
    this.parada = id;
    this.alTerminar = alTerminar;
    this.fallos = 0;
    const info = RETOS[id];

    // Los sitios ya no se sortean: siempre hay reto. Pero si se falla tres
    // veces, el personaje se duerme (no se acierta a base de probar), y
    // repetir un reto ya ganado hoy no paga (12-09-2026).
    if (Estado.estaDormido(id)) {
      UI.dialogo(this.quien(id), info.dormido +
        '<br><br><b>Ve al salón de juegos con Coco</b> y juega una ronda para despertarle.',
        [{ texto: 'Vale', accion: () => UI.cerrar() }]);
      return;
    }

    this.fallosLeer = 0;
    this.reto = this.elegir(id);
    const p = Estado.actual;
    let saludo = (p.facilitados && p.facilitados[id]) ? info.despierta : info.saludo;

    // La miel en los labios: qué se lleva si lo consigue
    if (!Estado.tieneCristal(id)) {
      const regalos = [info.premio, info.premio2]
        .filter(Boolean)
        .map(pr => (ROPA[pr.tipo].find(o => o.id === pr.id) || {}).nombre)
        .filter(Boolean);
      if (regalos.length) {
        saludo += '<br><br>✨ Si lo consigues te llevas <b>' + regalos.join('</b> y <b>') +
                  '</b>, y un cristal del Farol.';
      }
    }

    UI.dialogo(this.quien(id), saludo, [
      { texto: 'A ver, cuéntame', accion: () => this.fase1() },
    ]);
  },

  // --- Fase 1: ¿qué hay que hacer aquí? ---------------------------------
  fase1() {
    const r = this.reto;
    if (!r.operacion) {                          // el camino de piedras: solo el cartel
      return UI.dialogo(null, r.enunciado, [
        { texto: '¡Allá voy!', accion: () => this.fase2() },
      ]);
    }

    /* A las mayores les salen a veces con el nombre de clase (Sumar, Dividir…)
       y a veces con el de casa, para que aten los dos. A las pequeñas, siempre
       el de casa. Y en la misma pantalla, todas del mismo estilo. */
    const tecnico = Estado.actual.nivel === 'mayor' && Math.random() < 0.5;
    const nombre = (o) => tecnico ? OPERACIONES[o].tecnico : OPERACIONES[o].texto;

    /* A las mayores, siempre las cuatro operaciones (menos en la versión
       fácil): con dos o tres tarjetas se acierta probando sin leer. Y en
       distinto orden cada vez, para que no valga acordarse del sitio. */
    let ops = r.opciones.slice();
    if (Estado.actual.nivel === 'mayor' && ops.length > 2)
      ['juntar', 'quitar', 'multiplicar', 'repartir'].forEach(o => {
        if (ops.length < 4 && !ops.includes(o)) ops.push(o);
      });
    const tarjetas = barajar(ops).map(o => `
      <button class="tarjeta" data-op="${o}">
        <span class="icono">${OPERACIONES[o].icono}</span>
        <span>${nombre(o)}</span>
      </button>`).join('');

    UI.abrir(`
      <p class="dice">${r.enunciado}</p>
      <div class="altavoz" id="zonaVoz"></div>
      <p class="pregunta">¿Qué hay que hacer?</p>
      <div class="tarjetas">${tarjetas}</div>
      <p class="pista" id="pista"></p>
    `);
    esperarTarjetas();
    UI.prepararAltavoz(r.enunciado + ' ¿Qué hay que hacer?');

    UI.modal.querySelectorAll('.tarjeta').forEach(b => {
      b.onclick = () => {
        if (b.dataset.op === r.operacion) {
          b.classList.add('bien');
          Sonido.acierto();
          document.getElementById('pista').innerHTML =
            '✅ Eso es: <b>' + OPERACIONES[r.operacion].pista + '</b>.';
          setTimeout(() => this.fase2(), 900);
        } else {
          b.classList.add('mal');
          Sonido.fallo();
          const razon = (r.explica && r.explica[b.dataset.op]) || 'Mmm… así no nos sale. Vuelve a leer la pregunta.';
          document.getElementById('pista').innerHTML = '💭 ' + razon;
          this.fallosLeer++;
          this.sumarFallo();
        }
      };
    });
  },

  // --- Fase 2: hacerlo ---------------------------------------------------
  fase2() {
    if (this.reto.mecanica === 'coger') this.mecanicaCoger();
    else if (this.reto.mecanica === 'repartir') this.mecanicaRepartir();
    else if (this.reto.mecanica === 'limpiar') this.mecanicaLimpiar();
    else if (this.reto.mecanica === 'pescar') this.mecanicaPescar();
    else if (this.reto.mecanica === 'palabras') this.mecanicaPalabras();
    else if (this.reto.mecanica === 'cerradura') this.mecanicaCerradura();
    else if (this.reto.mecanica === 'piedras') {
      // Este reto no se juega en una ventana: se juega en la isla
      UI.cerrar();
      Juego.entrarPiedras(this.reto);
    }
  },

  /* Coger la cantidad justa tocando conchas en la arena */
  mecanicaCoger() {
    const r = this.reto;
    let llevo = 0;
    const conchas = Array.from({ length: r.total }, (_, i) =>
      `<button class="concha" data-i="${i}">🐚</button>`).join('');

    UI.abrir(`
      <p class="dice">${r.enunciado}</p>
      <div class="contador">En el cesto: <b id="llevo">0</b></div>
      <div class="arena">${conchas}</div>
      <p class="pista" id="pista"></p>
      <div class="botones"><button class="btn defecto" id="listo">Ya está<span class="tecla">espacio</span></button></div>
    `);

    UI.modal.querySelectorAll('.concha').forEach(b => {
      b.onclick = () => {
        if (b.classList.contains('cogida')) { b.classList.remove('cogida'); llevo--; }
        else { b.classList.add('cogida'); llevo++; }
        Sonido.clic();
        document.getElementById('llevo').textContent = llevo;
      };
    });

    document.getElementById('listo').onclick = () => {
      if (llevo === r.objetivo) this.exito();
      else {
        document.getElementById('pista').innerHTML =
          (llevo < r.objetivo ? '💭 Todavía faltan. ' : '💭 Van demasiadas. ') + this.pista();
        Sonido.fallo();
        this.sumarFallo();
      }
    };
  },

  /* Repartir la fruta en cestas: toco una cesta y cae una fruta del montón.
     En el montón hay MÁS fruta de la que se usa ('sobran') y a veces más
     cestas de las que se llenan ('cestasVisibles'): los números hay que
     sacarlos del texto, no vale vaciarlo todo a toques. Al final se escribe
     la respuesta a lo que se preguntaba. */
  mecanicaRepartir() {
    const r = this.reto;
    const frutas = ['🍎', '🍊', '🍐', '🍓', '🍌'];
    const cara = frutas[Math.floor(Math.random() * frutas.length)];
    const porCesta = r.frutas / r.cestas;
    let monton = r.frutas + (r.sobran || 0);
    const cestas = Array(r.cestasVisibles || r.cestas).fill(0);
    const puestas = [];                          // para poder deshacer

    const pintar = () => {
      document.getElementById('monton').innerHTML =
        Array(monton).fill(`<span class="fruta">${cara}</span>`).join('');
      cestas.forEach((n, i) => {
        document.getElementById('cesta' + i).innerHTML =
          '🧺<span class="dentro">' + Array(n).fill(cara).join('') + '</span>' +
          '<b class="cuenta">' + n + '</b>';
      });
    };

    UI.abrir(`
      <p class="dice">${r.enunciado}</p>
      <div class="monton" id="monton"></div>
      <p class="pregunta">Toca la cesta donde va cada fruta</p>
      <div class="cestas">
        ${cestas.map((_, i) => `<button class="cesta" id="cesta${i}" data-i="${i}"></button>`).join('')}
      </div>
      <p class="pista" id="pista"></p>
      <div class="botones">
        <button class="btn defecto" id="listo">Ya está<span class="tecla">espacio</span></button>
        <button class="btn gris" id="deshacer">↩️ Quitar la última</button>
      </div>
    `);
    pintar();

    UI.modal.querySelectorAll('.cesta').forEach(b => {
      b.onclick = () => {
        const i = +b.dataset.i;
        if (monton > 0) { monton--; cestas[i]++; puestas.push(i); }
        Sonido.clic();
        pintar();
      };
    });
    document.getElementById('deshacer').onclick = () => {
      if (!puestas.length) return;
      cestas[puestas.pop()]--; monton++;
      Sonido.clic();
      pintar();
    };

    document.getElementById('listo').onclick = () => {
      const llenas = cestas.filter(n => n > 0);
      const puestasYa = llenas.reduce((a, n) => a + n, 0);
      let queFalla = '';
      if (puestasYa < r.frutas) queFalla = 'Todavía faltan frutas en las cestas. ';
      else if (puestasYa > r.frutas) queFalla = 'Has puesto más fruta de la que decía. ';
      else if (llenas.length !== r.cestas) queFalla = 'Mira bien cuántas cestas hay que llenar. ';
      else if (!llenas.every(n => n === porCesta)) queFalla = 'Las cestas no tienen lo mismo. ';
      if (!queFalla) return this.preguntaFinal();
      document.getElementById('pista').innerHTML = '💭 ' + queFalla + this.pista();
      Sonido.fallo();
      this.sumarFallo();
    };
  },

  /* Después de hacerlo con las manos, se contesta a la pregunta del texto */
  preguntaFinal() {
    const r = this.reto;
    let marcado = '';
    UI.abrir(`
      <p class="dice">${r.enunciado}</p>
      <div class="pantallita" id="marcado">—</div>
      <div class="teclado">
        ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="tecla-num" data-n="${n}">${n}</button>`).join('')}
        <button class="tecla-num borrar" data-n="x">⌫</button>
      </div>
      <div class="botones"><button class="btn defecto" id="probar">Ya lo tengo<span class="tecla">espacio</span></button></div>
      <p class="pista" id="pista">Escribe la respuesta a la pregunta.</p>
    `);
    UI.modal.querySelectorAll('.tecla-num').forEach(b => {
      b.onclick = () => {
        Sonido.clic();
        if (b.dataset.n === 'x') marcado = marcado.slice(0, -1);
        else if (marcado.length < 3) marcado += b.dataset.n;
        document.getElementById('marcado').textContent = marcado || '—';
      };
    });
    document.getElementById('probar').onclick = () => {
      const sol = r.sol !== undefined ? r.sol : r.frutas / r.cestas;   // si no dice, «cuántas en cada una»
      if (marcado !== '' && +marcado === sol) { Sonido.acierto(); return setTimeout(() => this.exito(), 400); }
      Sonido.fallo();
      document.getElementById('pista').innerHTML = '💭 Lee otra vez qué se pregunta. ' + this.pista();
      marcado = '';
      document.getElementById('marcado').textContent = '—';
      this.sumarFallo();
    };
  },

  /* UN PROBLEMA DEL BANCO: lo importante del juego.
     Se lee, se decide qué hay que hacer y se teclea el resultado. Al final se
     explica QUÉ HABÍA QUE VER, que es lo que de verdad se aprende. */
  problema(nivel, alTerminar) {
    const p = montarConNumeros(problemaPara(nivel, this.ultimoTipo, Estado.actual.problemas));
    this.ultimoTipo = p.tipo;
    p.enunciado = conPregunta(p.enunciado);
    this.problemaActual = p;
    this.alTerminar = alTerminar;
    this.parada = null;
    this.fallos = 0;
    this.pintarProblema(p);
  },

  pintarProblema(p) {
    const tecnico = Estado.actual.nivel === 'mayor' && Math.random() < 0.5;
    const nombre = (o) => tecnico ? OPERACIONES[o].tecnico : OPERACIONES[o].texto;

    UI.abrir(`
      <div class="quien">Un problema</div>
      <p class="dice">${p.enunciado}</p>
      <div class="altavoz" id="zonaVoz"></div>
      <p class="pregunta">¿Qué hay que hacer?</p>
      <div class="tarjetas">
        ${barajar(p.opciones).map(o => `
          <button class="tarjeta" data-op="${o}">
            <span class="icono">${OPERACIONES[o].icono}</span>
            <span>${nombre(o)}</span>
          </button>`).join('')}
      </div>
      <p class="pista" id="pista"></p>
    `);
    esperarTarjetas();
    UI.prepararAltavoz(p.enunciado + ' ¿Qué hay que hacer?');

    UI.modal.querySelectorAll('.tarjeta').forEach(b => {
      b.onclick = () => {
        if (b.dataset.op === p.operacion) {
          b.classList.add('bien');
          Sonido.acierto();
          document.getElementById('pista').innerHTML =
            '✅ Eso es: <b>' + OPERACIONES[p.operacion].pista + '</b>.';
          setTimeout(() => this.responderProblema(p), 1000);
        } else {
          b.classList.add('mal');
          Sonido.fallo();
          document.getElementById('pista').innerHTML =
            '💭 ' + ((p.explica && p.explica[b.dataset.op]) || 'Vuelve a leer el problema con calma.');
          this.fallos++;
        }
      };
    });
  },

  responderProblema(p) {
    let marcado = '';
    const pintar = () => {
      UI.abrir(`
        <p class="dice">${p.enunciado}</p>
        <div class="pantallita" id="marcado">${marcado || '—'}</div>
        <div class="teclado">
          ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="tecla-num" data-n="${n}">${n}</button>`).join('')}
          <button class="tecla-num borrar" data-n="x">⌫</button>
        </div>
        <div class="botones"><button class="btn defecto" id="probar">Ya lo tengo<span class="tecla">espacio</span></button></div>
        <p class="pista" id="pista"></p>
      `);
      UI.modal.querySelectorAll('.tecla-num').forEach(b => {
        b.onclick = () => {
          Sonido.clic();
          if (b.dataset.n === 'x') marcado = marcado.slice(0, -1);
          else if (marcado.length < 4) marcado += b.dataset.n;
          document.getElementById('marcado').textContent = marcado || '—';
        };
      });
      document.getElementById('probar').onclick = () => {
        if (marcado !== '' && +marcado === p.sol) {
          Sonido.acierto();
          setTimeout(() => this.premiarProblema(p), 400);
        } else {
          Sonido.fallo();
          this.fallos++;
          const pistas = p.pistas || [];
          document.getElementById('pista').innerHTML =
            '💭 ' + (pistas[Math.min(this.fallos - 1, pistas.length - 1)] || 'Vuelve a leerlo.');
          marcado = '';
          document.getElementById('marcado').textContent = '—';
        }
      };
    };
    pintar();
  },

  premiarProblema(p) {
    const paga = Estado.darConchasConTope(AJUSTES.conchasPorProblema);
    const nueva = Estado.apuntarProblema(p.tipo) === 1 && novedad('album');
    const cofre = this.fallos === 0 && Cofre.toca();     // sin fallos = leído a la primera
    const luego = (f) => (cofre ? Cofre.abrir(f) : f());
    UI.refrescarHud();
    Sonido.fiesta();
    setTimeout(() => Sonido.moneda(), 400);

    UI.abrir(`
      <div class="quien">💡 Lo que había que ver aquí</div>
      <p class="dice">${p.clave}</p>
      <div class="altavoz" id="zonaVoz"></div>
      <p class="contador">${paga ? '🐚 <b>+' + paga + ' conchas</b>'
        : '🐚 <small>Por hoy ya has ganado todas las conchas que se pueden ganar aquí. ' +
          'Los problemas siguen contando para el álbum.</small>'}</p>
      ${nueva ? '<p class="contador">📒 <b>¡Pegatina nueva!</b> Mírala en tus cuadernos 📔</p>' : ''}
      <div class="botones">
        <button class="btn defecto" id="otro">Otro problema<span class="tecla">espacio</span></button>
        <button class="btn gris" id="basta">Ya está bien</button>
      </div>
    `);
    UI.prepararAltavoz(p.clave.replace(/<[^>]*>/g, ' '));
    document.getElementById('otro').onclick = () => {
      Sonido.clic();
      luego(() => this.problema(Estado.actual.nivel, this.alTerminar));
    };
    document.getElementById('basta').onclick = () => {
      Sonido.clic();
      luego(() => { UI.cerrar(); if (this.alTerminar) this.alTerminar(true); });
    };
  },

  /* PESCAR: pican los peces cuya cuenta da el número que pide Tomeu.
     Se aprende que a un mismo número se llega por caminos distintos. */
  mecanicaPescar() {
    const r = this.reto;
    const meta = r.objetivo;
    const az = (n) => 1 + Math.floor(Math.random() * n);

    /* Fabrica un pez: la mitad valen lo que se busca y la otra mitad no */
    const hacerPez = (bueno) => {
      const tipo = r.tipos[Math.floor(Math.random() * r.tipos.length)];
      const valor = bueno ? meta : Math.max(1, meta + (Math.random() < 0.5 ? -1 : 1) * az(4));
      if (tipo === 'multiplicacion') {
        for (let a = 2; a <= 9; a++) if (valor % a === 0 && valor / a <= 9 && valor / a >= 2)
          return { texto: a + ' × ' + (valor / a), valor: valor };
      }
      if (tipo === 'resta') {
        const b = az(6);
        return { texto: (valor + b) + ' − ' + b, valor: valor };
      }
      const a = 1 + Math.floor(Math.random() * (valor - 1));
      return { texto: a + ' + ' + (valor - a), valor: valor };
    };

    const peces = [];
    const buenos = Math.max(2, Math.round(r.cuantos * 0.45));
    for (let i = 0; i < r.cuantos; i++) peces.push(hacerPez(i < buenos));
    peces.sort(() => Math.random() - 0.5);
    let pescados = 0;

    UI.abrir(`
      <div class="quien">Tomeu</div>
      <p class="dice">${r.enunciado}</p>
      <p class="pregunta">Toca los peces que valgan <b>${meta}</b></p>
      <div class="mar">
        ${peces.map((p, i) => `<button class="pez" data-i="${i}">🐟<span>${p.texto}</span></button>`).join('')}
      </div>
      <div class="contador">🪣 En el cubo: <b id="llevo">0</b> de ${buenos}</div>
      <p class="pista" id="pista"></p>
    `);

    UI.modal.querySelectorAll('.pez').forEach(b => {
      b.onclick = () => {
        if (b.disabled) return;
        const p = peces[+b.dataset.i];
        if (p.valor === meta) {
          b.classList.add('pescado'); b.disabled = true;
          pescados++;
          Sonido.acierto();
          document.getElementById('llevo').textContent = pescados;
          if (pescados === buenos) setTimeout(() => this.exito(), 500);
        } else {
          b.classList.add('escapa');
          Sonido.plof();
          document.getElementById('pista').innerHTML =
            '💭 Ese vale <b>' + p.valor + '</b>, no ' + meta + '. ' + this.pista();
          setTimeout(() => b.classList.remove('escapa'), 700);
          this.sumarFallo();
        }
      };
    });
  },

  /* LIMPIAR: se frotan las manchas una a una hasta dejar las que toca */
  mecanicaLimpiar() {
    const r = this.reto;
    let quitadas = 0;
    const manchas = Array.from({ length: r.total }, (_, i) =>
      `<button class="mancha" data-i="${i}">🟤</button>`).join('');

    UI.abrir(`
      <p class="dice">${r.enunciado}</p>
      <div class="contador">🧽 Limpiadas: <b id="llevo">0</b></div>
      <div class="barro">${manchas}</div>
      <p class="pista" id="pista"></p>
      <div class="botones"><button class="btn defecto" id="listo">Ya está<span class="tecla">espacio</span></button></div>
    `);

    UI.modal.querySelectorAll('.mancha').forEach(b => {
      b.onclick = () => {
        if (b.classList.contains('limpia')) { b.classList.remove('limpia'); quitadas--; }
        else { b.classList.add('limpia'); quitadas++; Sonido.ruido(0.06, 2600, 0.05); }
        document.getElementById('llevo').textContent = quitadas;
      };
    });

    document.getElementById('listo').onclick = () => {
      if (quitadas === r.objetivo) this.exito();
      else {
        document.getElementById('pista').innerHTML =
          (quitadas < r.objetivo ? '💭 Todavía quedan. ' : '💭 Te has pasado. ') + this.pista();
        Sonido.fallo();
        this.sumarFallo();
      }
    };
  },

  /* LAS PALABRAS DIFÍCILES: primero la norma, luego las palabras.
     Cada visita toca UNA norma: se enseña, hay que aplicarla para pasar, las
     palabras son todas de esa norma, las falladas vuelven al final y antes de
     salir se pregunta la norma otra vez. Los colores siempre dicen lo mismo:
     naranja a/o/u → j, tj, ç;  azul e/i → g, tg, c. */
  mecanicaPalabras() {
    const r = this.reto;
    const nivel = Estado.actual.nivel;
    const grupo = r.grupo || grupoConNorma(nivel);
    let lista = palabrasPara(nivel, r.cuantas || 3, r.faciles, grupo);
    if (!lista.length) lista = palabrasPara(nivel, r.cuantas || 3, r.faciles);
    const regla = REGLAS[grupo];
    const falladas = [];
    let i = 0, repescando = false;

    // 1) La norma, y no se pasa sin usarla
    const tarjeta = (insiste) => {
      UI.abrir(`
        <div class="quien">Pau</div>
        <p class="dice"><b>${regla.titulo}</b></p>
        <div class="norma">${colorear(regla.texto)}</div>
        ${insiste ? '<p class="pista">💭 Vuelve a mirarlo arriba, que ahí está.</p>' : ''}
        <p class="pregunta">${regla.comprueba.pregunta}</p>
        <div class="botones grandes">
          ${regla.comprueba.opciones.map((o, n) =>
            `<button class="btn num" data-n="${n}">${colorear(o)}</button>`).join('')}
        </div>
      `);
      UI.modal.querySelectorAll('.num').forEach(bt => {
        bt.onclick = () => {
          if (+bt.dataset.n === regla.comprueba.correcta) {
            bt.classList.add('bien'); Sonido.acierto();
            setTimeout(siguiente, 800);
          } else {
            bt.classList.add('mal'); Sonido.fallo();
            setTimeout(() => tarjeta(true), 700);
          }
        };
      });
    };

    // 2) Las palabras de esa norma
    const siguiente = () => {
      if (i >= lista.length) {
        if (!repescando && falladas.length) {      // las falladas, otra vez
          repescando = true; lista = falladas.slice(); i = 0;
        } else return regla ? recordar() : this.exito();
      }
      const p = lista[i];
      const hueco = '<span class="hueco">?</span>';
      // la vocal de detrás va en color: es la que manda
      const palabra = p.inicio + hueco + colorear(p.fin.replace(/^([aeiou])/, '{$1}'));
      const color = (i === 0 && !repescando);      // el color solo al principio

      UI.abrir(`
        <div class="quien">Pau</div>
        <p class="dice">${p.frase.replace('___', '<b>' + palabra + '</b>')}</p>
        <div class="altavoz" id="zonaVoz"></div>
        <p class="pregunta">Quina lletra hi falta?</p>
        <div class="botones grandes">
          ${p.opciones.map(o => `<button class="btn num" data-v="${o}">${
            o === '' ? 'res' : (color ? colorear('{' + o + '}') : o)}</button>`).join('')}
        </div>
        <p class="contador">${i + 1} de ${lista.length} · ${repescando ? 'otra vez' : p.grupo}</p>
        <p class="pista" id="pista"></p>
      `);
      UI.prepararAltavoz(p.frase.replace('___', p.inicio + p.correcta + p.fin));

      UI.modal.querySelectorAll('.num').forEach(b => {
        b.onclick = () => {
          if (b.dataset.v === p.correcta) {
            b.classList.add('bien');
            Sonido.acierto();
            document.getElementById('pista').innerHTML =
              '✅ <b>' + (p.inicio + p.correcta + p.fin) + '</b>';
            i++;
            setTimeout(siguiente, 1100);
          } else {
            b.classList.add('mal'); b.disabled = true;
            Sonido.fallo();
            if (!repescando && !falladas.includes(p)) falladas.push(p);
            document.getElementById('pista').textContent = '💭 ' + p.pista;
            this.sumarFallo();
          }
        };
      });
    };

    // 3) Antes de salir, la norma otra vez
    const recordar = () => {
      const q = regla.recuerda;
      UI.abrir(`
        <div class="quien">Pau</div>
        <p class="dice">${q.pregunta}</p>
        <div class="botones grandes">
          ${q.opciones.map((o, n) =>
            `<button class="btn num" data-n="${n}">${colorear('{' + o + '}')}</button>`).join('')}
        </div>
        <p class="pista" id="pista"></p>
      `);
      UI.modal.querySelectorAll('.num').forEach(bt => {
        bt.onclick = () => {
          if (+bt.dataset.n === q.correcta) {
            bt.classList.add('bien'); Sonido.acierto();
            setTimeout(() => this.exito(), 800);
          } else {
            bt.classList.add('mal'); bt.disabled = true; Sonido.fallo();
            document.getElementById('pista').innerHTML = colorear(regla.texto);
          }
        };
      });
    };

    if (regla) tarjeta(false); else siguiente();
  },

  /* LA CERRADURA: se teclea el número en un teclado de pantalla */
  mecanicaCerradura() {
    const r = this.reto;
    const preguntas = r.preguntas || [];
    let i = 0, marcado = '';

    const pintar = () => {
      const q = preguntas[i];
      UI.abrir(`
        <p class="dice">${r.enunciado}</p>
        ${q.texto ? `<p class="cuenta-grande">${q.texto}</p>` : ''}
        <div class="pantallita" id="marcado">${marcado || '—'}</div>
        <div class="teclado">
          ${[1,2,3,4,5,6,7,8,9,0].map(n => `<button class="tecla-num" data-n="${n}">${n}</button>`).join('')}
          <button class="tecla-num borrar" data-n="x">⌫</button>
        </div>
        <div class="botones"><button class="btn defecto" id="probar">Probar<span class="tecla">espacio</span></button></div>
        <p class="contador">${i + 1} de ${preguntas.length}</p>
        <p class="pista" id="pista"></p>
      `);

      UI.modal.querySelectorAll('.tecla-num').forEach(b => {
        b.onclick = () => {
          Sonido.clic();
          if (b.dataset.n === 'x') marcado = marcado.slice(0, -1);
          else if (marcado.length < 3) marcado += b.dataset.n;
          document.getElementById('marcado').textContent = marcado || '—';
        };
      });

      document.getElementById('probar').onclick = () => {
        if (marcado !== '' && +marcado === preguntas[i].sol) {
          Sonido.acierto();
          i++; marcado = '';
          if (i >= preguntas.length) return setTimeout(() => this.exito(), 400);
          setTimeout(pintar, 500);
        } else {
          Sonido.fallo();
          document.getElementById('pista').innerHTML = '💭 ' + this.pista();
          marcado = '';
          document.getElementById('marcado').textContent = '—';
          this.sumarFallo();
        }
      };
    };
    pintar();
  },

  pista() {
    const p = this.reto.pistas || [];
    return p[Math.min(this.fallos, p.length - 1)] || '';
  },

  // --- Fallar: pista, pista fuerte, y a dormir ---------------------------
  sumarFallo() {
    this.fallos++;
    if (this.fallos >= AJUSTES.fallosParaDormirse) this.dormirse();
  },

  dormirse() {
    const id = this.parada;
    const p = Estado.actual;
    Estado.dormir(id);
    Sonido.suspiro();
    if (!p.facilitados) p.facilitados = {};
    p.facilitados[id] = true;                 // al volver, versión más fácil
    Estado.guardar();
    setTimeout(() => {
      UI.dialogo(this.quien(id), RETOS[id].dormido +
        '<br><br><b>Ve al salón de juegos con Coco</b>, juega una ronda y vuelve.',
        [{ texto: 'Vale', accion: () => { UI.cerrar(); if (this.alTerminar) this.alTerminar(false); } }]);
    }, 900);
  },

  // --- Ganar -------------------------------------------------------------
  exito() {
    const id = this.parada;
    const p = Estado.actual;
    if (p.facilitados) delete p.facilitados[id];
    const yaHoy = Estado.hechoHoy(id);          // hoy ya lo ganó: paga poco
    Estado.marcarHechoHoy(id);

    // Premio a leer: si eligió bien la operación sin probar
    let extra = '';
    if (!yaHoy && this.reto.operacion && this.fallosLeer === 0 && AJUSTES.conchasALaPrimera) {
      Estado.darConchas(AJUSTES.conchasALaPrimera);
      extra = '<br>⭐ <b>+' + AJUSTES.conchasALaPrimera + '</b> por leerlo bien a la primera';
    }
    // Venía del banco: cuenta para el álbum
    if (this.reto.tipo && Estado.apuntarProblema(this.reto.tipo) === 1 && novedad('album'))
      extra += '<br>📒 <b>¡Pegatina nueva!</b> Mírala en tus cuadernos 📔';

    // El cofre: a veces, y solo si lo ha leído bien a la primera
    if (!yaHoy && this.reto.operacion && this.fallosLeer === 0 && Cofre.toca()) {
      const seguir = this.alTerminar;
      this.alTerminar = (bien) => Cofre.abrir(() => { UI.cerrar(); if (seguir) seguir(bien); });
    }

    // Los animales de la granja no dan cristales: dan jornal
    if (RETOS[id].trabajo) return this.pagarTrabajo(id, extra);

    // Los retos de las atracciones tampoco: lo que dan es el paseo
    if (RETOS[id].paseo) {
      const pago = yaHoy ? AJUSTES.conchasPorRepetirHoy : AJUSTES.conchasPorPaseo;
      Estado.darConchas(pago);
      Sonido.fiesta();
      UI.refrescarHud();
      const m = this.reto.moralejaPropia || RETOS[id].moraleja;
      return UI.dialogo(this.quien(id),
        RETOS[id].exito + '<br><br>' + this.cobro(pago) + extra, [
        { texto: m ? '¿Y qué he hecho?' : '¡Vamos allá!', accion: () => {
            if (m) return this.explicar(m);
            UI.cerrar();
            if (this.alTerminar) this.alTerminar(true);
          } },
      ]);
    }

    const premio = Estado.superarReto(id, yaHoy);

    let texto = RETOS[id].exito + '<br><br>' + this.cobro(premio.conchas) + extra;
    if (premio.primeraVez) {
      texto += '<br>💎 <b>' + TEXTOS.cristalGanado + '</b>';
      // la primera vez también se lleva una prenda
      [RETOS[id].premio, RETOS[id].premio2].forEach(pr => {
        if (!pr) return;
        const cosa = ROPA[pr.tipo].find(o => o.id === pr.id);
        if (!cosa) return;
        if (pr.tipo === 'mascotas') Estado.darMascota(cosa.id); else Estado.dar(cosa.id);
        texto += '<br>🎁 <b>' + cosa.nombre + '</b>';
      });
    }
    Sonido.fiesta();
    setTimeout(() => Sonido.moneda(), 500);
    setTimeout(() => Pistas.dar('conchas'), 1400);
    if (premio.primeraVez) setTimeout(() => Pistas.dar('cristal'), 2600);
    if (premio.primeraVez) setTimeout(() => Sonido.cristal(), 800);

    const moraleja = RETOS[id].moraleja;
    UI.dialogo(this.quien(id), texto, [
      { texto: moraleja ? '¿Y qué he hecho?' : '¡Bien!', accion: () => {
          if (moraleja) return this.explicar(moraleja);
          UI.cerrar();
          if (this.alTerminar) this.alTerminar(true);
        } },
    ]);
    UI.refrescarHud();
  },

  /* Lo que se cobra. Si hoy ya se había ganado, se puede repetir pero no paga:
     repetir sirve para volver a montar, no para hacer caja (12-09-2026). */
  cobro(conchas) {
    if (conchas > 0) return '🐚 <b>+' + conchas + ' conchas</b>';
    return '<small>Hoy ya lo habías conseguido, así que esta vez no hay conchas. ' +
           'Mañana vuelve a pagar.</small>';
  },

  /* El jornal de la granja: bien la primera vez de cada día, menos después */
  pagarTrabajo(id, extra) {
    const primera = Estado.trabajoDeHoy(id);
    const pago = primera ? AJUSTES.conchasPorLimpiar : AJUSTES.conchasPorLimpiarRepe;
    Estado.darConchas(pago);
    Sonido.fiesta();
    setTimeout(() => Sonido.moneda(), 450);
    UI.refrescarHud();

    let texto = RETOS[id].exito + '<br><br>🐚 <b>+' + pago + ' conchas</b>' + (extra || '');
    if (!primera) texto += '<br><small>Hoy ya los limpiaste: mañana vuelven a pagar bien.</small>';

    const moraleja = RETOS[id].moraleja;
    UI.dialogo(this.quien(id), texto, [
      { texto: moraleja ? '¿Y qué he hecho?' : '¡Bien!', accion: () => {
          if (moraleja) return this.explicar(moraleja);
          UI.cerrar();
          if (this.alTerminar) this.alTerminar(true);
        } },
    ]);
  },

  /* La moraleja: sin esto, el reto es un juego; con esto, además se aprende */
  explicar(m) {
    UI.abrir(`
      <div class="quien">💡 ${m.titulo}</div>
      <p class="dice">${m.texto}</p>
      <div class="altavoz" id="zonaVoz"></div>
      <div class="botones">
        <button class="btn defecto" id="loPillo">¡Ya lo pillo!<span class="tecla">espacio</span></button>
      </div>
    `);
    UI.prepararAltavoz(m.titulo + '. ' + m.texto.replace(/<[^>]*>/g, ' '));
    document.getElementById('loPillo').onclick = () => {
      Sonido.clic();
      UI.cerrar();
      if (this.alTerminar) this.alTerminar(true);
    };
  },
};

/* --------------------------------------------------------------------------
   EL SALÓN DE JUEGOS: tres preguntas rápidas de cálculo. Sirve para calentar,
   para despejarse y para despertar a los personajes dormidos. Las preguntas
   se inventan solas según el nivel, así que nunca se acaban.
   ------------------------------------------------------------------------ */
const Salon = {

  pregunta(nivel) {
    const az = (n) => 1 + Math.floor(Math.random() * n);
    if (nivel === 'mayor') {
      const a = az(9), b = az(9);
      return { texto: `${a} × ${b}`, sol: a * b };
    }
    const a = az(10), b = az(9);
    return { texto: `${a} + ${b}`, sol: a + b };
  },

  abrir(alTerminar) {
    let acertadas = 0, ronda = 0;
    const siguiente = () => {
      if (ronda === 3) return this.premiar(alTerminar, acertadas);
      ronda++;
      const q = this.pregunta(Estado.actual.nivel);
      const opciones = [q.sol, q.sol + 1 + Math.floor(Math.random() * 3), Math.max(1, q.sol - 1 - Math.floor(Math.random() * 3))]
        .sort(() => Math.random() - 0.5);

      UI.abrir(`
        <div class="quien">Coco</div>
        <div class="contador">Pregunta ${ronda} de 3</div>
        <p class="cuenta-grande">${q.texto}</p>
        <div class="botones grandes">
          ${opciones.map(o => `<button class="btn num" data-v="${o}">${o}</button>`).join('')}
        </div>
        <p class="pista" id="pista"></p>
      `);

      UI.modal.querySelectorAll('.num').forEach(b => {
        b.onclick = () => {
          if (+b.dataset.v === q.sol) {
            b.classList.add('bien'); acertadas++;
            Sonido.acierto();
            setTimeout(siguiente, 500);
          } else {
            b.classList.add('mal');
            Sonido.fallo();
            b.disabled = true;
            document.getElementById('pista').textContent = 'Casi. Prueba otra.';
          }
        };
      });
    };
    siguiente();
  },

  premiar(alTerminar, acertadas) {
    const paga = Estado.darConchasConTope(AJUSTES.conchasPorRondaSalon);
    Sonido.moneda();
    const habiaDormidos = Object.keys(Estado.actual.dormidos || {}).length > 0;
    Estado.despertarTodos();
    UI.refrescarHud();

    let txt = `¡Squawk! ${acertadas} de 3.` + (paga
      ? `<br><br>🐚 <b>+${paga} conchas</b>`
      : '<br><br><small>Por hoy ya no quedan conchas que ganar aquí, pero jugar es gratis.</small>');
    if (habiaDormidos) txt += '<br><br>' + TEXTOS.salonDespierta;

    UI.dialogo('Coco', txt, [
      { texto: 'Otra ronda', accion: () => Salon.abrir(alTerminar) },
      { texto: 'Me voy', accion: () => { UI.cerrar(); if (alTerminar) alTerminar(); } },
    ]);
  },
};

</script>
<script>
/* === motor/armario.js === */
/* DENTRO DE TU CASA
   Al entrar hay tres sitios: el espejo (lo del cuerpo), el armario (la ropa)
   y el baño (las rutinas del día). Separados a propósito: cambiarse el pelo y
   elegir la ropa son dos gustos distintos. */

const Casa = {

  abrir() {
    Musica.poner('casa');
    const p = Estado.actual;
    UI.abrir(`
      <div class="quien">Tu cabaña</div>
      <div class="espejo-fila">
        <canvas id="espejoCasa" width="170" height="240"></canvas>
        <div class="espejo-lado">
          <div class="puertas">
            <button class="puerta" id="irEspejo">
              <span class="puerta-icono">🪞</span><b>El espejo</b>
              <small>cara, piel y pelo</small></button>
            <button class="puerta" id="irArmario">
              <span class="puerta-icono">👗</span><b>El armario</b>
              <small>ropa, zapatos y complementos</small></button>
            <button class="puerta" id="irBano">
              <span class="puerta-icono">🛁</span><b>El baño</b>
              <small>arreglarse para el día</small></button>
          </div>
        </div>
      </div>
      <p class="pista aviso-tienda">🐚 Tienes <b>${p.conchas}</b> conchas.
        Con las conchas de los retos se compra ropa nueva en <b>la tienda de Mila</b>.</p>
    `);
    Armario.dibujarEspejo('espejoCasa');
    document.getElementById('irEspejo').onclick = () => { Sonido.clic(); Espejo.abrir(); };
    document.getElementById('irArmario').onclick = () => { Sonido.clic(); Armario.abrir(); };
    document.getElementById('irBano').onclick = () => { Sonido.clic(); Bano.abrir(); };
  },
};

/* ===================================================== EL ESPEJO =========
   Lo del cuerpo: la cara, el color de piel y el pelo. */
const Espejo = {

  seccion: 'peinados',
  secciones: [
    { id: 'peinados',    titulo: 'Peinado',       campo: 'peinado' },
    { id: 'coloresPelo', titulo: 'Color de pelo', campo: 'colorPelo' },
    { id: 'pieles',      titulo: 'Piel',          campo: 'piel' },
  ],

  abrir() { Armario.pintarPanel(this, 'El espejo', 'espejoEsp', 'Aquí te cambias el pelo y la piel.'); },
};

/* ==================================================== EL ARMARIO ========
   La ropa, los zapatos y los complementos que ya son suyos. */
const Armario = {

  seccion: 'conjuntos',

  secciones: [
    { id: 'conjuntos',    titulo: 'Ropa',         campo: 'conjunto' },
    { id: 'zapatos',      titulo: 'Zapatos',      campo: 'zapatos' },
    { id: 'manos',        titulo: 'Manos',        campo: 'manos' },
    { id: 'joyas',        titulo: 'Joyas',        campo: 'joyas' },
    { id: 'complementos', titulo: 'Complementos', campo: 'complemento' },
  ],

  abrir() { this.pintarPanel(this, 'El armario', 'espejoArm',
    'Lo que ves aquí ya es tuyo. Hay más en la tienda de Mila.'); },

  /* Sirve igual para el espejo y para el armario: cambian las pestañas */
  pintarPanel(dueno, titulo, idLienzo, pie) {
    const p = Estado.actual;
    const sec = dueno.secciones.find(s => s.id === dueno.seccion) || dueno.secciones[0];
    dueno.seccion = sec.id;

    const pestanas = dueno.secciones.map(s =>
      `<button class="pestana ${s.id === dueno.seccion ? 'activa' : ''}" data-s="${s.id}">${s.titulo}</button>`
    ).join('');

    let opciones;
    if (dueno.seccion === 'pieles') {
      opciones = ROPA.pieles.map(c =>
        `<button class="opcion ${p.look.piel === c ? 'puesta' : ''}" data-v="${c}">
           <span class="muestra" style="background:${c}"></span></button>`).join('');
    } else {
      const suyas = ROPA[dueno.seccion].filter(o => Estado.tiene(o));
      opciones = suyas.length ? this.lista(dueno.seccion, suyas, o =>
        `<button class="opcion ${p.look[sec.campo] === o.id ? 'puesta' : ''}"
                 data-v="${o.id}">${this.miniatura(o)}<span>${o.nombre}</span></button>`
      ) : '<p class="pista">Aquí todavía no tienes nada. ¡A conseguirlo!</p>';
    }

    UI.abrir(`
      <div class="quien">${titulo}</div>
      ${this.resumen(dueno.secciones, dueno.seccion)}
      <div class="espejo-fila">
        <canvas id="${idLienzo}" width="200" height="280"></canvas>
        <div class="espejo-lado">
          <div class="pestanas">${pestanas}</div>
          <div class="opciones">${opciones}</div>
        </div>
      </div>
      <p class="pista aviso-tienda">${pie}</p>
      <div class="botones"><button class="btn gris" id="volverCasa">← Volver a casa</button></div>
    `);

    this.dibujarEspejo(idLienzo);
    this.dibujarMiniaturas(dueno.seccion, sec.campo);
    UI.modal.querySelectorAll('.pestana').forEach(b =>
      b.onclick = () => { Sonido.clic(); dueno.seccion = b.dataset.s;
