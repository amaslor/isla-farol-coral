  /* Enseña una pista si no se ha visto ya */
  dar(id) {
    const p = Estado.actual;
    if (!p) return;
    if (!p.pistas) p.pistas = {};
    if (!AJUSTES.pistasAutomaticas) return;      // se descubre jugando
    if (p.pistas[id] || !this.textos[id]) return;
    p.pistas[id] = true;
    Estado.guardar();
    this.cola.push(id);
    this.servir();
  },

  servir() {
    if (this.mostrando || !this.cola.length) return;
    const ahora = Date.now();
    if (ahora - this.ultima < 1600) {           // que no se pisen unas a otras
      return setTimeout(() => this.servir(), 600);
    }
    const id = this.cola.shift();
    const p = this.textos[id];
    this.mostrando = true;
    this.ultima = ahora;

    Hada.decir('<span class="pista-icono">' + p.i + '</span> ' + p.t, 6);
    setTimeout(() => { this.mostrando = false; this.servir(); }, 6400);
  },

  /* Se llama en cada vuelta del juego: mira qué está pasando y enseña lo que toca */
  revisar(juego) {
    const p = Estado.actual;
    if (!p) return;

    // lo primero de todo: cómo se anda
    this.dar('mover');

    // ¿hay un sitio con aura cerca, aunque todavía no esté encima?
    const j = juego.jugador;
    const cerca = MUNDO.lugares.find(l => l.accion &&
      Math.hypot(l.x - j.x, l.y - j.y) < 300);
    if (cerca) this.dar('brillo');

    // al lado de algo: se explica su tecla
    if (juego.cogible) this.dar('coger');
    else if (juego.lugar) {
      const a = juego.lugar.accion;
      if (a === 'reto') this.dar('reto');
      else if (a === 'letras') this.dar('letras');
      else if (a === 'ver') this.dar('ver');
      else if (a === 'hablar') this.dar('hablar');
      else if (a === 'armario') this.dar('armario');
      else if (a === 'tienda') this.dar('tiendaSitio');
      else if (a === 'animalario') this.dar('animalario');
      else if (a === 'juego') this.dar('juego');
      else if (a === 'montar') this.dar('montar');
      else if (a === 'cuidar') this.dar('cuidar');
    }

    // cosas que dependen de cómo va la partida
    const vistos = Object.keys(p.descubiertos || {}).length;
    if (vistos >= 3) this.dar('mapa');
    if (p.conchas >= 15) this.dar('puedeComprar');
    if (Object.keys(p.dormidos || {}).length) this.dar('dormido');
  },
};

</script>
<script>
/* === motor/juego.js === */
/* EL MUNDO: la isla, el movimiento y todo lo que se puede encontrar en ella.

   Ideas que gobiernan este archivo:
   - La ventana entera es el juego. El lienzo se adapta al tamaño que haya.
   - De lejos ves que en un sitio hay algo (un aura). Solo al acercarte sabes
     QUÉ es: un icono te dice si se juega, se lee, se coge o no es nada.
   - El suelo suena distinto según se pise hierba, arena, camino o agua.
   - Hay sitios por los que no se pasa, para que la isla obligue a rodear.
   - Y hay rarezas escondidas en sitios distintos en cada partida. */

const ICONOS = {
  armario: '👗', tienda: '🛒', animalario: '🐾', juego: '🎲',
  reto: '🔢', letras: '🔤', ver: '👁️', meta: '💎', coger: '✋',
  hablar: '💬', montar: '🎠', cuidar: '🧽', paso: '🚧', dar: '🎁', mascotas: '🐾',
};

/* UN SOLO BOTÓN PARA TODO: la barra espaciadora (y el botón verde).
   Si hay algo delante, se interactúa; si no hay nada, se salta. No hay que
   acordarse de ninguna letra.
   Las letras de antes (J, V, H, C) siguen funcionando en silencio, por si
   alguien se acostumbró, pero ya no se enseñan en ningún sitio. */
const TECLAS = {
  ver: 'V', hablar: 'H', coger: 'C',
  armario: 'J', tienda: 'J', animalario: 'J', juego: 'J',
  reto: 'J', letras: 'J', meta: 'J', montar: 'J', cuidar: 'J', paso: 'J', mascotas: 'J',
};

const Juego = {

  ANCHO: 960, ALTO: 540,
  ctx: null, lienzo: null,
  jugador: null,
  camX: 0, camY: 0,
  teclas: {},
  destino: null, destinoLugar: null,
  t: 0,
  modoPiedras: null, salto: null,
  lugar: null, cogible: null,
  mascota: null,
  nubes: [], mariposas: [],
  escondites: [],

  // =====================================================================
  iniciar() {
    this.lienzo = document.getElementById('lienzo');
    this.ctx = this.lienzo.getContext('2d');
    this.ajustarLienzo();

    this.jugador = { x: MUNDO.inicio.x, y: MUNDO.inicio.y, z: 0, vz: 0,
                     mirando: 1, paso: 0, andando: false, suelo: 'hierba' };
    this.mascota = { x: MUNDO.inicio.x - 40, y: MUNDO.inicio.y + 10, mirando: 1 };
    this.destino = null;
    this.modoPiedras = null;
    this.puenteHecho = Estado.tieneCristal('piedras');
    this.camX = this.jugador.x - this.ANCHO / 2;
    this.camY = this.jugador.y - this.ALTO / 2;

    if (!MUNDO._conPasos) {              // los pasos cerrados son lugares también
      MUNDO._conPasos = true;
      MUNDO.pasos.forEach(s => MUNDO.lugares.push({
        id: s.id, x: s.x, y: s.y, accion: 'paso', dibujo: s.dibujo,
        nombre: s.nombre, mapa: s.mapa, personaje: s.personaje, paso: s,
      }));
    }
    this.prepararEscondites();

    this.nubes = Array.from({ length: 7 }, () => ({
      x: Math.random() * MUNDO.ancho, y: Math.random() * MUNDO.alto,
      r: 60 + Math.random() * 80, v: 4 + Math.random() * 6,
    }));
    this.mariposas = Array.from({ length: 12 }, () => ({
      x: 400 + Math.random() * (MUNDO.ancho - 800),
      y: 400 + Math.random() * (MUNDO.alto - 800),
      a: Math.random() * 7, c: ['#FFD166', '#FF8FA3', '#C3A6FF'][Math.floor(Math.random() * 3)],
    }));

    Sonido.encendido = !Estado.actual.silencio;
    if (Sonido.maestro) Sonido.maestro.gain.value = Sonido.encendido ? 0.5 : 0;
    Sonido.ambienteEncendido(true);
    document.getElementById('bSonido').textContent = Sonido.encendido ? '🔊' : '🔇';

    Hada.iniciar();
    this.escuchar();
    if (!this._bucleArrancado) { this._bucleArrancado = true; requestAnimationFrame(() => this.bucle()); }
  },

  /* El lienzo ocupa toda la ventana y se ajusta si cambia de tamaño */
  ajustarLienzo() {
    const r = this.lienzo.getBoundingClientRect();
    this.ANCHO = Math.max(640, Math.round(r.width || window.innerWidth));
    this.ALTO = Math.max(400, Math.round(r.height || window.innerHeight));
    this.lienzo.width = this.ANCHO;
    this.lienzo.height = this.ALTO;
  },

  /* Cada partida esconde seis rarezas en sitios distintos */
  prepararEscondites() {
    const p = Estado.actual;
    if (!p.escondites) {
      const barajadas = RAREZAS.slice().sort(() => Math.random() - 0.5).slice(0, 6);
      p.escondites = barajadas.map(r => {
        let x, y, intentos = 0;
        do {
          x = 200 + Math.random() * (MUNDO.ancho - 400);
          y = 200 + Math.random() * (MUNDO.alto - 400);
          intentos++;
        } while (!this.transitable(x, y) && intentos < 200);
        return { id: r.id, x: Math.round(x), y: Math.round(y) };
      });
      Estado.guardar();
    }
    this.escondites = p.escondites.filter(e => !Estado.tieneRareza(e.id));
  },

  escuchar() {
    if (this._escuchando) return;
    this._escuchando = true;

    addEventListener('resize', () => this.ajustarLienzo());

    addEventListener('keydown', e => {
      // Si está escribiendo (el nombre de la jugadora, por ejemplo) o no está
      // dentro del juego, las teclas son suyas: aquí no se toca nada.
      const escribiendo = ['INPUT', 'TEXTAREA'].includes(
        (document.activeElement || {}).tagName);
      if (escribiendo) return;
      if (document.getElementById('juego').classList.contains('oculto')) return;

      this.teclas[e.key] = true;
      if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
      if (UI.estaAbierto()) return UI.tecla(e.key);
      if (this.modoPiedras) {
        if (e.key === 'ArrowUp') this.elegirPiedra(0);
        if (e.key === 'ArrowDown') this.elegirPiedra(1);
        if (e.key === 'Escape') this.salirDePiedras();
      } else {
        if (e.key === ' ') this.accionOSalto();
        const k = e.key.toUpperCase();
        if (k === 'J' || k === 'C' || k === 'V' || k === 'H' || e.key === 'Enter') this.interactuar(k);
        if (k === 'M') Mapa.abrir();
        if (k === 'L') Cuadernos.abrir();
        if (k === 'P') this.pantallaCompleta();
        if (k === 'T') Tutorial.abrir();
      }
    });
    addEventListener('keyup', e => { this.teclas[e.key] = false; });

    this.lienzo.addEventListener('click', ev => {
      if (UI.estaAbierto()) return;
      const r = this.lienzo.getBoundingClientRect();
      this.tocarEn((ev.clientX - r.left) * (this.ANCHO / r.width) + this.camX,
                   (ev.clientY - r.top) * (this.ALTO / r.height) + this.camY);
    });

    const pulsar = (id, alPulsar, alSoltar) => {
      const b = document.getElementById(id);
      if (!b) return;
      b.addEventListener('pointerdown', e => { e.preventDefault(); alPulsar(); });
      const fin = e => { e.preventDefault(); if (alSoltar) alSoltar(); };
      b.addEventListener('pointerup', fin);
      b.addEventListener('pointerleave', fin);
    };
    pulsar('bIzq',    () => this.teclas.ArrowLeft = true,  () => this.teclas.ArrowLeft = false);
    pulsar('bDer',    () => this.teclas.ArrowRight = true, () => this.teclas.ArrowRight = false);
    // En el camino de piedras, las flechas de arriba y abajo eligen la piedra
    pulsar('bArriba', () => { if (this.modoPiedras) return this.elegirPiedra(0);
                              this.teclas.ArrowUp = true; },   () => this.teclas.ArrowUp = false);
    pulsar('bAbajo',  () => { if (this.modoPiedras) return this.elegirPiedra(1);
                              this.teclas.ArrowDown = true; }, () => this.teclas.ArrowDown = false);
    pulsar('bAccion', () => this.modoPiedras ? this.elegirPiedra(1) : this.accionOSalto());

    document.getElementById('bSalirPuente').onclick = () => this.salirDePiedras();
    document.getElementById('bBajar').onclick = () => this.bajar();
    document.getElementById('bMapa').onclick = () => Mapa.abrir();
    document.getElementById('bAyuda').onclick = () => Tutorial.abrir();
    document.getElementById('bMochila').onclick = () => Mochila.abrir();
    document.getElementById('bCuadernos').onclick = () => Cuadernos.abrir();
    document.getElementById('bPantalla').onclick = () => this.pantallaCompleta();
    document.getElementById('bSonido').onclick = () => {
      Sonido.arrancar();
      Sonido.silenciar(Sonido.encendido);
      document.getElementById('bSonido').textContent = Sonido.encendido ? '🔊' : '🔇';
      /* Si lo ha encendido y aun así el aparato no deja sonar, hay que decirlo:
         si no, parece que el juego está roto. En el iPad casi siempre es el
         interruptor de silencio, que es el de al lado del volumen. */
      if (Sonido.encendido) setTimeout(() => {
        if (!Sonido.estaSonando())
          UI.dialogo('🔇 No se oye nada',
            'El juego quiere sonar, pero la tableta no le deja.<br><br>' +
            'Casi siempre es el <b>modo silencio</b>: mira el interruptor pequeño del lateral ' +
            '(al lado de los botones de volumen) o la <b>campanita</b> del centro de control, ' +
            'y quítalo.<br><br>Después vuelve a tocar el 🔊.');
      }, 400);
    };
  },

  /* PANTALLA COMPLETA
     En el Mac y en Android se pide al navegador y ya está. En el iPad NO EXISTE
     esa orden (ni en Safari ni en Chrome, que por dentro es Safari): el botón
     no hacía nada y la barra de arriba iba y venía sola. Allí la única manera
     de jugar sin barras es guardar el juego en la pantalla de inicio, y eso
     es lo que se explica. (12-09-2026) */
  sePuedePantallaCompleta() {
    const d = document.documentElement;
    return !!(d.requestFullscreen || d.webkitRequestFullscreen);
  },

  pantallaCompleta() {
    if (!this.sePuedePantallaCompleta()) return this.explicarPantallaIPad();
    const d = document.documentElement;
    if (!document.fullscreenElement) {
      if (d.requestFullscreen) d.requestFullscreen();
      else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    } else if (document.exitFullscreen) document.exitFullscreen();
    setTimeout(() => this.ajustarLienzo(), 400);
  },

  explicarPantallaIPad() {
    UI.dialogo('⛶ Jugar a pantalla completa',
      'En la tableta, el navegador no deja quitar la barra de arriba desde aquí: se va y vuelve ' +
      'sola.<br><br>Hay una forma de que no vuelva nunca, y se hace una sola vez:<br><br>' +
      '1. Abre el juego en <b>Safari</b> (no en Chrome).<br>' +
      '2. Toca el botón de <b>compartir</b> ⬆️, el del cuadradito con la flecha.<br>' +
      '3. Baja y elige <b>«Añadir a pantalla de inicio»</b>.<br><br>' +
      'Aparecerá un icono del juego junto a las apps. Abriéndolo desde ahí <b>no hay barras</b>, ' +
      'se ve la isla entera y ya no se sale al bajarse de una atracción.');
  },

  tocarEn(px, py) {
    if (this.modoPiedras) {
      const sig = this.modoPiedras.col + 1;
      if (sig >= MUNDO.piedras.columnas) return;
      const x = MUNDO.piedras.primeraX + sig * MUNDO.piedras.separacion;
      if (Math.abs(px - x) < 60) {
        this.elegirPiedra(py < (MUNDO.piedras.filaAlta + MUNDO.piedras.filaBaja) / 2 ? 0 : 1);
      }
      return;
    }
    const l = this.lugarEn(px, py, 80);
    this.destino = { x: px, y: py };
    this.destinoLugar = l ? l.id : null;
  },

  // =====================================================================
  bucle() {
    requestAnimationFrame(() => this.bucle());
    this.t += 0.016;
    if (document.getElementById('juego').classList.contains('oculto')) return;
    if (!UI.estaAbierto()) this.actualizar();
    this.dibujar();
    Hada.dibujar();
  },

  actualizar() {
    const j = this.jugador;

    if (this.vehiculo) return this.conducir();

    if (this.modoPiedras) { Hada.sinAccion(); return this.actualizarSalto(); }

    let dx = 0, dy = 0;
    if (this.teclas.ArrowLeft)  dx -= 1;
    if (this.teclas.ArrowRight) dx += 1;
    if (this.teclas.ArrowUp)    dy -= 1;
    if (this.teclas.ArrowDown)  dy += 1;

    if (dx || dy) this.destino = null;
    else if (this.destino) {
      const ax = this.destino.x - j.x, ay = this.destino.y - j.y;
      if (Math.hypot(ax, ay) > 8) { dx = ax; dy = ay; }
      else {
        this.destino = null;
        if (this.destinoLugar) { this.destinoLugar = null; this.interactuar(); }
      }
    }

    const largo = Math.hypot(dx, dy);
    j.andando = largo > 0;
    if (j.andando) {
      const v = AJUSTES.velocidad;
      const nx = j.x + (dx / largo) * v, ny = j.y + (dy / largo) * v;
      const antesX = j.x, antesY = j.y;
      if (this.transitable(nx, j.y)) j.x = nx;
      if (this.transitable(j.x, ny)) j.y = ny;
      // si quiere andar y no avanza nada, es que hay algo delante
      if (Math.hypot(j.x - antesX, j.y - antesY) < 0.4) this.chocar(nx, ny);
      else this.golpes = 0;
      if (dx !== 0) j.mirando = dx < 0 ? -1 : 1;
      j.paso += 0.22;
      j.suelo = this.sueloEn(j.x, j.y);
      if (j.z === 0 && Math.floor(j.paso * 4) % 6 === 0) Sonido.paso(j.suelo);
    } else j.paso = 0;

    if (j.z > 0 || j.vz !== 0) {
      j.vz += AJUSTES.gravedad;
      j.z -= j.vz;
      if (j.z <= 0) { if (j.vz > 4) Sonido.aterriza(); j.z = 0; j.vz = 0; }
    }

    const m = this.mascota;
    if (Math.hypot(j.x - m.x, j.y - m.y) > 46) {
      m.mirando = j.x < m.x ? -1 : 1;
      m.x += (j.x - m.x) * 0.06;
      m.y += (j.y - m.y) * 0.06;
    }

    this.camX += ((j.x - this.ANCHO / 2) - this.camX) * 0.1;
    this.camY += ((j.y - this.ALTO / 2) - this.camY) * 0.1;

    this.nubes.forEach(n => { n.x += n.v * 0.06; if (n.x > MUNDO.ancho + 200) n.x = -200; });
    this.mariposas.forEach(b => {
      b.a += (Math.random() - 0.5) * 0.4;
      b.x += Math.cos(b.a) * 0.8; b.y += Math.sin(b.a) * 0.8;
    });

    this.desatascar();
    if (Math.floor(this.t * 2) !== this._ultimoTemaMirado) {
      this._ultimoTemaMirado = Math.floor(this.t * 2);
      Musica.segunSitio();
    }
    if (j.andando) Estado.marcarVisitada(j.x, j.y);
    this.mirarAlrededor();
    Pistas.revisar(this);
  },

  mirarAlrededor() {
    const j = this.jugador;

    MUNDO.lugares.forEach(l => {
      if (Math.hypot(l.x - j.x, l.y - j.y) < 230 && Estado.descubrir(l.id)) {
        Sonido.cristal();
        Hada.decir('🗺️ ¡Has encontrado <b>' + l.nombre + '</b>!', 5);
      }
    });

    const antes = this.lugar;
    this.lugar = this.lugarEn(j.x, j.y, 95);
    if (antes && !this.lugar && this.avisados) delete this.avisados[antes.id];

    // ¿hay algo que coger justo aquí? (secretos y rarezas escondidas)
    this.cogible = null;
    const secreto = MUNDO.secretos.find(s =>
      !Estado.tieneSecreto(s.id) && Math.hypot(s.x - j.x, s.y - j.y) < 90);
    const pieza = MUNDO.piezas.find(p =>
      !Estado.llevaPieza(p.id) && !Estado.estaEncajado(p.encaja) &&
      Math.hypot(p.x - j.x, p.y - j.y) < 90);
    if (secreto) this.cogible = { clase: 'secreto', dato: secreto };
    else if (pieza) this.cogible = { clase: 'pieza', dato: pieza };
    else {
      const rareza = this.escondites.find(e => Math.hypot(e.x - j.x, e.y - j.y) < 80);
      if (rareza) this.cogible = { clase: 'rareza', dato: rareza };
    }

    // ¿lleva encima algo que encaje justo aquí?
    this.encajable = null;
    if (this.lugar) {
      const p = MUNDO.piezas.find(x => x.encaja === this.lugar.id &&
        Estado.llevaPieza(x.id) && !Estado.estaEncajado(x.encaja));
      if (p) this.encajable = p;
    }

    /* ¿y lleva algo que sea de quien vive aquí? Los objetos de la mochila no
       son adornos: todos son de alguien, y se entregan con el mismo botón. */
    this.entregable = null;
    if (this.lugar) {
      const r = RAREZAS.find(x => x.para === this.lugar.id &&
        Estado.tieneRareza(x.id) && !Estado.yaEntregado(x.id));
      if (r) this.entregable = r;
    }

    /* El cartelito de "qué se hace aquí" se dibuja junto al objeto (ver
       carteles()). Lumi no repite eso: ella solo avisa de lo que hay que
       saber, y una sola vez por sitio. */
    const hay = this.cogible || this.entregable || (this.lugar && this.lugar.accion);
    const bot = document.getElementById('bAccion');
    if (!hay) { if (bot) bot.textContent = '⤴'; return; }

    const accion = this.cogible ? 'coger' : this.entregable ? 'dar' : this.lugar.accion;
    if (bot) bot.textContent = ICONOS[accion] || '✨';
    if (this.cogible) return;

    /* Aquí Lumi se calla. El cartelito junto al objeto ya dice qué es y que se
       abre con el espacio; lo demás se descubre entrando. Si algún día quieres
       que vuelva a explicar, pon 'pistasAutomaticas: true' en ajustes.js. */
    if (!AJUSTES.pistasAutomaticas) return;

    if (!this.avisados) this.avisados = {};
    const id = this.lugar.id;
    if (this.avisados[id]) return;
    this.avisados[id] = true;

    if (this.encajable)
      return Hada.decir('¡Eh! Lo que llevas encima <b>es de aquí</b>. Dale al <b>espacio</b> y lo colocas.', 8);

    if (id === 'piedras' && !this.puenteHecho)
      Hada.decir('Para cruzar el río hay que <b>acertar las piedras</b>. ¡Suerte!', 7);
    else if (accion === 'montar')
      Hada.decir('Aquí te dejan montar <b>si superas su reto</b>.', 6);
    else if (accion === 'cuidar')
      Hada.decir('Si los <b>limpias</b>, te dan conchas. Y se puede repetir cada día.', 7);
  },

  // --- ¿Por dónde se puede andar y qué se pisa? --------------------------
  /* Cuando se empeña en pasar por donde no se puede, Lumi le dice por qué.
     Así descubre sola dónde están los límites, en vez de chocar sin más. */
  chocar(nx, ny) {
    this.golpes = (this.golpes || 0) + 1;
    if (this.golpes < 14) return;                 // que no salte al primer roce
    this.golpes = 0;
    // si iba hacia un sitio y ha chocado, se suelta: si no, se queda
    // empujando la roca sin avanzar hasta que suelte el ratón
    this.destino = null; this.destinoLugar = null;
    const ahora = Date.now();
    if (ahora - (this.ultimoChoque || 0) < 9000) return;
    this.ultimoChoque = ahora;

    if (!this.puenteHecho && nx > MUNDO.rio.x1 - 40 && nx < MUNDO.rio.x2 + 40) {
      return Hada.decir('🌊 Por el agua no se pasa. Hay unas <b>piedras</b> para cruzar, ' +
                        'pero solo aguantan si aciertas cuáles: busca el cartel.', 8);
    }
    const r = MUNDO.recintos.find(x => {
      const d = Math.pow((nx - x.x) / x.rx, 2) + Math.pow((ny - x.y) / x.ry, 2);
      return d > 0.85 && d < 1.2;
    });
    if (r) return Hada.decir('🎪 La feria está vallada. La <b>puerta</b> está en este lado ⬅️', 7);

    const b = MUNDO.bloqueos.find(x =>
      Math.pow((nx - x.x) / (x.rx + 30), 2) + Math.pow((ny - x.y) / (x.ry + 30), 2) <= 1);
    if (b && b.mensaje) return Hada.decir('🚧 ' + b.mensaje, 8);
    Hada.decir('🌊 Se acaba la isla. ¡Todo lo demás es mar!', 6);
  },

  transitable(x, y) {
    // Las pasarelas (el espigón, el puente) se pisan aunque estén sobre el agua.
    // Las que llevan 'requiere' solo cuando ese paso está abierto.
    for (const p of MUNDO.pasarelas) {
      if (Math.pow((x - p.x) / p.rx, 2) + Math.pow((y - p.y) / p.ry, 2) <= 1) {
        return !p.requiere || Estado.pasoAbierto(p.requiere);
      }
    }
    // Las islas pequeñas
    for (const s of MUNDO.islotes) {
      if (Math.pow((x - s.x) / (s.rx - 24), 2) + Math.pow((y - s.y) / (s.ry - 24), 2) <= 1) return true;
    }
    const i = MUNDO.isla;
    const dentro = Math.pow((x - i.cx) / (i.rx - 26), 2) + Math.pow((y - i.cy) / (i.ry - 26), 2) <= 1;
    if (!dentro) return false;
    if (!this.puenteHecho && x > MUNDO.rio.x1 - 14 && x < MUNDO.rio.x2 + 14) return false;

    // La feria está vallada: solo se cruza la valla por la puerta
    for (const r of MUNDO.recintos) {
      const d = Math.pow((x - r.x) / r.rx, 2) + Math.pow((y - r.y) / r.ry, 2);
      if (d > 0.90 && d < 1.14) {                       // justo encima de la valla
        const p = r.puerta;
        const enPuerta = Math.pow((x - p.x) / p.rx, 2) + Math.pow((y - p.y) / p.ry, 2) <= 1;
        if (!enPuerta) return false;
      }
    }

    for (const b of MUNDO.bloqueos) {
      const enBloqueo = Math.pow((x - b.x) / b.rx, 2) + Math.pow((y - b.y) / b.ry, 2) <= 1;
      if (!enBloqueo) continue;
      // la meseta de arriba, que sí se pisa
      if (b.hueco &&
          Math.pow((x - b.hueco.x) / b.hueco.rx, 2) +
          Math.pow((y - b.hueco.y) / b.hueco.ry, 2) <= 1) continue;

      let pasa = false;                                // escaleras y senderos
      [b.paso, b.paso2].forEach(p => {
        if (!p) return;
        if (p.requiere && !Estado.pasoAbierto(p.requiere)) return;
        if (Math.pow((x - p.x) / p.rx, 2) + Math.pow((y - p.y) / p.ry, 2) <= 1) pasa = true;
      });
      // Sendas: un pasillo con esquinas, el mismo que se pinta. Así se anda
      // por donde se ve el camino y no solo en línea recta (12-09-2026).
      const sd = b.senda;
      if (sd && (!sd.requiere || Estado.pasoAbierto(sd.requiere))) {
        for (let k = 1; k < sd.puntos.length; k++) {
          const a = sd.puntos[k - 1], c = sd.puntos[k];
          if (this.distanciaASegmento(x, y, a[0], a[1], c[0], c[1]) <= sd.ancho / 2) pasa = true;
        }
      }
      if (pasa) continue;
      return false;
    }
    return true;
  },

  sueloEn(x, y) {
    if (x > MUNDO.rio.x1 && x < MUNDO.rio.x2) return 'agua';
    for (const z of MUNDO.zonas) {
      if (Math.pow((x - z.x) / z.rx, 2) + Math.pow((y - z.y) / z.ry, 2) <= 1) {
        return z.tipo === 'rosa' ? 'arena' : 'hierba';
      }
    }
    for (const c of this.tramos()) {
      if (this.distanciaASegmento(x, y, c[0], c[1], c[2], c[3]) < 20) return 'camino';
    }
    const i = MUNDO.isla;
    const enHierba = Math.pow((x - i.cx) / (i.rx - 130), 2) + Math.pow((y - i.cy) / (i.ry - 110), 2) <= 1;
    return enHierba ? 'hierba' : 'arena';
  },

  distanciaASegmento(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const largo = dx * dx + dy * dy;
    let t = largo ? ((px - x1) * dx + (py - y1) * dy) / largo : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  },

  tramos() {
    if (this._tramos) return this._tramos;
    const p = {};
    MUNDO.lugares.forEach(l => p[l.id] = l);
    Object.keys(MUNDO.nodos).forEach(k => p[k] = MUNDO.nodos[k]);

    // El camino que cruza el bosque va por los senderos de verdad, no por
    // encima de los árboles: entra por el cruce y sale por el cruce.
    const unir = [['cabana', 'tienda'], ['cabana', 'animalario'], ['tienda', 'salon'],
                  ['cabana', 'playa'], ['playa', 'cartes'],
                  ['fruta', 'piedras'], ['cartes', 'piedras'], ['animalario', 'playa'],
                  ['salon', 'mirador'], ['playa', 'claro'],
                  ['cartes', 'cala'], ['farol', 'nido'], ['pozo', 'cartes'],
                  ['farol', 'cueva'],
                  ['salon', 'cruceBosque'], ['cruceBosque', 'fruta'],
                  ['cruceBosque', 'norteBosque'], ['norteBosque', 'ruinas'],
                  ['cruceBosque', 'surBosque'], ['surBosque', 'pozo']];
    this._tramos = unir.filter(u => p[u[0]] && p[u[1]])
                       .map(u => [p[u[0]].x, p[u[0]].y, p[u[1]].x, p[u[1]].y]);
    return this._tramos;
  },

  /* Por si acaso: si el personaje acaba en un sitio donde no se puede estar
     (una barca que le deja mal, un reto que le mueve), se le saca al punto
     bueno más cercano en vez de dejarle encerrado. */
  desatascar() {
    const j = this.jugador;
    if (this.transitable(j.x, j.y)) return;
    for (let r = 12; r <= 600; r += 12) {
      for (let a = 0; a < 16; a++) {
        const ang = a * Math.PI / 8;
        const nx = j.x + Math.cos(ang) * r, ny = j.y + Math.sin(ang) * r;
        if (this.transitable(nx, ny)) { j.x = nx; j.y = ny; return; }
      }
    }
    j.x = MUNDO.inicio.x; j.y = MUNDO.inicio.y;      // último recurso
  },

  /* EL BOTÓN ÚNICO
     Si hay algo con lo que interactuar, interactúa. Si no, salta. */
  accionOSalto() {
    if (this.cogible || this.encajable || (this.lugar && this.lugar.accion)) this.interactuar();
    else this.saltar();
  },

  saltar() {
    if (this.jugador.z === 0) { this.jugador.vz = -AJUSTES.fuerzaSalto; Sonido.salto(); }
  },

  lugarEn(x, y, radio) {
    return MUNDO.lugares.find(l => l.accion &&
      Math.hypot(l.x - x, l.y - y) < (radio || 95)) || null;
  },

  // =====================================================================
  interactuar(tecla) {
    this.teclas = {};

    if (this.cogible) {
      if (tecla && tecla !== 'C' && tecla !== 'Enter') return;
      if (this.cogible.clase === 'secreto') return this.recogerSecreto(this.cogible.dato);
      if (this.cogible.clase === 'pieza') return this.cogerPieza(this.cogible.dato);
      return this.recogerRareza(this.cogible.dato);
    }

    // Si lleva algo de quien vive aquí, lo primero es dárselo
    if (this.entregable && (!tecla || tecla === 'C' || tecla === 'Enter'))
      return this.entregarEncargo(this.entregable);

    // Si lleva la pieza que va aquí, lo primero es colocarla
    if (this.encajable && (!tecla || tecla === 'C' || tecla === 'Enter'))
      return this.colocarPieza(this.encajable);

    const l = this.lugar || this.lugarEn(this.jugador.x, this.jugador.y, 95);
    if (!l || !l.accion) return;
    if (tecla && tecla !== 'Enter' && TECLAS[l.accion] !== tecla) return;
    Sonido.clic();

    if (l.accion === 'hablar') return this.hablar(l);

    if (l.accion === 'cuidar') return Desafio.abrir(l.id + 'Reto', () => UI.refrescarHud());
    if (l.accion === 'paso') return this.abrirPaso(l);
    if (l.accion === 'montar') return this.atraccion(l);

    if (l.accion === 'armario')    return Casa.abrir();
    if (l.accion === 'tienda')     return Tienda.abrir();
    if (l.accion === 'animalario') return Animalario.abrir();
    if (l.accion === 'mascotas')   return Bitxos.abrir();
    if (l.accion === 'ver')        return this.mirar(l);
    if (l.accion === 'juego') {
      return UI.dialogo('Coco', TEXTOS.salonSaludo, [
        { texto: '🧠 Un problema', accion: () => Desafio.problema(Estado.actual.nivel, () => UI.refrescarHud()) },
        { texto: '⚡ Preguntas rápidas', accion: () => Salon.abrir(() => UI.refrescarHud()) },
      ]);
    }
    if (l.accion === 'meta') return this.farol();
    Desafio.abrir(l.id, () => UI.refrescarHud());     // reto y letras
  },

  /* El Farol: con los cinco cristales se enciende, y eso cambia la isla */
  farol() {
    const p = Estado.actual;
    const n = p.cristales.length;

    if (n < 5) {
      return UI.dialogo('El Farol de Coral',
        'Está apagado y frío. En la base hay <b>cinco huecos</b> con forma de cristal.<br><br>' +
        'Llevas <b>' + n + ' de 5</b>.');
    }

    if (p.farolEncendido) {
      return UI.dialogo('El Farol de Coral',
        'Encendido y calentito. Desde aquí se ve la isla entera.<br><br>' +
        'Las flores no se cierran nunca, como decía Na Tortuga.');
    }

    p.farolEncendido = true;
    const traje = ROPA.conjuntos.find(c => c.id === 'coral');
    Estado.dar(traje.id);
    p.look.conjunto = traje.id;
    Estado.guardar();
    UI.refrescarHud();
    Sonido.fiesta();
    setTimeout(() => Sonido.cristal(), 600);
    setTimeout(() => Sonido.fiesta(), 1200);
    Musica.poner('farol');

    UI.dialogo('✨ ¡SE HA ENCENDIDO! ✨',
      'Los cinco cristales encajan solos, uno detrás de otro.<br><br>' +
      'El Farol se enciende con una luz dorada que llega hasta el otro lado de la isla. ' +
      'Las flores de abajo se abren de golpe, todas a la vez.<br><br>' +
      '👗 Y en el suelo, doblado, aparece el <b>' + traje.nombre + '</b>: te lo pones y ' +
      '<b>brilla en la oscuridad</b>.', [
      { texto: '¡Lo he conseguido!', accion: () => {
          UI.cerrar();
          Hada.decir('¡Lo has conseguido! La isla entera te lo agradece. ✨', 8);
        } },
    ]);
  },

  /* Un paso cerrado: si se supera el reto, se abre una parte nueva de la isla */
  abrirPaso(l) {
    const s = l.paso;
    if (Estado.pasoAbierto(s.id)) {
      return UI.dialogo(s.nombre, s.abierto);
    }
    UI.dialogo(s.personaje, s.cerrado + '<br><br>✨ <b>Si lo arreglamos, se podrá pasar.</b>', [
      { texto: '¡Vamos a arreglarlo!', accion: () => {
          Desafio.abrir(s.reto, (bien) => {
            UI.refrescarHud();
            if (!bien) return;
            Estado.abrirPaso(s.id);
            Sonido.fiesta();
            setTimeout(() => Sonido.cristal(), 500);
            UI.dialogo('🎉 ¡Camino abierto!', s.alAbrir, [
              { texto: '¡A explorar!', accion: () => {
                  UI.cerrar();
                  Hada.decir('¡Se ha abierto un sitio nuevo! Corre a verlo. ✨', 7);
                } },
            ]);
          });
        } },
    ]);
  },

  /* Charlar con un vecino: se elige qué decirle */
  hablar(l, dichas) {
    const c = CHARLAS[l.charla];
    if (!c) return;
    const yaDichas = dichas || {};
    const opciones = c.opciones.map((o, i) => ({
      texto: (yaDichas[i] ? '· ' : '') + o.texto,
      accion: () => {
        yaDichas[i] = true;
        UI.dialogo(c.quien, o.respuesta, [
          { texto: 'Seguir hablando', accion: () => this.hablar(l, yaDichas) },
          { texto: 'Adiós', accion: () => UI.cerrar() },
        ]);
      },
    }));
    opciones.push({ texto: 'Me voy, ¡adiós!', accion: () => UI.cerrar() });
    UI.dialogo(c.quien, dichas ? '¿Algo más?' : c.saludo, opciones);
  },

  /* ------------------------------------------- MONTAR EN LAS ATRACCIONES
     Primero el reto del dueño; si lo saca, se sube y conduce de verdad. */
  atraccion(l) {
    const p = MUNDO.paseos[l.id];
    if (!p) return;
    // Si hoy ya se lo ganó puede montar libre, o repetir el reto (otros
    // números, otra variante). Repetir ya no paga: el paseo es el premio.
    if (Estado.hechoHoy(p.reto)) {
      return UI.dialogo(p.personaje, TEXTOS.paseoLibre, [
        { texto: '¡Vamos!', accion: () => { UI.cerrar(); this.montar(l.id); } },
        { texto: 'Otro reto', accion: () => {
            UI.cerrar();
            Desafio.abrir(p.reto, (bien) => { UI.refrescarHud(); if (bien) this.montar(l.id); });
          } },
        { texto: 'Ahora no', accion: () => UI.cerrar() },
      ]);
    }
    Desafio.abrir(p.reto, (bien) => {
      UI.refrescarHud();
      if (bien) this.montar(l.id);
    });
  },

  montar(id) {
    const p = MUNDO.paseos[id];
    const l = MUNDO.lugares.find(x => x.id === id);
    const a = Object.assign({}, p, { x: l.x, y: l.y, id: id });
    Sonido.fiesta();
    if (a.vehiculo === 'tiovivo' || a.vehiculo === 'taza') return this.tiovivo(a);

    this.vehiculo = {
      datos: a, tipo: a.vehiculo, zona: a.zona,
      vx: 0, vy: 0, angulo: 0,
      hasta: Date.now() + a.segundos * 1000,
    };
    this.jugador.x = a.arranque.x;
    this.jugador.y = a.arranque.y;
    this.jugador.z = 0; this.jugador.vz = 0;
    this.abrirBarraTiempo(a.segundos);
    Musica.poner('paseo');
    Hada.decir('¡Con las <b>flechas</b>! 🎉', 3);
  },

  /* La barra de abajo: se ve de un vistazo cuánto queda y cómo bajarse */
  abrirBarraTiempo(segundos) {
    document.getElementById('barraTiempo').classList.remove('oculto');
    this.segundosPaseo = segundos;
  },

  /* El tiovivo y las tazas no se conducen: dan vueltas y ya está */
  tiovivo(a) {
    this.vehiculo = { datos: a, tipo: a.vehiculo, giro: 0, hasta: Date.now() + a.segundos * 1000 };
    this.centroTiovivo = { x: a.x, y: a.y - 10 };
    this.abrirBarraTiempo(a.segundos);
    Musica.poner('paseo');
    Hada.decir('¡Agárrate! 🎠', 3);
  },

  bajar() {
    const v = this.vehiculo;
    if (!v) return;
    document.getElementById('barraTiempo').classList.add('oculto');
    this.vehiculo = null;
    Musica.poner(null);
    this.jugador.x = v.datos.x + 70;
    this.jugador.y = v.datos.y + 50;
    this.desatascar();
    this.mascota.x = this.jugador.x - 40;
    this.mascota.y = this.jugador.y;
    Sonido.clic();
    Hada.decir('¡Otra vez cuando quieras!', 3);
  },

  /* Conducir: cada vehículo se maneja distinto */
  conducir() {
    const v = this.vehiculo, j = this.jugador;
    if (Date.now() > v.hasta) return this.bajar();

    Hada.sinAccion();
    const quedan = Math.max(0, (v.hasta - Date.now()) / 1000);
    document.getElementById('relleno').style.width =
      (100 * quedan / (this.segundosPaseo || 60)) + '%';
    document.getElementById('segundos').textContent = Math.ceil(quedan) + 's';

    if (v.tipo === 'tiovivo' || v.tipo === 'taza') {
      v.giro += v.tipo === 'taza' ? 0.055 : 0.028;
      const r = v.tipo === 'taza' ? this.RADIO_TAZA : 74;
      j.x = this.centroTiovivo.x + Math.cos(v.giro) * r;
      j.y = this.centroTiovivo.y + Math.sin(v.giro) * r * 0.55;
      // en la taza va sentada dentro; en el tiovivo, subida al caballito
      j.z = v.tipo === 'taza' ? 6 + Math.sin(v.giro * 4) * 4 : 16 + Math.sin(v.giro * 4) * 14;
      j.mirando = Math.sin(v.giro) > 0 ? 1 : -1;
      if (Math.floor(v.giro * 10) % 20 === 0) Sonido.nota(660, 0.2, 'triangle', 0.1);
      this.camX += ((this.centroTiovivo.x - this.ANCHO / 2) - this.camX) * 0.1;
      this.camY += ((this.centroTiovivo.y - this.ALTO / 2) - this.camY) * 0.1;
      return;
    }

    // barca, caballo y coche: se llevan con las flechas, cada uno a su manera
    const ajuste = {
      barca:   { empuje: 0.13, roce: 0.965, tope: 3.4 },
      caballo: { empuje: 0.30, roce: 0.90,  tope: 6.4 },
      coche:   { empuje: 0.34, roce: 0.93,  tope: 6.8 },
      tren:    { empuje: 0.22, roce: 0.94,  tope: 4.6 },
    }[v.tipo];

    let dx = 0, dy = 0;
    if (this.teclas.ArrowLeft)  dx -= 1;
    if (this.teclas.ArrowRight) dx += 1;
    if (this.teclas.ArrowUp)    dy -= 1;
    if (this.teclas.ArrowDown)  dy += 1;
    if (this.destino) {                       // también vale llevarlo con el ratón
      const ax = this.destino.x - j.x, ay = this.destino.y - j.y;
      if (Math.hypot(ax, ay) > 12) { dx = ax / 100; dy = ay / 100; }
    }

    v.vx = (v.vx + dx * ajuste.empuje) * ajuste.roce;
    v.vy = (v.vy + dy * ajuste.empuje) * ajuste.roce;
    const vel = Math.hypot(v.vx, v.vy);
    if (vel > ajuste.tope) { v.vx *= ajuste.tope / vel; v.vy *= ajuste.tope / vel; }

    const nx = j.x + v.vx, ny = j.y + v.vy;
    const z = v.zona;
    const dentro = (x, y) => Math.pow((x - z.x) / z.rx, 2) + Math.pow((y - z.y) / z.ry, 2) <= 1;
    if (dentro(nx, j.y)) j.x = nx; else v.vx *= -0.4;      // rebota en el borde
    if (dentro(j.x, ny)) j.y = ny; else v.vy *= -0.4;

    if (Math.abs(v.vx) > 0.2) j.mirando = v.vx < 0 ? -1 : 1;
    v.angulo = Math.atan2(v.vy, v.vx);
    j.paso = 0;
    j.z = v.tipo === 'caballo' ? Math.abs(Math.sin(this.t * 9)) * 7 * Math.min(1, vel / 3) : 0;

    if (vel > 0.6 && Math.floor(this.t * 6) % 4 === 0) {
      if (v.tipo === 'barca') Sonido.paso('agua');
      else if (v.tipo === 'caballo') Sonido.paso('camino');
    }

    this.camX += ((j.x - this.ANCHO / 2) - this.camX) * 0.1;
    this.camY += ((j.y - this.ALTO / 2) - this.camY) * 0.1;
  },

  mirar(l) {
    const h = HISTORIAS[l.historia];
    if (!h) return;
    const nueva = Estado.leerHistoria(l.historia);
    if (nueva) Sonido.piedraBien();
    /* Si el sitio ya está arreglado, cuenta lo de después. El texto de antes
       es el que lleva escondida la pista de lo que le falta: por eso vale la
       pena leerlos todos. */
    const arreglado = Estado.estaEncajado(l.id) && h.arreglado;
    const pieza = MUNDO.piezas.find(x => x.encaja === l.id);
    UI.dialogo(arreglado && pieza ? pieza.arreglo : h.titulo,
               arreglado ? '🔧 ' + h.arreglado : h.texto);
  },

  /* Coger una pieza suelta */
  cogerPieza(p) {
    Estado.cogerPieza(p.id);
    Sonido.hallazgo();
    UI.dialogo(p.nombre, p.hallazgo +
      '<br><br>🎒 Te lo llevas. <b>Seguro que va en algún sitio.</b>', [
      { texto: 'Vale', accion: () => {
          UI.cerrar();
          Hada.decir('Eso encaja en algún sitio de la isla. ¡A ver dónde! 🔧', 7);
        } },
    ]);
  },

  /* Colocarla donde va: eso pone algo en marcha */
  colocarPieza(p) {
    Estado.encajar(p.id, p.encaja);
    Estado.darConchas(3);
    UI.refrescarHud();
    Sonido.fiesta();
    setTimeout(() => Sonido.cristal(), 500);
    UI.dialogo('🔧 ¡Encaja!', p.alColocar + '<br><br>🐚 <b>+3 conchas</b>', [
      { texto: '¡Genial!', accion: () => {
          UI.cerrar();
          Hada.decir('¡Mira cómo funciona! Debe de haber más cosas así por ahí. ✨', 7);
        } },
    ]);
  },

  /* ENTREGAR UN ENCARGO
     El premio de verdad es lo que hace esa persona al recibirlo; las conchas
     son pocas y a propósito. Se apunta en el Cuaderno de Vecinos. */
  entregarEncargo(r) {
    Estado.entregar(r.id);
    Estado.darConchas(r.premio.conchas);
    if (r.premio.prenda) Estado.dar(r.premio.prenda);
    if (r.premio.mascota) Estado.darMascota(r.premio.mascota);
    UI.refrescarHud();
    Sonido.fiesta();
    setTimeout(() => Sonido.moneda(), 500);
    UI.dialogo('🎁 ' + r.nombre,
      r.alDar + '<br><br>🐚 <b>+' + r.premio.conchas + ' conchas</b>', [
      { texto: '¡Bien!', accion: () => {
          UI.cerrar();
          Hada.decir('Todo lo que llevas en la mochila <b>es de alguien</b>. ✨', 7);
        } },
    ]);
  },

  recogerRareza(e) {
    const r = RAREZAS.find(x => x.id === e.id);
    Estado.guardarRareza(r.id);
    setTimeout(() => Pistas.dar('mochila'), 1200);
    this.escondites = this.escondites.filter(x => x.id !== r.id);
    Sonido.hallazgo();
    UI.dialogo('¡Vaya hallazgo!',
      `<div class="rareza-grande">${r.icono}</div><b>${r.nombre}</b><br><br>${r.texto}` +
      '<br><br>🎒 Se guarda en tu mochila. <b>Esto es de alguien de la isla:</b> ' +
      'lee bien lo que pone y sabrás de quién.');
  },

  recogerSecreto(s) {
    const premio = ROPA[s.premio.tipo].find(x => x.id === s.premio.id);
    if (s.reto) {
      Sonido.hallazgo();
      return UI.dialogo(s.titulo, s.texto +
        (s.gancho ? '<br><br>✨ ' + s.gancho : ''), [
        { texto: '¡Quiero intentarlo!', accion: () => {
            Desafio.abrir(s.reto, (bien) => {
              if (!bien) return;
              Estado.guardarSecreto(s.id);
              if (s.premio.tipo === 'mascotas') Estado.darMascota(premio.id);
              else Estado.dar(premio.id);
              UI.refrescarHud();
              UI.aviso('✨ <b>' + premio.nombre + '</b> ahora es tuyo', 4000);
            });
          } },
      ]);
    }
    Estado.guardarSecreto(s.id);
    Estado.dar(premio.id);
    Sonido.hallazgo();
    UI.refrescarHud();
    UI.dialogo(s.titulo, s.texto + '<br><br>✨ Te llevas <b>' + premio.nombre + '</b>.');
  },

  // ============================================== EL CAMINO DE PIEDRAS ===
  entrarPiedras(reto) {
    const cfg = MUNDO.piedras;
    const cols = [];
    for (let i = 0; i < cfg.columnas; i++) {
      const bueno = reto.serie * (i + 1);
      let malo = bueno + (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 3));
      if (malo % reto.serie === 0 || malo <= 0) malo = bueno + 1;
      const arriba = Math.random() < 0.5;
      cols.push({ numeros: arriba ? [bueno, malo] : [malo, bueno],
                  buena: arriba ? 0 : 1, encendida: -1, hundida: -1 });
    }
    this.modoPiedras = { reto: reto, cols: cols, col: -1, fila: 1 };
    this.jugador.x = MUNDO.rio.x1 - 34;
    this.jugador.y = (MUNDO.piedras.filaAlta + MUNDO.piedras.filaBaja) / 2;
    this.jugador.z = 0; this.jugador.vz = 0; this.jugador.mirando = 1;
    document.getElementById('barraPuente').classList.remove('oculto');
    Hada.decir('⬆️ o ⬇️: elige la piedra que aguanta.', 6);
  },

  elegirPiedra(fila) {
    const m = this.modoPiedras;
    if (!m || this.salto) return;
    const sig = m.col + 1;
    if (sig >= m.cols.length) return;
    const cfg = MUNDO.piedras;
    this.salto = {
      desde: { x: this.jugador.x, y: this.jugador.y },
      hasta: { x: cfg.primeraX + sig * cfg.separacion,
               y: fila === 0 ? cfg.filaAlta : cfg.filaBaja },
      t: 0, fila: fila, col: sig, acierta: m.cols[sig].buena === fila,
    };
    Sonido.salto();
  },

  actualizarSalto() {
    this.camX += ((this.jugador.x - this.ANCHO / 2) - this.camX) * 0.1;
    this.camY += ((this.jugador.y - this.ALTO / 2) - this.camY) * 0.1;
    if (!this.salto) return;
    const s = this.salto;
    s.t += 0.055;
    const k = Math.min(1, s.t);
    const j = this.jugador;
    j.x = s.desde.x + (s.hasta.x - s.desde.x) * k;
    j.y = s.desde.y + (s.hasta.y - s.desde.y) * k;
    j.z = Math.sin(k * Math.PI) * 46;
    if (k < 1) return;

    j.z = 0;
    const m = this.modoPiedras;
    const col = m.cols[s.col];

    if (s.acierta) {
      col.encendida = s.fila;
      m.col = s.col; m.fila = s.fila;
      this.salto = null;
      Sonido.piedraBien();
      if (m.col === m.cols.length - 1) {
        document.getElementById('barraPuente').classList.add('oculto');
        this.modoPiedras = null;
        this.puenteHecho = true;
        j.x = MUNDO.rio.x2 + 40;
        this.mascota.x = j.x - 30; this.mascota.y = j.y;
        setTimeout(() => Desafio.exito(), 400);
      }
    } else {
      col.hundida = s.fila;
      setTimeout(() => { col.hundida = -1; }, 1200);
      Sonido.plof();
      const cfg = MUNDO.piedras;
      const atras = m.col;
      j.x = atras < 0 ? MUNDO.rio.x1 - 34 : cfg.primeraX + atras * cfg.separacion;
      j.y = atras < 0 ? (cfg.filaAlta + cfg.filaBaja) / 2
                      : (m.fila === 0 ? cfg.filaAlta : cfg.filaBaja);
      this.salto = null;
      Hada.decir('¡Plof! Esa se hunde. ' + Desafio.pista(), 5);
      Desafio.sumarFallo();
      if (Estado.estaDormido('piedras')) this.salirDePiedras();
    }
  },

  salirDePiedras() {
    document.getElementById('barraPuente').classList.add('oculto');
    this.modoPiedras = null;
    this.salto = null;
    this.jugador.x = MUNDO.rio.x1 - 60;
    this.jugador.z = 0;
  },

  // ===================================================== DIBUJO ==========
  dibujar() {
    const ctx = this.ctx, W = this.ANCHO, H = this.ALTO;
    this.camX = Math.max(-40, Math.min(MUNDO.ancho - W + 40, this.camX));
    this.camY = Math.max(-40, Math.min(MUNDO.alto - H + 40, this.camY));
    const cx = Math.round(this.camX), cy = Math.round(this.camY);

    ctx.fillStyle = '#4FB8D8'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.26)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i = 0; i < 40; i++) {
      const x = (((i * 173) % 1160) - cx * 0.5 % 1160 + 1160) % 1160 - 100;
      const y = (((i * 397) % 740) - cy * 0.5 % 740 + 740) % 740 - 100;
      ctx.beginPath();
      ctx.moveTo(x, y + Math.sin(this.t * 1.4 + i) * 2);
      ctx.lineTo(x + 24, y + Math.sin(this.t * 1.4 + i + 1) * 2);
      ctx.stroke();
    }

    ctx.save();
    ctx.translate(-cx, -cy);

    this.dibujarIsla(ctx);
    this.dibujarIslotes(ctx);
    this.dibujarZonas(ctx);
    this.dibujarEspigones(ctx);
    this.caminos(ctx);
    this.dibujarVallas(ctx);
    this.dibujarRio(ctx);

    ctx.fillStyle = 'rgba(40,70,90,0.07)';
    this.nubes.forEach(n => {
      ctx.beginPath(); ctx.ellipse(n.x + 30, n.y + 40, n.r, n.r * 0.55, 0, 0, 7); ctx.fill();
    });

    const cosas = [];
    MUNDO.flores.forEach(f => cosas.push({ y: f[1], f: () => this.flor(ctx, f[0], f[1]) }));
    MUNDO.rocas.forEach(r => cosas.push({ y: r[1], f: () => this.roca(ctx, r[0], r[1]) }));
    MUNDO.matas.forEach(m => cosas.push({ y: m[1], f: () => this.mata(ctx, m[0], m[1]) }));
    MUNDO.palmeras.forEach(p =>
      cosas.push({ y: p[1], x: p[0], tapa: 110, f: () => this.palmera(ctx, p[0], p[1]) }));
    /* Si va subiendo por un sendero o está en la meseta, lo que hay alrededor
       se pinta ANTES que ella: si no, el monte (o el volcán de al lado) le
       taparía el camino por el que va andando. */
    const jug = this.jugador;
    const dentro = (z) => z && Math.pow((jug.x - z.x) / z.rx, 2) + Math.pow((jug.y - z.y) / z.ry, 2) <= 1;
    const enSenda = (sd) => {
      if (!sd) return false;
      for (let k = 1; k < sd.puntos.length; k++) {
        const a = sd.puntos[k - 1], c = sd.puntos[k];
        if (this.distanciaASegmento(jug.x, jug.y, a[0], a[1], c[0], c[1]) <= sd.ancho) return true;
      }
      return false;
    };
    const subiendo = MUNDO.bloqueos.filter(b =>
      dentro(b.paso) || dentro(b.paso2) || dentro(b.hueco) || enSenda(b.senda));
    const pegados = (a, b) =>
      Math.abs(a.x - b.x) < a.rx + b.rx && Math.abs(a.y - b.y) < a.ry + b.ry;
    MUNDO.bloqueos.forEach(b => {
      const suyo = subiendo.includes(b);                   // el monte que sube
      const vecino = !suyo && subiendo.some(o => pegados(o, b));  // el de al lado
      // primero el vecino, luego el monte (que pinta su sendero encima) y
      // después ya viene ella, que va por el camino
      cosas.push({ y: suyo ? -9990 : vecino ? -9999 : b.y + b.ry, f: () => this.bloqueo(ctx, b) });
    });
    MUNDO.lugares.forEach(l =>
      cosas.push({ y: l.y, x: l.x, tapa: 120, f: () => this.dibujarLugar(ctx, l) }));
    MUNDO.secretos.forEach(s => {
      if (Estado.tieneSecreto(s.id)) return;
      cosas.push({ y: s.y, f: () => this.brillo(ctx, s.x, s.y, s.icono, 300) });
    });
    this.escondites.forEach(e => {
      const r = RAREZAS.find(x => x.id === e.id);
      cosas.push({ y: e.y, f: () => this.brillo(ctx, e.x, e.y, r.icono, 230) });
    });
    MUNDO.piezas.forEach(p => {
      if (Estado.llevaPieza(p.id) || Estado.estaEncajado(p.encaja)) return;
      cosas.push({ y: p.y, f: () => this.brillo(ctx, p.x, p.y, p.icono, 320) });
    });

    const j = this.jugador, m = this.mascota;
    cosas.push({ y: m.y, f: () => {
      if (!Estado.actual.look.mascota) return;
      this.sombra(ctx, m.x, m.y, 13, 0);
      Avatar.dibujarMascota(ctx, m.x, m.y, 0.95, Estado.actual.look.mascota, m.mirando, this.t);
    } });
    /* Yendo en algo, se pinta al final de todo: si no, el agua del lago o la
       pista de los coches la taparían por completo. */
    const pintarJugadora = () => {
      this.sombra(ctx, j.x, j.y, this.vehiculo ? 26 : 15, j.z);
      if (this.vehiculo) this.dibujarVehiculo(ctx, j.x, j.y, this.vehiculo.tipo, j.mirando);
      const alto = this.vehiculo ? (this.vehiculo.tipo === 'caballo' ? 30 :
                   this.vehiculo.tipo === 'tiovivo' ? 0 : 12) : 0;
      Avatar.dibujar(ctx, j.x, j.y - j.z - alto, 1.15, Estado.actual.look, j.mirando, j.paso);
    };
    if (!this.vehiculo) cosas.push({ y: j.y, f: pintarJugadora });

    /* Si algo alto va a tapar al personaje, se dibuja medio transparente:
       antes se quedaba escondido detrás de una palmera o de una casa. */
    cosas.sort((a, b) => a.y - b.y).forEach(c => {
      const tapa = c.tapa && c.y > j.y &&
        Math.abs(c.x - j.x) < c.tapa && (c.y - j.y) < c.tapa * 1.5;
      if (tapa) { ctx.save(); ctx.globalAlpha = 0.45; c.f(); ctx.restore(); }
      else c.f();
    });
    if (this.vehiculo) pintarJugadora();
    this.mariposa(ctx);
    this.carteles(ctx);

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    this.nubes.forEach(n => {
      ctx.beginPath(); ctx.ellipse(n.x, n.y, n.r, n.r * 0.5, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(n.x + n.r * 0.5, n.y + 8, n.r * 0.6, n.r * 0.36, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(n.x - n.r * 0.5, n.y + 6, n.r * 0.5, n.r * 0.3, 0, 0, 7); ctx.fill();
    });

    ctx.restore();
  },

  /* El cartelito que sale pegado a lo que tienes al lado: el icono, la tecla
     y el nombre. Va en el mundo, justo encima del objeto. */
  carteles(ctx) {
    if (this.vehiculo || this.modoPiedras) return;
    let x, y, accion, nombre;

    if (this.cogible) {
      const c = this.cogible.dato;
      x = c.x; y = c.y - 56; accion = 'coger';
      nombre = this.cogible.clase === 'pieza' ? c.nombre : '¡Algo!';
    } else if (this.entregable && this.lugar) {
      x = this.lugar.x; y = this.lugar.y - 140; accion = 'dar';
      nombre = 'Dar ' + this.entregable.nombre.replace('Un ', '').replace('Una ', '');
    } else if (this.encajable && this.lugar) {
      x = this.lugar.x; y = this.lugar.y - 140; accion = 'coger';
      nombre = 'Poner ' + this.encajable.nombre.replace('Un ', '').replace('Una ', '');
    } else if (this.lugar && this.lugar.accion) {
      const alto = { cabana: 150, tienda: 142, animalario: 132, salon: 142, farol: 184,
                     fruta: 114, playa: 110, cartel: 120, cartes: 134 }[this.lugar.dibujo] || 112;
      x = this.lugar.x; y = this.lugar.y - alto - 34; accion = this.lugar.accion;
      nombre = this.lugar.nombre;
    } else return;

    // que no se salga por arriba de la pantalla
    y = Math.max(y, this.camY + 66);

    const tecla = Estado.actual.control === 'flechas' ? 'espacio' : '👉';
    ctx.save();
    ctx.font = 'bold 15px system-ui, sans-serif';
    const anchoTecla = Math.max(26, ctx.measureText(tecla).width + 16);
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.textAlign = 'left';
    const anchoTexto = ctx.measureText(nombre).width;
    const ancho = anchoTexto + 58 + anchoTecla;
    const ix = x - ancho / 2;

    ctx.fillStyle = 'rgba(255,255,255,0.96)';
    ctx.beginPath(); ctx.roundRect(ix, y - 22, ancho, 40, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.10)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(ix, y - 22, ancho, 40, 14); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.96)';                 // el pico de abajo
    ctx.beginPath();
    ctx.moveTo(x - 8, y + 17); ctx.lineTo(x, y + 27); ctx.lineTo(x + 8, y + 17); ctx.fill();

    ctx.font = '19px system-ui, sans-serif';
    ctx.fillStyle = '#2F2A28';
    ctx.fillText(ICONOS[accion], ix + 12, y + 5);

    ctx.fillStyle = '#5FA55A';                                 // la tecla
    ctx.beginPath(); ctx.roundRect(ix + 40, y - 12, anchoTecla, 21, 7); ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(tecla, ix + 40 + anchoTecla / 2, y + 4);

    ctx.fillStyle = '#2F2A28';
    ctx.font = 'bold 17px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(nombre, ix + 48 + anchoTecla, y + 4);
    ctx.restore();
  },

  dibujarIsla(ctx) {
    const i = MUNDO.isla;
    for (let k = 3; k >= 1; k--) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.16 * k / 3 + 0.06) + ')';
      const extra = k * 16 + Math.sin(this.t * 1.2 + k) * 5;
      ctx.beginPath(); ctx.ellipse(i.cx, i.cy, i.rx + extra, i.ry + extra * 0.85, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#F6E7BF';
    ctx.beginPath(); ctx.ellipse(i.cx, i.cy, i.rx, i.ry, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#EFDCAC';
    ctx.beginPath(); ctx.ellipse(i.cx, i.cy, i.rx - 45, i.ry - 38, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#A8DB94';
    ctx.beginPath(); ctx.ellipse(i.cx, i.cy, i.rx - 130, i.ry - 110, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#96D183';
    [[-360, -200, 400, 210], [300, 140, 320, 200], [-140, 340, 280, 150],
     [200, -340, 240, 140]].forEach(m => {
      ctx.beginPath(); ctx.ellipse(i.cx + m[0], i.cy + m[1], m[2], m[3], 0.3, 0, 7); ctx.fill();
    });
  },

  /* Las zonas que cambian el color del suelo */
  dibujarZonas(ctx) {
    MUNDO.zonas.forEach(z => {
      ctx.save();
      if (z.tipo === 'rosa') {
        ctx.fillStyle = '#F7CFD6';
        ctx.beginPath(); ctx.ellipse(z.x, z.y, z.rx, z.ry, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#FBDDE2';
        ctx.beginPath(); ctx.ellipse(z.x - 60, z.y - 30, z.rx * 0.7, z.ry * 0.6, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        for (let k = 0; k < 40; k++) {
          const a = k * 1.7, rr = (k % 7) / 7;
          ctx.beginPath();
          ctx.arc(z.x + Math.cos(a) * z.rx * rr, z.y + Math.sin(a) * z.ry * rr, 2, 0, 7); ctx.fill();
        }
      }
      if (z.tipo === 'bosque') {
        ctx.fillStyle = '#7BB86A';
        ctx.beginPath(); ctx.ellipse(z.x, z.y, z.rx, z.ry, 0, 0, 7); ctx.fill();
      }
      if (z.tipo === 'feria') {
        ctx.fillStyle = '#E9DCC4';
        ctx.beginPath(); ctx.ellipse(z.x, z.y, z.rx, z.ry, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#F3E9D6';
        ctx.beginPath(); ctx.ellipse(z.x, z.y, z.rx - 40, z.ry - 30, 0, 0, 7); ctx.fill();
      }
      if (z.tipo === 'tinieblas') {
        ctx.fillStyle = '#4C5B7A';
        ctx.beginPath(); ctx.ellipse(z.x, z.y, z.rx, z.ry, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(30,40,70,0.45)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y, z.rx * 0.8, z.ry * 0.8, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(160,190,255,0.16)';       // jirones de niebla
        for (let k = 0; k < 5; k++) {
          const dx = Math.sin(this.t * 0.4 + k) * 40;
          ctx.beginPath();
          ctx.ellipse(z.x + dx + (k - 2) * 90, z.y + (k % 3 - 1) * 70, 90, 26, 0, 0, 7); ctx.fill();
        }
      }
      ctx.restore();
    });
  },

  /* Las islas pequeñas, aparte de la grande */
  dibujarIslotes(ctx) {
    MUNDO.islotes.forEach(s => {
      for (let k = 3; k >= 1; k--) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.16 * k / 3 + 0.06) + ')';
        const extra = k * 14 + Math.sin(this.t * 1.2 + k) * 4;
        ctx.beginPath(); ctx.ellipse(s.x, s.y, s.rx + extra, s.ry + extra * 0.85, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#F6E7BF';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#A8DB94';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.rx - 90, s.ry - 70, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#96D183';
      ctx.beginPath(); ctx.ellipse(s.x - 70, s.y - 40, s.rx - 240, s.ry - 200, 0.2, 0, 7); ctx.fill();
    });
  },

  /* El espigón de madera que se mete en el mar, y sus boyas */
  dibujarEspigones(ctx) {
    MUNDO.pasarelas.forEach(p => {
      if (p.requiere) return this.puente(ctx, p);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx + 16, p.ry + 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#B5764B';
      ctx.fillRect(p.x - p.rx, p.y - p.ry, p.rx * 2, p.ry * 2);
      ctx.fillStyle = '#A6784D';
      for (let y = p.y - p.ry; y < p.y + p.ry; y += 22) {
        ctx.fillRect(p.x - p.rx, y, p.rx * 2, 3);
      }
      ctx.fillStyle = '#8D5A3B';                       // postes de los lados
      for (let y = p.y - p.ry + 14; y < p.y + p.ry; y += 50) {
        ctx.fillRect(p.x - p.rx - 6, y, 7, 16);
        ctx.fillRect(p.x + p.rx - 1, y, 7, 16);
      }
    });

    MUNDO.boyas.forEach((b, k) => {
      const flota = Math.sin(this.t * 1.6 + k) * 4;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.ellipse(b[0], b[1] + 8, 16, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#E8506B';
      ctx.beginPath(); ctx.arc(b[0], b[1] + flota, 11, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(b[0], b[1] + flota, 11, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#C9BFA8';
      ctx.fillRect(b[0] - 2, b[1] - 12 + flota, 4, 8);
    });
  },

  /* El puente colgante: si el paso está cerrado, le faltan tablones */
  puente(ctx, p) {
    const abierto = Estado.pasoAbierto(p.requiere);
    const x1 = p.x - p.rx, x2 = p.x + p.rx;
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    [-1, 1].forEach(lado => {                                   // las cuerdas
      ctx.beginPath();
      ctx.moveTo(x1, p.y + lado * 26);
      ctx.quadraticCurveTo(p.x, p.y + lado * 26 + 26, x2, p.y + lado * 26);
      ctx.stroke();
    });
    for (let i = 0; i <= 16; i++) {                             // los tablones
      const k = i / 16;
      const tx = x1 + (x2 - x1) * k;
      const comba = Math.sin(k * Math.PI) * 22;
      if (!abierto && (i % 3 === 1)) continue;                  // faltan algunos
      ctx.fillStyle = abierto ? '#B5764B' : '#9E9A93';
      ctx.fillRect(tx - 12, p.y - 8 + comba, 24, 9);
    }
    ctx.fillStyle = '#8D5A3B';                                  // los postes
    [x1, x2].forEach(px => { ctx.fillRect(px - 6, p.y - 46, 12, 60); });
  },

  caminos(ctx) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#E3CFA0'; ctx.lineWidth = 34;
    this.tramos().forEach(c => {
      ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(c[2], c[3]); ctx.stroke();
    });
    ctx.strokeStyle = '#F0E2BC'; ctx.lineWidth = 26;
    this.tramos().forEach(c => {
      ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(c[2], c[3]); ctx.stroke();
    });
  },

  /* La valla de la feria, con sus banderines y su puerta */
  dibujarVallas(ctx) {
    MUNDO.recintos.forEach(r => {
      const p = r.puerta;
      for (let a = 0; a < 6.28; a += 0.055) {
        const x = r.x + Math.cos(a) * r.rx, y = r.y + Math.sin(a) * r.ry;
        if (Math.pow((x - p.x) / p.rx, 2) + Math.pow((y - p.y) / p.ry, 2) <= 1) continue;
        ctx.fillStyle = '#C9BFA8';
        ctx.fillRect(x - 3, y - 26, 6, 30);
        ctx.fillStyle = ['#E8506B', '#FFE066', '#5AA9DC'][Math.round(a * 10) % 3];
        ctx.beginPath();
        ctx.moveTo(x - 3, y - 26); ctx.lineTo(x + 9, y - 21); ctx.lineTo(x - 3, y - 16); ctx.fill();
      }
      // el arco de la puerta
      ctx.fillStyle = '#E8506B';
      ctx.fillRect(p.x - 8, p.y - p.ry - 10, 12, p.ry * 2 + 14);
      ctx.fillRect(p.x - 8, p.y + p.ry - 4, 12, 10);
      ctx.strokeStyle = '#E8506B'; ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(p.x - 2, p.y - p.ry - 6);
      ctx.quadraticCurveTo(p.x + 40, p.y - p.ry - 60, p.x - 2, p.y + p.ry);
      ctx.stroke();
      ctx.fillStyle = '#FFF3C4'; ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
      ctx.save(); ctx.translate(p.x + 26, p.y); ctx.rotate(Math.PI / 2);
      ctx.fillText('FERIA', 0, 6); ctx.restore();
    });
  },

  /* Las colinas, montañas y demás por los que no se pasa */
  bloqueo(ctx, b) {
    ctx.save();

    if (b.dibujo === 'montana') {
      ctx.fillStyle = '#8A93A6';
      ctx.beginPath();
      ctx.moveTo(b.x - b.rx, b.y + b.ry);
      ctx.lineTo(b.x - b.rx * 0.35, b.y - b.ry * 1.5);
      ctx.lineTo(b.x + b.rx * 0.1, b.y - b.ry * 0.4);
      ctx.lineTo(b.x + b.rx * 0.5, b.y - b.ry * 1.8);
      ctx.lineTo(b.x + b.rx, b.y + b.ry);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#A7AFC0';
      ctx.beginPath();
      ctx.moveTo(b.x - b.rx * 0.35, b.y - b.ry * 1.5);
      ctx.lineTo(b.x + b.rx * 0.1, b.y - b.ry * 0.4);
      ctx.lineTo(b.x + b.rx * 0.5, b.y - b.ry * 1.8);
      ctx.lineTo(b.x + b.rx * 0.02, b.y - b.ry * 1.1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#F2F6FA';                       // nieve en los picos
      [[-0.35, -1.5, 0.22], [0.5, -1.8, 0.26]].forEach(p => {
        ctx.beginPath();
        ctx.moveTo(b.x + b.rx * p[0], b.y + b.ry * p[1]);
        ctx.lineTo(b.x + b.rx * (p[0] - p[2] * 0.5), b.y + b.ry * (p[1] + 0.45));
        ctx.lineTo(b.x + b.rx * (p[0] - p[2] * 0.15), b.y + b.ry * (p[1] + 0.3));
        ctx.lineTo(b.x + b.rx * p[0], b.y + b.ry * (p[1] + 0.5));
        ctx.lineTo(b.x + b.rx * (p[0] + p[2] * 0.2), b.y + b.ry * (p[1] + 0.28));
        ctx.lineTo(b.x + b.rx * (p[0] + p[2] * 0.5), b.y + b.ry * (p[1] + 0.45));
        ctx.closePath(); ctx.fill();
      });

      /* EL SENDERO, pintado encima del monte: sube por la ladera este y arriba
         gira al oeste hasta la meseta. Antes no se pintaba y, al acabarse los
         escalones de abajo, no se sabía por dónde seguir (12-09-2026). */
      const abierto = Estado.pasoAbierto('montana');
      const c = abierto ? ['#E3CFA0', '#EFE2C4'] : ['#7E8494', '#949BAA'];
      ctx.beginPath();                                  // la meseta de arriba
      ctx.ellipse(b.hueco.x, b.hueco.y, b.hueco.rx, b.hueco.ry, 0, 0, 7);
      ctx.fillStyle = c[1]; ctx.fill();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const ruta = b.senda.puntos;                      // lo pintado = lo andable
      [[c[0], b.senda.ancho], [c[1], b.senda.ancho - 22]].forEach(t => {
        ctx.strokeStyle = t[0]; ctx.lineWidth = t[1];
        ctx.beginPath(); ctx.moveTo(ruta[0][0], ruta[0][1]);
        ruta.slice(1).forEach(q => ctx.lineTo(q[0], q[1]));
        ctx.stroke();
      });
      ctx.fillStyle = c[0];                             // los peldaños
      for (let yy = ruta[0][1] - 50; yy > ruta[1][1] + 50; yy -= 34)
        ctx.fillRect(ruta[0][0] - 56, yy, 112, 9);
      ctx.restore(); return;
    }

    if (b.dibujo === 'volcan') {
      ctx.fillStyle = '#6E5A55';
      ctx.beginPath();
      ctx.moveTo(b.x - b.rx, b.y + b.ry);
      ctx.lineTo(b.x - b.rx * 0.28, b.y - b.ry * 1.3);
      ctx.lineTo(b.x + b.rx * 0.28, b.y - b.ry * 1.3);
      ctx.lineTo(b.x + b.rx, b.y + b.ry);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#836C66';
      ctx.beginPath();
      ctx.moveTo(b.x - b.rx * 0.28, b.y - b.ry * 1.3);
      ctx.lineTo(b.x + b.rx * 0.28, b.y - b.ry * 1.3);
      ctx.lineTo(b.x + b.rx * 0.1, b.y + b.ry); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3E3230';
      ctx.beginPath(); ctx.ellipse(b.x, b.y - b.ry * 1.3, b.rx * 0.28, b.rx * 0.09, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#E8724C';
      ctx.beginPath(); ctx.ellipse(b.x, b.y - b.ry * 1.3, b.rx * 0.2, b.rx * 0.06, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(230,230,230,0.5)';         // el hilillo de humo
      for (let k = 0; k < 4; k++) {
        const h = (this.t * 22 + k * 60) % 240;
        ctx.beginPath();
        ctx.arc(b.x + Math.sin(this.t + k) * 16, b.y - b.ry * 1.3 - h, 12 + h * 0.09, 0, 7); ctx.fill();
      }
      ctx.restore(); return;
    }

    if (b.dibujo === 'lago') {
      ctx.fillStyle = '#BFE2C9';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx + 26, b.ry + 20, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#4FB8D8';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#6FC9E3';
      ctx.beginPath(); ctx.ellipse(b.x - 40, b.y - 30, b.rx * 0.6, b.ry * 0.55, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      for (let k = 0; k < 8; k++) {
        const a = k * 0.9;
        ctx.fillRect(b.x + Math.cos(a) * b.rx * 0.6 + Math.sin(this.t * 1.4 + k) * 8,
                     b.y + Math.sin(a) * b.ry * 0.6, 26, 4);
      }
      ctx.fillStyle = '#7FBF6A';                        // nenúfares
      [[-0.4, 0.3], [0.35, -0.35], [0.1, 0.5]].forEach(p => {
        ctx.beginPath();
        ctx.ellipse(b.x + b.rx * p[0], b.y + b.ry * p[1], 16, 10, 0, 0, 7); ctx.fill();
      });
      ctx.restore(); return;
    }

    if (b.dibujo === 'acantilado') {
      ctx.fillStyle = '#8A8378';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#A39B8D';
      ctx.beginPath(); ctx.ellipse(b.x - 10, b.y - 14, b.rx * 0.85, b.ry * 0.8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#6E675D';
      for (let k = 0; k < 6; k++) {
        ctx.beginPath();
        ctx.moveTo(b.x - b.rx + k * b.rx * 0.36, b.y + b.ry * 0.2);
        ctx.lineTo(b.x - b.rx + k * b.rx * 0.36 + 22, b.y - b.ry * 0.5);
        ctx.lineTo(b.x - b.rx + k * b.rx * 0.36 + 44, b.y + b.ry * 0.2);
        ctx.fill();
      }
      ctx.restore(); return;
    }

    if (b.dibujo === 'arboleda') {                     // el bosque cerrado
      for (let k = 0; k < 30; k++) {
        const a = k * 0.83, rr = 0.35 + (k % 5) * 0.16;
        const ax = b.x + Math.cos(a) * b.rx * rr, ay = b.y + Math.sin(a) * b.ry * rr;
        const enSendero =
          (b.paso && Math.pow((ax - b.paso.x) / b.paso.rx, 2) + Math.pow((ay - b.paso.y) / b.paso.ry, 2) <= 1) ||
          (b.paso2 && Math.pow((ax - b.paso2.x) / b.paso2.rx, 2) + Math.pow((ay - b.paso2.y) / b.paso2.ry, 2) <= 1);
        if (enSendero) continue;
        this.arbol(ctx, ax, ay);
      }
      ctx.restore(); return;
    }

    if (b.dibujo === 'colina') {
      ctx.fillStyle = '#8FC27C';
      ctx.beginPath(); ctx.ellipse(b.x, b.y + 10, b.rx, b.ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#7FB56C';
      ctx.beginPath(); ctx.ellipse(b.x, b.y - 6, b.rx * 0.8, b.ry * 0.75, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#72A861';
      ctx.beginPath(); ctx.ellipse(b.x - b.rx * 0.15, b.y - 26, b.rx * 0.5, b.ry * 0.45, 0, 0, 7); ctx.fill();
      if (b.paso) {                                     // los escalones
        ctx.fillStyle = '#CFC6B4';
        for (let k = 0; k < 7; k++) {
          ctx.fillRect(b.paso.x - 26, b.y - b.ry + 16 + k * (b.ry * 2 - 26) / 7, 52, 11);
        }
        ctx.strokeStyle = '#B5AC98'; ctx.lineWidth = 2;
        ctx.strokeRect(b.paso.x - 26, b.y - b.ry + 14, 52, b.ry * 2 - 20);
      }
      MUNDO.rocas.slice(0, 2).forEach((r, k) =>
        this.roca(ctx, b.x - b.rx * 0.6 + k * b.rx * 1.2, b.y + b.ry * 0.4));
    } else {
      ctx.fillStyle = '#D8CFBE';
      ctx.beginPath(); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, 7); ctx.fill();
      for (let k = 0; k < 9; k++) {
        const a = k * 0.7, rr = 0.4 + (k % 3) * 0.22;
        this.roca(ctx, b.x + Math.cos(a) * b.rx * rr, b.y + Math.sin(a) * b.ry * rr);
      }
    }
    ctx.restore();
  },

  dibujarRio(ctx) {
    const r = MUNDO.rio, i = MUNDO.isla;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(i.cx, i.cy, i.rx, i.ry, 0, 0, 7); ctx.clip();
    ctx.fillStyle = '#8FD8E8';
    ctx.fillRect(r.x1 - 12, i.cy - i.ry - 20, r.x2 - r.x1 + 24, i.ry * 2 + 40);
    ctx.fillStyle = '#4FB8D8';
    ctx.fillRect(r.x1, i.cy - i.ry - 20, r.x2 - r.x1, i.ry * 2 + 40);
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    for (let y = i.cy - i.ry; y < i.cy + i.ry; y += 48) {
      ctx.fillRect(r.x1 + 20 + Math.sin(this.t * 1.6 + y * 0.02) * 10, y, 30, 4);
      ctx.fillRect(r.x1 + 180 + Math.sin(this.t * 1.3 + y * 0.03) * 12, y + 20, 24, 4);
    }
    ctx.restore();
    this.dibujarPiedras(ctx);
  },

  dibujarPiedras(ctx) {
    const cfg = MUNDO.piedras;
    const m = this.modoPiedras;
    for (let c = 0; c < cfg.columnas; c++) {
      const x = cfg.primeraX + c * cfg.separacion;
      for (let f = 0; f < 2; f++) {
        const col = m ? m.cols[c] : null;
        if (this.puenteHecho && !m && f === 0) continue;
        const y = f === 0 ? cfg.filaAlta : cfg.filaBaja;
        const hundida = col && col.hundida === f;
        const viva = (col && col.encendida === f) || (this.puenteHecho && !m);
        ctx.save();
        ctx.globalAlpha = hundida ? 0.3 : 1;
        ctx.translate(0, hundida ? 10 : 0);
        ctx.fillStyle = viva ? '#6FC0AB' : '#918D86';
        ctx.beginPath(); ctx.ellipse(x, y + 6, 25, 17, 0, 0, 7); ctx.fill();
        ctx.fillStyle = viva ? '#B8ECDF' : '#B5B0A8';
        ctx.beginPath(); ctx.ellipse(x, y, 25, 16, 0, 0, 7); ctx.fill();
        if (m) {
          ctx.fillStyle = '#2F2A28';
          ctx.font = 'bold 19px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(col.numeros[f], x, y + 7);
        }
        ctx.restore();
      }
    }
  },

  sombra(ctx, x, y, r, z) {
    const k = 1 - Math.min(0.55, (z || 0) / 90);
    ctx.fillStyle = 'rgba(60,80,60,' + (0.18 * k) + ')';
    ctx.beginPath(); ctx.ellipse(x, y, r * k, r * k * 0.42, 0, 0, 7); ctx.fill();
  },

  /* Lo escondido: solo se ve cuando ya estás cerca */
  brillo(ctx, x, y, icono, alcance) {
    const d = Math.hypot(x - this.jugador.x, y - this.jugador.y);
    if (d > alcance) return;
    const fuerza = Math.max(0, 1 - d / alcance);
    ctx.save();
    ctx.globalAlpha = Math.min(1, fuerza * 1.8);
    const halo = 12 + Math.sin(this.t * 4) * 5;
    const g = ctx.createRadialGradient(x, y - 6, 2, x, y - 6, 30 + halo);
    g.addColorStop(0, 'rgba(255,245,180,0.9)');
    g.addColorStop(1, 'rgba(255,245,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - 6, 30 + halo, 0, 7); ctx.fill();
    ctx.font = '26px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(icono, x, y + 2 + Math.sin(this.t * 2) * 3);
    ctx.restore();
  },

  /* El aura del suelo. De lejos dice "aquí hay algo"; el icono de QUÉ es
     solo aparece cuando ya estás cerca. */
  aura(ctx, l) {
    const colores = {
      armario: '240,140,160', tienda: '230,120,90', animalario: '150,190,120',
      juego: '90,180,220', meta: '255,210,90', ver: '150,170,190',
      reto: '255,190,50', letras: '150,130,220', montar: '240,120,90', cuidar: '120,200,180',
    };
    let color = colores[l.accion] || '150,170,190';
    let icono = ICONOS[l.accion] || '';

    // Todos los sitios tienen reto siempre: solo se apagan si el personaje
    // se ha dormido (tres fallos). El ✅ dice que hoy ya lo ganó.
    const rid = Estado.retoDeLugar(l);
    const apagado = false;
    if (rid) {
      if (Estado.estaDormido(rid)) { color = '150,150,150'; icono = '💤'; }
      else if (Estado.hechoHoy(rid)) { color = '120,205,150'; icono = '✅'; }
    }
    if (l.accion === 'meta' && Estado.actual.cristales.length >= 5) icono = '✨';

    const d = Math.hypot(l.x - this.jugador.x, l.y - this.jugador.y);
    const cerca = Math.max(0, 1 - d / 280);
    const flojo = l.accion === 'ver' || apagado;
    const fuerza = (flojo ? 0.14 : 0.30) + cerca * 0.45;
    const pulso = 1 + Math.sin(this.t * (2.2 + cerca * 2) + l.x) * 0.09;
    const radio = (flojo ? 54 : 78) * pulso;

    const g = ctx.createRadialGradient(l.x, l.y + 6, 4, l.x, l.y + 6, radio);
    g.addColorStop(0, 'rgba(' + color + ',' + fuerza + ')');
    g.addColorStop(0.6, 'rgba(' + color + ',' + (fuerza * 0.4) + ')');
    g.addColorStop(1, 'rgba(' + color + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(l.x, l.y + 6, radio, radio * 0.46, 0, 0, 7); ctx.fill();

    ctx.strokeStyle = 'rgba(' + color + ',' + (0.3 + cerca * 0.5) + ')';
    ctx.lineWidth = 2 + cerca * 2.5;
    ctx.beginPath(); ctx.ellipse(l.x, l.y + 6, radio * 0.7, radio * 0.32, 0, 0, 7); ctx.stroke();

    if (cerca > 0.25 && !flojo) {
      for (let k = 0; k < 5; k++) {
        const a = this.t * 1.6 + k * 1.257;
        ctx.fillStyle = 'rgba(' + color + ',' + (cerca * 0.9) + ')';
        ctx.beginPath();
        ctx.arc(l.x + Math.cos(a) * radio * 0.72, l.y + 6 + Math.sin(a) * radio * 0.33,
                2 + cerca * 2, 0, 7);
        ctx.fill();
      }
    }

    // el icono aparece solo de cerca: hasta entonces no sabes qué hay
    if (!icono || cerca < 0.32) return;
    const alto = { cabana: 148, tienda: 140, animalario: 130, salon: 140, farol: 182,
                   fruta: 112, playa: 108, cartel: 118, cartes: 132 }[l.dibujo] || 106;
    const flota = Math.sin(this.t * 2 + l.x) * 5;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (cerca - 0.32) * 4);
    ctx.font = (24 + cerca * 10) + 'px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(icono, l.x, l.y - alto + flota);
    ctx.restore();
  },

  dibujarLugar(ctx, l) {
    if (l.accion) this.aura(ctx, l);
    const hecho = Estado.tieneCristal(l.id);
    const dormido = Estado.estaDormido(l.id);
    const y = l.y, x = l.x;
    ctx.save();
    const f = this['pintar_' + l.dibujo];
    if (f) f.call(this, ctx, x, y, hecho, dormido);
    ctx.restore();
  },

  // --- los edificios y los objetos --------------------------------------
  pintar_cabana(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 52, 0);
    ctx.fillStyle = '#C98A5E'; ctx.fillRect(x - 45, y - 66, 90, 66);
    ctx.fillStyle = '#B87C52';
    for (let k = 0; k < 5; k++) ctx.fillRect(x - 45, y - 62 + k * 13, 90, 2);
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.moveTo(x - 62, y - 64); ctx.lineTo(x, y - 110); ctx.lineTo(x + 62, y - 64); ctx.fill();
    ctx.fillStyle = '#7A4B2F';
    ctx.beginPath(); ctx.moveTo(x - 62, y - 64); ctx.lineTo(x, y - 110);
    ctx.lineTo(x - 4, y - 110); ctx.lineTo(x - 52, y - 64); ctx.fill();
    ctx.fillStyle = '#5E3A24'; ctx.fillRect(x - 13, y - 38, 26, 38);
    ctx.fillStyle = '#F2C14E'; ctx.beginPath(); ctx.arc(x + 8, y - 20, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#EAF6F6'; ctx.fillRect(x + 18, y - 56, 20, 20);
    ctx.strokeStyle = '#8D5A3B'; ctx.lineWidth = 2; ctx.strokeRect(x + 18, y - 56, 20, 20);
    ctx.beginPath(); ctx.moveTo(x + 28, y - 56); ctx.lineTo(x + 28, y - 36); ctx.stroke();
    ctx.fillStyle = '#F08CA0'; ctx.beginPath(); ctx.arc(x - 34, y - 6, 7, 0, 7); ctx.fill();
  },

  pintar_tienda(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 54, 0);
    ctx.fillStyle = '#F6E7BF'; ctx.fillRect(x - 48, y - 62, 96, 62);
    ctx.fillStyle = '#E8927E';                          // toldo a rayas
    ctx.beginPath(); ctx.moveTo(x - 58, y - 62); ctx.lineTo(x + 58, y - 62);
    ctx.lineTo(x + 46, y - 84); ctx.lineTo(x - 46, y - 84); ctx.fill();
    ctx.fillStyle = '#FFF3C4';
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.moveTo(x - 58 + k * 29, y - 62); ctx.lineTo(x - 44 + k * 29, y - 62);
      ctx.lineTo(x - 34 + k * 29, y - 84); ctx.lineTo(x - 46 + k * 29, y - 84); ctx.fill();
    }
    ctx.fillStyle = '#C7E6EE'; ctx.fillRect(x - 38, y - 54, 76, 34);   // escaparate
    ctx.font = '15px system-ui'; ctx.textAlign = 'center';

  pintar_animalario(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 48, 0);
    ctx.fillStyle = '#C9E4A8'; ctx.fillRect(x - 44, y - 50, 88, 50);
    ctx.fillStyle = '#7FBF6A';
    ctx.beginPath(); ctx.moveTo(x - 54, y - 48); ctx.lineTo(x, y - 82); ctx.lineTo(x + 54, y - 48); ctx.fill();
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.arc(x, y - 24, 15, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 15, y - 24, 30, 24);
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 3;                  // vallita
    for (let k = 0; k < 5; k++) {
      ctx.beginPath(); ctx.moveTo(x - 40 + k * 20, y + 2); ctx.lineTo(x - 40 + k * 20, y - 14); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(x - 42, y - 8); ctx.lineTo(x + 42, y - 8); ctx.stroke();
    ctx.font = '16px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('🐾', x + 30, y - 56);
  },

  pintar_salon(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 52, 0);
    ctx.fillStyle = '#F26D6D';
    ctx.beginPath(); ctx.moveTo(x - 58, y - 52); ctx.lineTo(x, y - 104); ctx.lineTo(x + 58, y - 52); ctx.fill();
    ctx.fillStyle = '#FFF3C4';
    for (let k = 0; k < 4; k++) {
      ctx.beginPath(); ctx.moveTo(x - 58 + k * 29, y - 52);
      ctx.lineTo(x - 58 + k * 29 + 14, y - 78 + k * 6);
      ctx.lineTo(x - 58 + k * 29 + 29, y - 52); ctx.fill();

    ctx.fillStyle = '#FFF8E0'; ctx.fillRect(x - 48, y - 52, 96, 52);
    ctx.fillStyle = '#3C6E71'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('JUEGOS', x - 4, y - 24);
    this.loro(ctx, x + 32, y - 2);

  pintar_playa(ctx, x, y, hecho, dormido) {
    ctx.fillStyle = hecho ? '#FFD1DC' : '#DCD2C6';
    for (let k = 0; k < (hecho ? 12 : 4); k++) {
      ctx.beginPath(); ctx.arc(x - 52 + (k * 17) % 108, y + 16 + (k % 3) * 11, 5, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#8D5A3B'; ctx.fillRect(x + 40, y - 40, 6, 40);
    ctx.fillStyle = hecho ? '#FF9AA2' : '#BDB6AC';
    ctx.beginPath(); ctx.arc(x + 43, y - 48, 13, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 43, y - 48, 13, 4, 0, 0, 7); ctx.fill();
    this.sombra(ctx, x, y + 2, 16, 0);
    this.personajeSimple(ctx, x, y, '#F08CA0', '#3A2E2B', dormido);
  },

  pintar_fruta(ctx, x, y, hecho, dormido) {
    this.sombra(ctx, x, y + 4, 50, 0);
    ctx.fillStyle = '#B98B5E'; ctx.fillRect(x - 52, y - 34, 104, 12);
    ctx.fillRect(x - 48, y - 22, 6, 22); ctx.fillRect(x + 42, y - 22, 6, 22);
    ctx.fillStyle = '#5FA55A';
    ctx.beginPath(); ctx.moveTo(x - 64, y - 34); ctx.lineTo(x, y - 70); ctx.lineTo(x + 64, y - 34); ctx.fill();
    ctx.fillStyle = '#4E8F4A';
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.moveTo(x - 64 + k * 43, y - 34);
      ctx.lineTo(x - 64 + k * 43 + 21, y - 46); ctx.lineTo(x - 64 + k * 43 + 43, y - 34); ctx.fill();
    }
    ctx.font = '17px system-ui'; ctx.textAlign = 'center';
    (hecho ? ['🍎', '🍊', '🍐', '🍓', '🍌'] : ['🍎']).forEach((f, k) =>
      ctx.fillText(f, x - 38 + k * 19, y - 36));
    this.oso(ctx, x - 6, y, dormido);
  },

  pintar_cartes(ctx, x, y, hecho, dormido) {
    this.sombra(ctx, x, y + 4, 46, 0);
    ctx.fillStyle = '#EFDCAC'; ctx.fillRect(x - 40, y - 60, 80, 60);
    ctx.fillStyle = '#5B8FA8';
    ctx.beginPath(); ctx.moveTo(x - 52, y - 58); ctx.lineTo(x, y - 94); ctx.lineTo(x + 52, y - 58); ctx.fill();
    ctx.fillStyle = '#8D5A3B'; ctx.fillRect(x - 12, y - 34, 24, 34);
    ctx.fillStyle = '#E8506B'; ctx.fillRect(x + 22, y - 46, 14, 22);
    ctx.fillStyle = '#FFF'; ctx.fillRect(x + 25, y - 42, 8, 3);
    ctx.fillStyle = '#3C6E71'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('CARTES', x - 12, y - 70);
