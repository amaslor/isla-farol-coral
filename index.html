<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La isla del Farol de Coral</title>
<style>
  :root{
    color-scheme: light;      /* el juego es siempre claro, aunque el Mac esté en oscuro */
    --crema:#FDF6E3; --tinta:#2F2A28; --turquesa:#3C8DA6; --coral:#F0836F;
    --verde:#5FA55A; --sombra:0 4px 0 rgba(0,0,0,.12);
  }
  /* Todos los controles llevan su color escrito: si no, el modo oscuro del
     sistema los pinta en blanco sobre blanco y no se lee nada. */
  button, input, select, textarea{ color: var(--tinta); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{
    margin:0; background:var(--crema); color:var(--tinta);
    font-family:"Verdana","Trebuchet MS",system-ui,sans-serif;
    font-size:19px; line-height:1.7; letter-spacing:.3px;
    display:flex; justify-content:center; align-items:center; min-height:100vh; min-height:100dvh;
  }
  .oculto{display:none !important}
  h1{font-size:30px; margin:.2em 0; color:var(--turquesa)}
  p{margin:.5em 0}

  .btn{
    font:inherit; font-weight:bold; background:var(--turquesa); color:#fff;
    border:0; border-radius:14px; padding:14px 22px; margin:6px;
    cursor:pointer; box-shadow:var(--sombra); min-height:52px;
  }
  .btn:hover{filter:brightness(1.07)}
  .btn.defecto{background:var(--verde); font-size:21px; padding:16px 30px}
  .btn .tecla{display:block; font-size:12px; font-weight:normal; opacity:.85; letter-spacing:1px}
  .cerrar{position:absolute; top:10px; right:12px; width:44px; height:44px; border:0;
          border-radius:50%; background:#EFE6D0; color:#8A837A; font-size:20px; cursor:pointer}
  .cerrar:hover{background:#E4D8BC}
  .btn.bien{background:var(--verde)}
  .btn.mal{background:#C9C4BC}
  .enlace{background:none;border:0;color:#9A938A;font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}

  /* ---------- pantallas ---------- */
  #inicio,#crear{text-align:center; padding:24px; max-width:900px}
  #listaPerfiles{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:18px}
  .ficha{background:#fff; color:var(--tinta); border-radius:20px; padding:14px 18px; box-shadow:var(--sombra); min-width:170px}
  .ficha small{display:block; color:#8A837A; font-size:15px}
  /* La línea que dice si en este aparato se está guardando la partida */
  #avisoGuardado{font-size:15px; color:#8A837A; margin-top:18px}
  #avisoGuardado.alerta{color:#B4462F; background:#FFE9E2; border-radius:14px;
                        padding:12px 18px; max-width:34em; margin:18px auto 0; font-weight:bold}
  .fila-enlaces{display:flex; gap:10px; justify-content:center; margin-top:4px}
  .ficha.nueva{display:flex; align-items:center}
  .mini{display:block; margin:0 auto}

  #textoPedido{font:inherit; font-size:17px; color:var(--tinta); background:#fff; width:100%;
               border:3px solid #E3D9C0; border-radius:14px; padding:12px; resize:vertical;
               box-sizing:border-box; margin:6px 0}
  #crear input{font:inherit; color:var(--tinta); background:#fff; padding:12px;
               border:3px solid #E3D9C0; border-radius:12px; width:min(340px,80vw); text-align:center}
  .elige{font:inherit; color:var(--tinta); background:#fff; border:3px solid #E3D9C0;
         border-radius:16px; padding:12px 18px; margin:6px; cursor:pointer; min-height:56px}
  .elige.elegido{border-color:var(--turquesa); background:#E7F4F8}
  .grupo{margin:14px 0}
  .grupo b{display:block; margin-bottom:4px}
  #avisoCrear{color:var(--coral); min-height:28px; font-weight:bold}

  /* ---------- el juego ---------- */
  /* El juego ocupa toda la ventana, no una cajita en medio */
  /* El juego ocupa lo que de verdad se ve. En el iPad, 100vh es la altura SIN
     la barra del navegador, así que la parte de abajo (los mandos) quedaba
     tapada; 'dvh' es la altura real de cada momento. (12-09-2026) */
  #juego{position:fixed; inset:0; width:100vw; height:100vh; height:100dvh}
  #lienzo{width:100%; height:100%; display:block; background:#4FB8D8; touch-action:manipulation}
  #hud{position:absolute; top:10px; left:14px; right:14px; display:flex; gap:12px; align-items:center;
       font-weight:bold; text-shadow:0 2px 0 #fff; pointer-events:none}
  #hud .caja-hud{background:rgba(255,255,255,.85); border-radius:12px; padding:4px 12px}
  #hud .der{margin-left:auto; pointer-events:auto}
  /* Arriba del todo: si va en el centro, tapa al personaje */
  .tecla-globo{display:inline-block; background:var(--verde); color:#fff; border-radius:8px;
               padding:0 9px; margin:0 3px}
  #hadaGlobo small{display:block; color:#7A736A; font-size:15px; font-weight:normal}
  #globo b{display:inline-block; background:var(--verde); color:#fff; border-radius:8px;
           padding:1px 10px; margin-right:6px}
  /* OJO: el contenedor de los mandos ocupa todo el ancho y 168 px de alto, así
     que tapaba el botón «Bajarme» de la barra del paseo (y los clics en la
     parte de abajo del mapa). Los huecos entre botones no deben capturar nada:
     por eso el contenedor no recibe pulsaciones y los botones sí. (12-09-2026) */
  #mandos{position:absolute; bottom:14px; left:14px; right:14px; display:flex; gap:10px;
          align-items:flex-end; pointer-events:none}
  #mandos button{pointer-events:auto}
  #mandos .der{margin-left:auto; display:flex; gap:10px; align-items:flex-end}
  #mandos button{font-size:24px; width:66px; height:58px; border:0; border-radius:18px;
                 background:rgba(255,255,255,.9); box-shadow:var(--sombra); cursor:pointer;
                 font-family:inherit; font-weight:bold; color:var(--tinta)}
  #mandos .accion{background:var(--verde); color:#fff; font-size:26px}
  .cruceta{display:flex; flex-direction:column; align-items:center; gap:6px}
  .cruceta div{display:flex; gap:6px}
  #bSonido,#bMapa,#bPantalla,#bMochila,#bAyuda,#bCuadernos{font-size:20px; border:0; border-radius:10px;
           padding:4px 8px; background:rgba(255,255,255,.85); cursor:pointer; margin-right:6px}

  /* Los avisos van abajo: arriba taparían las piedras del río */
  .aviso{position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
         background:#fff; border-radius:16px; padding:10px 20px; font-weight:bold;
         box-shadow:var(--sombra); animation:sube .4s; max-width:70%; text-align:center}
  @keyframes sube{from{opacity:0; transform:translate(-50%,10px)}}

  /* ---------- ventanas ---------- */
  #modal{position:fixed; inset:0; background:rgba(47,42,40,.45);
         display:flex; align-items:center; justify-content:center; padding:16px; z-index:10}
  /* Mientras hay una ventana abierta, la página de debajo no se mueve. En la
     tableta, sin esto, abrir y cerrar un reto arrastraba el scroll y hacía
     reaparecer la barra del navegador. (12-09-2026) */
  body.con-modal{overflow:hidden}
  .caja{position:relative; background:var(--crema); border-radius:24px; padding:30px 26px 24px; max-width:860px;
        width:100%; max-height:92vh; max-height:92dvh; overflow:auto;
        box-shadow:0 10px 40px rgba(0,0,0,.3); text-align:center;
        -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
  .quien{font-weight:bold; color:var(--coral); font-size:17px}
  .dice{font-size:22px; line-height:1.75; margin:10px auto; max-width:22em}
  .pregunta{font-weight:bold; color:var(--turquesa)}
  .pista{min-height:30px; color:#7A736A; font-size:17px}
  .altavoz{min-height:44px}
  .btn-voz{font:inherit; color:var(--tinta); background:#FFF3C4; border:3px solid #F2C14E; border-radius:12px;
           padding:8px 16px; cursor:pointer; font-size:16px}
  .contador{font-size:19px; margin:8px}
  .cuenta-grande{font-size:46px; font-weight:bold; margin:14px}

  .tarjetas{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
  .tarjeta{font:inherit; color:var(--tinta); background:#fff; border:3px solid #E3D9C0; border-radius:20px;
           padding:16px; width:190px; cursor:pointer; display:flex; flex-direction:column; gap:8px}
  .tarjeta .icono{font-size:30px}
  .tarjeta.bien{border-color:var(--verde); background:#E7F6E4}
  .tarjeta.mal{border-color:#DDD6CC; opacity:.55}
  .tarjetas.esperando{visibility:hidden}

  /* El álbum de pegatinas */
  .album{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin:10px 0}
  .pegatina{background:#fff; border:3px solid #E3D9C0; border-radius:16px; padding:10px 6px;
            display:flex; flex-direction:column; gap:4px; font-size:15px}
  .pegatina-icono{font-size:34px}
  .pegatina.plata{border-color:#B8C4CC; background:#F4F7F9}
  .pegatina.oro{border-color:#F2C14E; background:#FFF6D8}
  .pegatina.vacia{border-style:dashed; opacity:.5}
  /* El Cuaderno de Manitas: los cromos que faltan salen apagados y con su pista */
  .cromo{background:#fff; border:3px solid #E3D9C0; border-radius:16px; padding:10px 8px;
         text-align:center; display:flex; flex-direction:column; gap:4px}
  .cromo .cara{font-size:38px; line-height:1.1}
  .cromo small{color:#7A736A; font-size:13px; line-height:1.4}
  .cromo.hecho{border-color:var(--verde); background:#E7F6E4}
  .cromo.falta{border-style:dashed}
  .cromo.falta .cara{filter:grayscale(1); opacity:.45}
  .cromo.llevo{border-color:var(--coral); background:#FFF1EC}

  /* Las conchas en filas de cinco: así se cuentan de un vistazo */
  /* Los peces del espigón */
  .mar{background:linear-gradient(#7FD3E8,#4FB8D8); border-radius:18px; padding:14px;
       margin:10px auto; max-width:460px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .pez{font:inherit; color:var(--tinta); background:#fff; border:3px solid #B8E4F0;
       border-radius:16px; padding:8px 12px; cursor:pointer; font-size:24px; line-height:1.1}
  .pez span{display:block; font-size:17px; font-weight:bold}
  .pez.pescado{background:#E7F6E4; border-color:var(--verde); opacity:.55; transform:scale(.9)}
  .pez.escapa{animation:escapa .6s}
  @keyframes escapa{50%{transform:translateX(18px) rotate(12deg); opacity:.4}}

  /* Las manchas de barro que se limpian */
  .barro{background:#DCE8D4; border-radius:18px; padding:12px; margin:10px auto; max-width:340px;
         display:grid; grid-template-columns:repeat(5,1fr); gap:6px 4px; justify-items:center}
  .mancha{font-size:28px; color:var(--tinta); background:none; border:0; cursor:pointer; padding:2px; line-height:1}
  .mancha.limpia{opacity:.2; transform:scale(.7)}

  .arena{background:#F2E2B6; border-radius:18px; padding:12px; margin:10px auto; max-width:330px;
         display:grid; grid-template-columns:repeat(5,1fr); gap:6px 4px; justify-items:center}
  .concha{font-size:30px; color:var(--tinta); background:none; border:0; cursor:pointer; padding:2px; line-height:1}
  .concha.cogida{opacity:.25; transform:scale(.8)}

  .monton{background:#F2E2B6; border-radius:18px; padding:12px; min-height:56px; font-size:28px}
  .cestas{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  .cesta{font:inherit; color:var(--tinta); font-size:34px; background:#fff; border:3px solid #E3D9C0;
         border-radius:18px; padding:10px 14px; cursor:pointer; min-width:110px}
  .cesta .dentro{display:block; font-size:17px; line-height:1.2; word-break:break-all}
  .cesta .cuenta{display:block; font-size:20px; color:var(--turquesa)}

  .botones.grandes .btn{font-size:30px; min-width:110px}

  /* La cerradura del huevo */
  .pantallita{font-size:40px; font-weight:bold; letter-spacing:6px; background:#2F3A3A;
              color:#8FE3C8; border-radius:14px; padding:8px; margin:10px auto; max-width:220px}
  .teclado{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-width:340px; margin:0 auto}
  .tecla-num{font:inherit; color:var(--tinta); font-size:22px; font-weight:bold; background:#fff;
             border:3px solid #E3D9C0; border-radius:14px; padding:12px 0; cursor:pointer}
  .tecla-num.borrar{background:#F6E7D0}

  /* La norma de ortografía y sus colores: naranja a/o/u, azul e/i */
  .norma{background:#FFF9EC; border:3px solid #E3D9C0; border-radius:16px;
         padding:12px 16px; margin:10px 0; text-align:left; line-height:1.6}
  .voc-forta{color:#D2691E; font-weight:bold}
  .voc-fluixa{color:#2E86AB; font-weight:bold}
  .btn .voc-forta{color:#FFC87A}
  .btn .voc-fluixa{color:#9FE3FF}

  /* El hueco de las palabras */
  .hueco{display:inline-block; min-width:34px; background:#FFF3C4; border-bottom:4px solid #F2C14E;
         border-radius:6px; color:#B8860B; text-align:center}

  /* Dentro de casa: las tres puertas */
  .puertas{display:flex; flex-direction:column; gap:10px}
  .puerta{font:inherit; color:var(--tinta); background:#fff; border:3px solid #E3D9C0;
          border-radius:18px; padding:12px 16px; cursor:pointer; text-align:left;
          display:flex; align-items:center; gap:14px}
  .puerta:hover{border-color:var(--turquesa); background:#F2FAFC}
  .puerta-icono{font-size:34px}
  .puerta small{display:block; color:#8A837A; font-weight:normal}
  .aviso-tienda{background:#FFF3C4; border-radius:14px; padding:10px 14px; color:#7A6A3A}

  /* El baño */
  .rutinas{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:12px 0}
  .rutina{font:inherit; color:var(--tinta); background:#fff; border:3px solid #E3D9C0;
          border-radius:18px; padding:12px 10px; cursor:pointer; width:140px}
  .rutina.hecha{border-color:var(--verde); background:#E7F6E4}
  .rutina-icono{display:block; font-size:34px}
  .rutina small{display:block; color:#8A837A}

  /* La barra del paseo: cuánto queda */
  #barraTiempo{position:absolute; bottom:92px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:20px; padding:10px 20px; box-shadow:var(--sombra);
    display:flex; align-items:center; gap:14px; font-weight:bold; font-size:19px; z-index:5}
  #barraTiempo .barra{width:min(280px,34vw); height:16px; background:#EFE6D0; border-radius:10px; overflow:hidden}
  .btn.chiquito{padding:8px 18px; min-height:0; font-size:16px; margin:0}
  #barraPuente{position:absolute; bottom:92px; left:50%; transform:translateX(-50%); z-index:5}
  #relleno{height:100%; width:100%; background:linear-gradient(90deg,#5FA55A,#8FE3C8); transition:width .2s}

  /* ---------- EN EL MÓVIL ----------
     A 375 px de ancho no cabe lo mismo que en el Mac: la barra de arriba se
     apretuja y el hada se come los botones. Aquí se recoloca todo. */
  .en-estrecho{display:none}
  @media (max-width: 620px){
    body{font-size:17px}
    h1{font-size:25px}
    .en-ancho{display:none}
    .en-estrecho{display:inline}

    #hud{top:8px; left:8px; right:8px; gap:6px; font-size:15px; flex-wrap:nowrap}
    #hud .caja-hud{padding:3px 9px; border-radius:10px}
    #hud .caja-nombre{display:none}          /* el nombre ya sale en la portada */
    #hud .der{display:flex; gap:3px; align-items:center; flex-wrap:nowrap}
    #bSonido,#bMapa,#bPantalla,#bMochila,#bAyuda,#bCuadernos{font-size:17px; padding:3px 5px; margin-right:0}
    #volverInicio{font-size:17px; text-decoration:none; padding:0 3px}

    /* El hada, más pequeña y por debajo de la barra de arriba */
    #hada{top:62px; right:8px; gap:6px}
    #hadaLienzo{width:66px; height:66px}
    #hadaGlobo{font-size:15px; line-height:1.45; padding:9px 13px; max-width:62vw;
               border-radius:16px 16px 4px 16px}

    /* Los mandos, un poco más juntos para que quepan bien */
    #mandos{bottom:10px; left:8px; right:8px; gap:8px}
    #mandos button{width:58px; height:52px; font-size:21px; border-radius:15px}

    /* Las ventanas, a pantalla casi completa */
    .caja{padding:22px 14px 16px; border-radius:18px; max-height:94vh}
    .dice{font-size:19px}
    .tarjeta{width:150px; padding:12px; font-size:15px}
    .opcion{width:108px}
    .opcion .prevista{width:86px; height:112px}
    .espejo-lado{min-width:0}
    .pista-flotante{font-size:15px; padding:10px 14px; bottom:78px}

    /* El espejo, pequeño: lo que importa aquí es ver la ropa de la lista */
    .espejo-fila{gap:10px}
    .espejo-fila > canvas{width:104px; height:auto}
    .opciones{max-height:none}
  }

  /* Con una ventana abierta, Lumi se quita de en medio (menos al presentarse) */
  .con-modal #hada:not(.presentando){display:none}

  /* Lumi, el hada que acompaña */
  #hada{position:fixed; top:64px; right:14px; display:flex; align-items:center;
        gap:10px; cursor:pointer; z-index:11;
        transition:top 1.2s cubic-bezier(.4,0,.2,1), right 1.2s cubic-bezier(.4,0,.2,1),
                   transform 1.2s cubic-bezier(.4,0,.2,1)}
  /* Al presentarse sale en medio de la pantalla y grande */
  #hada.presentando{top:16px; right:50%; transform:translateX(50%) scale(1.9);
                    transform-origin:top center; z-index:20}
  #hada.presentando #hadaGlobo{display:none}
  /* mientras se presenta, el cuadro de texto baja para dejarla verse */
  #modal.con-hada{align-items:flex-end; padding-bottom:4vh}
  #hadaLienzo{width:110px; height:110px; flex:none}
  #hadaGlobo{background:#fff; border:3px solid #FFE066; border-radius:20px 20px 4px 20px;
             padding:12px 18px; box-shadow:var(--sombra); font-size:17px; line-height:1.55;
             max-width:min(420px,52vw); animation:entraHada .35s}
  @keyframes entraHada{from{opacity:0; transform:translateX(14px) scale(.94)}}
  #hadaGlobo.oculto{display:none}

  /* Las pistas que salen solas mientras juegas */
  .pista-flotante{position:absolute; left:50%; bottom:86px; transform:translateX(-50%);
    background:#fff; border-radius:18px; padding:12px 20px; box-shadow:var(--sombra);
    display:flex; align-items:center; gap:12px; max-width:min(560px,86%);
    font-size:17px; animation:entraPista .45s; border:3px solid #FFE066}
  .pista-flotante .pista-icono{font-size:28px}
  .pista-flotante.yendose{opacity:0; transform:translate(-50%,12px); transition:.5s}
  @keyframes entraPista{from{opacity:0; transform:translate(-50%,16px)}}

  /* El tutorial */
  .tuto-icono{font-size:52px; line-height:1.1}
  .tuto-puntos{display:flex; gap:6px; justify-content:center; margin:10px 0}
  .punto{width:9px; height:9px; border-radius:50%; background:#E3D9C0}
  .punto.activo{background:var(--turquesa); transform:scale(1.3)}
  .btn.gris{background:#C9C2B4}

  /* El animalario */
  .animales{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
  .ficha-animal{font:inherit; color:var(--tinta); background:#fff; border:3px solid #E3D9C0;
                border-radius:18px; padding:10px 14px; cursor:pointer; min-width:120px}
  .ficha-animal.puesta{border-color:var(--verde); background:#E7F6E4}
  .sinAnimal{font-size:34px; height:80px; line-height:80px}

  /* La mochila de rarezas */
  .rarezas{display:flex; flex-direction:column; gap:10px; text-align:left; margin:10px 0}
  .rareza{display:flex; gap:12px; align-items:center; background:#fff; border-radius:16px;
          padding:10px 14px; box-shadow:var(--sombra)}
  .rareza-icono{font-size:32px}
  .rareza small{color:#7A736A}
  .rareza-grande{font-size:70px; line-height:1.1}
  .opcion .tuyo{display:block; color:var(--verde); font-weight:bold; font-size:13px}

  /* El mapa */
  #mapaLienzo{width:100%; max-width:660px; border-radius:18px; box-shadow:var(--sombra)}

  .espejo-fila{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; justify-content:center}
  .espejo-lado{flex:2.2; min-width:300px}
  #espejo{background:#fff; border-radius:20px; box-shadow:var(--sombra)}
  .pestanas{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:8px 0}
  .pestana{font:inherit; color:var(--tinta); font-size:15px; background:#fff; border:2px solid #E3D9C0;
           border-radius:12px; padding:8px 12px; cursor:pointer}
  .pestana.activa{background:var(--turquesa); color:#fff; border-color:var(--turquesa)}
  .opciones{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
            max-height:48vh; overflow-y:auto; padding:4px}
  /* El dibujito de cada prenda: se ve cómo quedaría puesta */
  .opcion .prevista{display:block; margin:0 auto 2px; background:#F7F1E1; border-radius:12px}
  .opcion .prevista.bicho{width:96px; height:96px}
  /* El rótulo de cada estantería: ocupa toda la fila */

<script>
/* === contenido/ajustes.js === */
/* AJUSTES DEL JUEGO
   Este archivo es el cuadro de mandos: todos los números que se pueden querer
   cambiar están aquí. Se puede tocar sin saber programar: cambia el número,
   guarda el archivo y recarga el juego. */

const AJUSTES = {

  /* --- Recompensas -----------------------------------------------------
     Regla: se cobra por lo que cuesta. Un reto largo de los cinco cristales
     paga de verdad; una pregunta suelta del salón o lavarse los dientes es
     simbólico, para que no se pueda vivir de eso. */

  conchasPorRetoNuevo: 14,   // los cinco retos grandes, la primera vez
  conchasPorRepetir: 4,      // y si se repiten
  conchasPorPaseo: 2,        // el reto corto de una atracción
  conchasPorRondaSalon: 1,   // tres preguntas rápidas del salón
  conchasPorProblema: 3,     // un problema de los de leer y pensar
  conchasPorRutina: 1,       // ducharse, peinarse…
  conchasPorRutinasTodas: 3, // propina por hacer las cuatro

  /* Limpiar animales es el trabajo del día: paga bien la primera vez de cada
     día y poco después, para que siga habiendo motivo para volver mañana. */
  conchasPorLimpiar: 7,
  conchasPorLimpiarRepe: 2,

  /* --- TODO ABIERTO, SIEMPRE (12-09-2026) ------------------------------
     Ya no se sortean los sitios: todos tienen reto todos los días, para que
     nunca lleguen a una atracción y esté apagada. Lo que cambia para que no
     se lo aprendan de memoria son los números, la variante y el orden.
     Repetir un reto que ya se ha ganado hoy se puede (para volver a montar),
     pero NO paga nada: así no se vive de repetir lo mismo.
     En la recámara: poner un número en retosPorDia (p. ej. 8) vuelve a
     sortear qué sitios tienen reto cada día. */
  retosPorDia: 0,            // 0 = todos los sitios abiertos siempre
  conchasPorRepetirHoy: 0,   // repetir hoy un reto ya ganado hoy: no paga

  /* TOPE DIARIO DE LO REPETIBLE SIN FIN (12-09-2026)
     El salón de Coco y los problemas sueltos no se acaban nunca: sin tope se
     hacen veinte seguidos y se compra media isla en una tarde. Pasado el tope
     se siguen pudiendo hacer (y siguen dando pegatinas), pero ya no pagan.
     Súbelo o bájalo aquí; 0 quitaría el tope del todo. */
  topeConchasRepetibles: 18,

  /* --- Para que lea antes de elegir ------------------------------------
     Las tarjetas de «¿Qué hay que hacer?» tardan unos segundos en salir, y
     acertar a la primera da una concha de más. */
  segundosAntesDeTarjetas: { mayor: 3, pequena: 2 },
  conchasALaPrimera: 1,

  /* --- El cofre sorpresa (recompensa variable) ------------------------
     Solo puede salir si lo ha leído bien a la primera. Nunca se sabe si
     sale ni qué trae: unas conchas o una prenda barata que aún no tiene. */
  cofre: { probabilidad: 0.3, probPrenda: 0.4, conchas: [3, 6], precioMaxPrenda: 30 },

  /* --- NOVEDADES POR MÓDULOS --------------------------------------------
     Las novedades que cambian la forma de jugar no entran todas de golpe:
     cada una se enciende sola a partir de su fecha (una cada 3-4 días).
       'ya'          → encendida
       'AAAA-MM-DD'  → se enciende sola ese día
       null          → apagada */
  novedades: {
    album:         'ya',          // álbum de pegatinas de problemas, en la mochila
    calentamiento: 'ya',          // mini reto antes de cada rutina del baño
    cofre:         '2026-09-15',  // cofre sorpresa al leer bien a la primera
  },

  // --- Cuándo se cansa un personaje ------------------------------------
  fallosParaDormirse: 3,     // fallos seguidos antes de que se vaya a dormir

  // --- El altavoz (leer el texto en voz alta) ---------------------------
  // Segundos que tarda en aparecer el botón. Si el texto se lee y se pasa
  // adelante antes, ni siquiera se llega a ver.
  segundosAltavoz: { mayor: 15, pequena: 6 },

  vozActivada: true,         // poner en false para quitar la voz del todo

  /* AYUDA AUTOMÁTICA
     En false (como está), el juego NO explica nada por su cuenta: se descubre
     jugando. Las explicaciones siguen estando enteras en el botón ❓, cuando
     ellas quieran. Ponlo en true si ves que se atascan y volverán los globitos
     de Lumi la primera vez que pase cada cosa. */
  pistasAutomaticas: false,

  // --- Mundo ------------------------------------------------------------
  anchoMundo: 2300,
  sueloY: 430,
  velocidad: 3.4,
  fuerzaSalto: 12,
  gravedad: 0.55,
};

/* ¿Está encendida esta novedad hoy? */
function novedad(id) {
  const f = AJUSTES.novedades[id];
  if (f === 'ya') return true;
  if (!f) return false;
  return new Date().toISOString().slice(0, 10) >= f;
}

/* EL REGALO DE BIENVENIDA
   Al crear una jugadora se le regala un complemento al azar de los que se
   compran. Así entra en el juego ya con algo llamativo puesto y entiende de
   una que aquí se consiguen cosas. */
function regaloDeBienvenida() {
  const candidatos = ROPA.complementos.filter(o => typeof o.precio === 'number' && o.precio > 0
                                                && o.precio <= 60);
  return candidatos[Math.floor(Math.random() * candidatos.length)];
}

/* LAS NORMAS DE ORTOGRAFÍA
   Una sola idea vale para tres grupos (g/j, tg/tj, ç): manda la VOCAL que va
   detrás. Por eso las vocales van siempre del mismo color en todo el juego:
     e, i  → azul   → g, tg, c
     a, o, u → naranja → j, tj, ç
   Antes de las palabras se enseña la norma y hay que aplicarla para pasar;
   al final se vuelve a preguntar. */

/* Pinta lo que va entre llaves: {a} {o} {u} {j} {tj} {ç} en naranja,
   {e} {i} {g} {tg} {c} en azul. Así el color siempre dice lo mismo. */
const NARANJA = ['a', 'o', 'u', 'j', 'tj', 'ç', 'a, o, u'];
function colorear(t) {
  return t.replace(/\{([^}]+)\}/g, (_, v) =>
    '<span class="' + (NARANJA.includes(v) ? 'voc-forta' : 'voc-fluixa') + '">' + v + '</span>');
}

/* Qué norma toca hoy: una al azar de las que tienen palabras para su nivel */
function grupoConNorma(nivel) {
  const hay = Object.keys(REGLAS).filter(g =>
    PALABRAS.some(p => p.grupo === g && (nivel === 'mayor' || p.nivel === 'pequena')));
  return hay[Math.floor(Math.random() * hay.length)];
}

/* Saca las palabras que le tocan a esta jugadora, mezclando fáciles y
   difíciles para que no vayan todas seguidas del mismo tipo. */
function palabrasPara(nivel, cuantas, soloFaciles, grupo) {
  const sirven = PALABRAS.filter(p =>
    (nivel === 'mayor' || p.nivel === 'pequena') && !(soloFaciles && p.dificil) &&
    (!grupo || p.grupo === grupo));
  const faciles = sirven.filter(p => !p.dificil);
  const dificiles = sirven.filter(p => p.dificil);
  const mezcla = (a) => a.slice().sort(() => Math.random() - 0.5);
  const f = mezcla(faciles), d = mezcla(dificiles);
  const salida = [];
  for (let i = 0; i < cuantas; i++) {
    // una difícil de cada tres, y siempre empezando por una fácil
    const toca = (i > 0 && i % 3 === 2 && d.length) ? d : f;
    salida.push(toca.pop() || f.pop() || d.pop());
  }
  return salida.filter(Boolean);
}

/* EL BANCO DE PROBLEMAS

   Esto es el corazón pedagógico del juego. Lo demás es decorado.

   Un niño puede saber calcular 12 − 7 y aun así fallar «Nube tenía 7 conchas y
   ahora tiene 12, ¿cuántas ha encontrado?», porque no reconoce que ahí hay una
   resta. Por eso los problemas no están ordenados por operación, sino por
   FORMA DE PRESENTARSE, que es lo que hay que aprender a reconocer.

   LOS NÚMEROS CAMBIAN CADA VEZ. Cada problema trae una función 'vars' que los
   sortea, y el texto lleva marcadores {a}, {b}, {sol}… que se rellenan al
   vuelo. Así el mismo problema nunca sale dos veces igual.

   Para escribir uno nuevo:
     vars: () => { const a = AZ(4, 9); return { a, b: a + 3, sol: 3 }; }
     enunciado: 'Tenía {a} conchas y ahora tiene {b}. ¿Cuántas ha encontrado?'
   AZ(4, 9) da un número al azar entre 4 y 9, los dos incluidos.
   'sol' es siempre la respuesta.

   Las formas (el campo 'tipo'):
     cambio        · tenía, pasa algo, ahora tiene
     cambio-medio  · sé lo de antes y lo de ahora, ¿qué pasó? ← se resta aunque parezca sumar

/* Saca un problema del banco. Evita repetir la misma forma dos veces seguidas,
   para que vea planteamientos distintos y no se acostumbre a uno solo. */
function problemaPara(nivel, ultimoTipo, hechos) {
  const banco = PROBLEMAS[nivel] || PROBLEMAS.pequena;
  let lista = banco.filter(p => p.tipo !== ultimoTipo);
  if (!lista.length) lista = banco;
  /* La mitad de las veces, de las formas que menos ha resuelto: así los
     huecos del álbum son justo lo que más le toca practicar. */
  if (hechos && Math.random() < 0.5) {
    const n = (p) => hechos[p.tipo] || 0;
    const menos = Math.min(...lista.map(n));
    lista = lista.filter(p => n(p) === menos);
  }
  return lista[Math.floor(Math.random() * lista.length)];
}

<script>
/* === motor/sonido.js === */
/* EL SONIDO
   Todos los sonidos se fabrican con el propio navegador (Web Audio): no hay
   ningún archivo de música ni de efectos que descargar, así que el juego sigue
   siendo un único archivo y funciona sin internet.

   Los navegadores no dejan sonar nada hasta que la persona toca algo, así que
   el sonido se enciende solo en el primer clic o la primera tecla. */

const Sonido = {

  ctx: null,
  maestro: null,
  olas: null,
  encendido: true,

  /* ARRANCAR EL SONIDO (revisado el 12-09-2026 por el iPad)
     En el iPad pasaban tres cosas y las tres dejaban el juego mudo:
       1. el contexto nace «suspendido» y hay que despertarlo a mano;
       2. se despertaba una sola vez y, si esa vez fallaba, ya no había otra;
       3. y, sobre todo, el iPad silencia el sonido fabricado por la página
          cuando el aparato está en modo silencio, aunque el volumen esté alto.
     Lo de abajo resuelve las tres: se reintenta en cada toque hasta que suene
     de verdad, y el sonido sale «colgado» de un audio mudo en bucle, que es lo
     que hace que el iPad lo trate como música y no lo calle. */
  arrancar() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      this.ctx = new AC();
      this.maestro = this.ctx.createGain();
      this.maestro.gain.value = this.encendido ? 0.5 : 0;
      this.maestro.connect(this.ctx.destination);
      this.ambiente();
      this.destaparIOS();
    }
    if (this.ctx.state !== 'running' && this.ctx.resume) {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx.state === 'running';
  },

  /* El truco del iPad: un audio mudo en bucle enganchado al mismo contexto.
     Sin esto, con el interruptor lateral en silencio el juego no suena nada,
     por mucho que el volumen esté al máximo. */
  destaparIOS() {
    if (this.mudo) return;
    try {
      const a = document.createElement('audio');
      a.setAttribute('playsinline', '');
      a.loop = true;
      // medio segundo de silencio en WAV, para no depender de ningún archivo
      // un cuarto de segundo de silencio, escrito aquí mismo para no
      // depender de ningún archivo suelto
      a.src = 'data:audio/wav;base64,' +
              'UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAPAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +
              'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
      a.volume = 0.001;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      this.mudo = a;
      if (this.ctx.createMediaElementSource) {
        const fuente = this.ctx.createMediaElementSource(a);
        fuente.connect(this.maestro);
      }
    } catch (e) { /* si el navegador no deja, se sigue oyendo por lo normal */ }
  },

  /* ¿Está sonando de verdad? Lo usa el botón del altavoz para poder avisar */
  estaSonando() { return !!(this.ctx && this.ctx.state === 'running'); },

  /* El mar solo suena mientras se está dentro de la isla */
  ambienteEncendido(si) {
    if (!this.olas) return;
    this.olas.gain.value = si ? 0.16 : 0;
  },

  /* Y calla del todo si se cambia de pestaña o se minimiza la ventana */
  pausar(si) {
    if (!this.ctx) return;
    if (si && this.ctx.state === 'running') this.ctx.suspend();
    if (!si && this.ctx.state === 'suspended') this.ctx.resume();
  },

  silenciar(valor) {
    this.encendido = !valor;
    if (this.maestro) this.maestro.gain.value = this.encendido ? 0.5 : 0;
    if (Estado.actual) { Estado.actual.silencio = !!valor; Estado.guardar(); }
  },

  /* Una nota suelta: frecuencia, duración, forma de onda y volumen */
  nota(f, dur, tipo, vol, retardo) {
    if (!this.ctx || !this.encendido) return;
    const t = this.ctx.currentTime + (retardo || 0);
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = tipo || 'sine';
    osc.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.25, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.maestro);
    osc.start(t); osc.stop(t + dur + 0.02);
  },

  /* Un barrido de una frecuencia a otra: para saltos y plof */
  barrido(f1, f2, dur, tipo, vol) {
    if (!this.ctx || !this.encendido) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = tipo || 'sine';
    osc.frequency.setValueAtTime(f1, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.maestro);
    osc.start(t); osc.stop(t + dur + 0.02);
  },

  ruido(dur, corte, vol) {
    if (!this.ctx || !this.encendido) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const filtro = this.ctx.createBiquadFilter();
    filtro.type = 'lowpass'; filtro.frequency.value = corte || 900;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.2;
    src.connect(filtro); filtro.connect(g); g.connect(this.maestro);
    src.start(t);
  },

  /* El mar de fondo: ruido muy suave que sube y baja como las olas */
  ambiente() {
    if (!this.ctx || this.olas) return;
    const n = this.ctx.sampleRate * 4;
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let ultimo = 0;
    for (let i = 0; i < n; i++) {
      ultimo = (ultimo + (Math.random() * 2 - 1) * 0.12) * 0.96;
      d[i] = ultimo;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filtro = this.ctx.createBiquadFilter();
    filtro.type = 'lowpass'; filtro.frequency.value = 520;
    const g = this.ctx.createGain(); g.gain.value = 0.16;

    const lfo = this.ctx.createOscillator();      // el vaivén de las olas
    const lfoG = this.ctx.createGain();
    lfo.frequency.value = 0.09; lfoG.gain.value = 0.1;
    lfo.connect(lfoG); lfoG.connect(g.gain);

    src.connect(filtro); filtro.connect(g); g.connect(this.maestro);
    src.start(); lfo.start();
    this.olas = g;
  },

  // --- los sonidos del juego -------------------------------------------
  clic()     { this.nota(680, 0.09, 'sine', 0.16); },

  /* Cada suelo suena distinto: hierba, arena, camino de tierra y agua */
  paso(suelo) {
    if (suelo === 'agua')        { this.ruido(0.13, 1500, 0.10); this.barrido(700, 300, 0.12, 'sine', 0.05); }
    else if (suelo === 'arena')  this.ruido(0.09, 450, 0.06);
    else if (suelo === 'camino') this.ruido(0.05, 1100, 0.06);
    else                         this.ruido(0.07, 2600, 0.035);   // hierba
  },

  agua()    { this.ruido(0.7, 2200, 0.10); this.ruido(0.5, 900, 0.06); },
  cepillo() { for (let i = 0; i < 5; i++) setTimeout(() => this.ruido(0.07, 3000, 0.05), i * 110); },
  nam()     { this.nota(320, 0.12, 'triangle', 0.16); this.nota(260, 0.14, 'triangle', 0.14, 0.13); },
  peine()   { for (let i = 0; i < 3; i++) setTimeout(() => this.ruido(0.05, 4000, 0.04), i * 130); },

  /* Encontrar algo raro: cuatro notas que suben y una campanita */
  hallazgo() {
    [659, 784, 988, 1319].forEach((f, i) => this.nota(f, 0.3, 'triangle', 0.22, i * 0.09));
    this.nota(1976, 0.9, 'sine', 0.12, 0.4);
  },
  salto()    { this.barrido(320, 620, 0.16, 'sine', 0.16); },
  aterriza() { this.ruido(0.08, 500, 0.09); },
  plof()     { this.barrido(420, 90, 0.42, 'sine', 0.24); this.ruido(0.3, 400, 0.12); },
  moneda()   { this.nota(988, 0.10, 'triangle', 0.2); this.nota(1319, 0.16, 'triangle', 0.18, 0.07); },
  acierto()  { [523, 659, 784].forEach((f, i) => this.nota(f, 0.22, 'triangle', 0.2, i * 0.085)); },
  fiesta()   { [523, 659, 784, 1046].forEach((f, i) => this.nota(f, 0.35, 'triangle', 0.22, i * 0.1)); },
  cristal()  { this.nota(1046, 0.9, 'sine', 0.22); this.nota(1568, 1.1, 'sine', 0.14, 0.06); },
  fallo()    { this.nota(392, 0.16, 'sine', 0.14); this.nota(311, 0.28, 'sine', 0.14, 0.13); },
  piedraBien(){ this.nota(660, 0.14, 'triangle', 0.18); this.nota(880, 0.18, 'triangle', 0.14, 0.08); },
  suspiro()  { this.barrido(500, 240, 0.7, 'sine', 0.12); },
};

/* EL SONIDO SE ENCIENDE CON EL PRIMER GESTO… y con todos los siguientes
   mientras no haya arrancado de verdad. Antes era `{ once: true }`: si el
   primer toque no valía (pasa en el iPad al volver de otra aplicación), el
   juego se quedaba mudo para siempre y no había manera de recuperarlo. */
['pointerdown', 'pointerup', 'touchend', 'keydown'].forEach(ev =>
  addEventListener(ev, () => {
    if (!Sonido.estaSonando()) Sonido.arrancar();
  }, true));

/* Si se cambia de pestaña o se minimiza, se calla; al volver, se despierta */
addEventListener('visibilitychange', () => Sonido.pausar(document.hidden));
addEventListener('pageshow', () => { if (!document.hidden) Sonido.pausar(false); });

</script>
<script>
/* === motor/estado.js === */
/* EL ESTADO: quién juega y qué lleva conseguido.
   Se guarda en el navegador del propio ordenador (localStorage). No sale
   nada a internet ni hay ningún servidor. */

const Estado = {

  CLAVE: 'islaFarol.v1',
  perfiles: [],
  actual: null,

  cargar() {
    try {
      const crudo = localStorage.getItem(this.CLAVE);
      this.perfiles = crudo ? JSON.parse(crudo) : [];
      this.perfiles.forEach(p => this.alDia(p));
    } catch (e) {
      this.perfiles = [];       // navegador sin permiso de guardado: se juega igual
    }
  },

  guardar() {
    try {
      localStorage.setItem(this.CLAVE, JSON.stringify(this.perfiles));
      localStorage.setItem(this.CLAVE + '.fecha', new Date().toISOString());
    } catch (e) { /* si no se puede guardar, la partida sigue en marcha */ }
  },

  /* ¿ESTE APARATO GUARDA?
     Algunos navegadores (el modo privado, o el iPad cuando la página va dentro
     de otra) dejan escribir pero lo borran todo al cerrar. Aquí solo se
     comprueba lo primero: si ni siquiera deja escribir, se avisa en la pantalla
     de inicio en vez de perderlo todo en silencio. */
  sePuedeGuardar() {
    try {
      localStorage.setItem(this.CLAVE + '.prueba', '1');
      const vale = localStorage.getItem(this.CLAVE + '.prueba') === '1';
      localStorage.removeItem(this.CLAVE + '.prueba');
      return vale;
    } catch (e) { return false; }
  },

  /* Cuándo se guardó por última vez en este aparato (o null si nunca) */
  guardadoEl() {
    try {
      const f = localStorage.getItem(this.CLAVE + '.fecha');
      return f ? new Date(f) : null;
    } catch (e) { return null; }
  },

  /* LA PLANTILLA DE UNA PARTIDA
     Todo lo que guarda una jugadora está aquí. Cuando el juego crezca y haga
     falta guardar algo nuevo, se añade UNA línea aquí y las partidas viejas la
     reciben solas: no hay que empezar de cero. */
  plantilla(nombre, nivel, control) {
    return {
      nombre: nombre,
      nivel: nivel,             // 'mayor' o 'pequena'
      control: control,         // 'flechas' o 'raton'
      look: lookPorDefecto(),
      conchas: 0,
      cristales: [],            // ids de las paradas ya resueltas
      veces: {},                // cuántas veces se ha superado cada reto
      dormidos: {},             // paradas cuyo personaje se ha ido a dormir
      facilitados: {},          // paradas que vuelven con números más fáciles
      comprado: [],             // ids de prendas compradas
      silencio: false,          // si prefiere jugar sin sonido
      descubiertos: {},         // sitios de la isla que ya ha visitado
      secretos: {},             // cosas escondidas que ya ha encontrado
      mascotas: [],             // animales del animalario (se empieza sin ninguno)
      rarezas: [],              // objetos raros de la mochila
      tope: { dia: '', dadas: 0 },        // conchas de hoy por lo repetible sin fin
      entregado: {},            // encargos ya entregados a su dueño
      escondites: null,         // dónde le han tocado las rarezas en esta partida
      historias: {},            // qué historias ya ha leído
      rutinas: { dia: '', hechas: [] },   // ducha, dientes, peinado y desayuno de hoy
      pistas: {},               // qué se le ha explicado ya (se aprende jugando)
      problemas: {},            // qué formas de problema ha resuelto ya, y cuántas veces
      trabajos: { dia: '', hechos: [] },  // animales limpiados hoy
      farolEncendido: false,    // el final del juego
      piezas: [],               // piezas sueltas que lleva encima
      encajado: {},             // lo que ya ha puesto en marcha
      pasos: {},                // caminos que ya ha abierto (montaña, puente)
      visitadas: {},            // por dónde ha pasado: el mapa se destapa ahí
      pedidos: [],              // lo que le han pedido a Teo el repartidor
      hechosHoy: { dia: '', ids: [] },    // retos ya superados hoy: no se repiten
      retosDelDia: { dia: '', ids: [] },  // qué sitios tienen reto hoy
      ultimaVariante: {},       // qué versión salió la última vez en cada reto
    };
  },

  /* PONER AL DÍA UNA PARTIDA VIEJA
     Al actualizar el juego, una partida guardada hace meses no tiene los
     campos nuevos. En vez de perderla, se le añaden con su valor de salida y
     se conserva TODO lo que ya tenía conseguido. */
  alDia(p) {
    const base = this.plantilla(p.nombre, p.nivel, p.control);
    Object.keys(base).forEach(k => { if (p[k] === undefined) p[k] = base[k]; });
    const look = lookPorDefecto();
    if (!p.look) p.look = look;
    else Object.keys(look).forEach(k => { if (p.look[k] === undefined) p.look[k] = look[k]; });
    return p;
  },

  crearPerfil(nombre, nivel, control) {
    const perfil = this.plantilla(nombre, nivel, control);
    // Un complemento de regalo, para empezar con algo chulo puesto
    const regalo = regaloDeBienvenida();
    if (regalo) { perfil.comprado.push(regalo.id); perfil.look.complemento = regalo.id; }
    perfil.regalo = regalo ? regalo.nombre : null;
    this.perfiles.push(perfil);
    this.actual = perfil;
    this.guardar();
    return perfil;
  },

  usar(indice) { this.actual = this.perfiles[indice]; },

  borrarPerfil(indice) {
    this.perfiles.splice(indice, 1);
    this.guardar();
  },

  /* Empezar de cero conservando el nombre y el personaje: sirve para dejar
     limpia una partida de prueba sin tener que crearla otra vez. */
  reiniciarPerfil(indice) {
    const p = this.perfiles[indice];
    p.conchas = 0;
    p.cristales = [];
    p.veces = {};
    p.dormidos = {};
    p.facilitados = {};
    p.comprado = [];
    p.descubiertos = {};
    p.secretos = {};
    p.mascotas = [];
    p.rarezas = [];
    p.tope = { dia: '', dadas: 0 };
    p.entregado = {};
    p.escondites = null;
    p.historias = {};
    p.rutinas = { dia: '', hechas: [] };
    p.pistas = {};
    p.problemas = {};
    p.trabajos = { dia: '', hechos: [] };
    p.farolEncendido = false;
    p.piezas = [];
    p.encajado = {};
    p.pasos = {};
    p.visitadas = {};
    p.hechosHoy = { dia: '', ids: [] };
    p.retosDelDia = { dia: '', ids: [] };
    p.ultimaVariante = {};
    // si llevaba puesto algo que ya no es suyo, se vuelve a lo de serie
    const base = lookPorDefecto();
    [['peinados', 'peinado'], ['coloresPelo', 'colorPelo'], ['conjuntos', 'conjunto'],
     ['zapatos', 'zapatos'], ['complementos', 'complemento'], ['manos', 'manos'],
     ['joyas', 'joyas']].forEach(par => {
      const item = ROPA[par[0]].find(o => o.id === p.look[par[1]]);
      if (!item || item.precio !== 0) p.look[par[1]] = base[par[1]];
    });
    p.look.mascota = null;
    // y otra vez un complemento de regalo, para no empezar de vacío
    const regalo = regaloDeBienvenida();
    if (regalo) { p.comprado.push(regalo.id); p.look.complemento = regalo.id; p.regalo = regalo.nombre; }
    this.guardar();
  },

  // --- Atajos sobre el perfil que está jugando ---------------------------
  p() { return this.actual; },

  tieneCristal(id) { return this.actual.cristales.includes(id); },

  estaDormido(id) { return !!this.actual.dormidos[id]; },

  dormir(id) { this.actual.dormidos[id] = true; this.guardar(); },

  despertarTodos() {
    this.actual.dormidos = {};
    this.guardar();
  },

  vecesHecho(id) { return this.actual.veces[id] || 0; },

  darConchas(n) { this.actual.conchas += n; this.guardar(); },

  /* CONCHAS CON TOPE DIARIO
     El salón de Coco y los problemas sueltos se pueden repetir todas las veces
     que se quiera: sin tope, se hacen cien seguidos, se compra la tienda entera
     en dos tardes y se acaba la gracia. A partir del tope siguen funcionando
     (y siguen dando pegatinas), pero ya no pagan. (12-09-2026) */
  darConchasConTope(n) {
    const t = this.actual.tope || { dia: '', dadas: 0 };
    if (t.dia !== this.hoy()) { t.dia = this.hoy(); t.dadas = 0; }
    const sitio = Math.max(0, AJUSTES.topeConchasRepetibles - t.dadas);
    const paga = Math.min(n, sitio);
    t.dadas += paga;
    this.actual.tope = t;
    this.actual.conchas += paga;
    this.guardar();
    return paga;                          // lo que de verdad se ha cobrado
  },

  puedePagar(precio) { return this.actual.conchas >= precio; },

  comprar(id, precio) {
    if (!this.puedePagar(precio)) return false;
    this.actual.conchas -= precio;
    this.actual.comprado.push(id);
    this.guardar();
    return true;
  },

  tiene(prenda) {
    return prenda.precio === 0 || this.actual.comprado.includes(prenda.id);
  },

  dar(id) {                                   // regalar una prenda o una mascota
    if (!this.actual.comprado.includes(id)) this.actual.comprado.push(id);
    this.guardar();
  },

  // --- Mascotas -----------------------------------------------------------
  tieneMascota(id) { return (this.actual.mascotas || []).includes(id); },

  darMascota(id) {
    if (!this.actual.mascotas) this.actual.mascotas = [];
    if (!this.actual.mascotas.includes(id)) this.actual.mascotas.push(id);
    setTimeout(() => Pistas.dar('mascota'), 1500);
    if (!this.actual.look.mascota) this.actual.look.mascota = id;   // la primera se pone sola
    this.guardar();
  },

  // --- La mochila de rarezas ---------------------------------------------
  /* Los encargos: un objeto de la mochila entregado a su dueño */
  yaEntregado(id) { return !!(this.actual.entregado || {})[id]; },

  entregar(id) {
    if (!this.actual.entregado) this.actual.entregado = {};
    this.actual.entregado[id] = true;
    this.guardar();
  },

  tieneRareza(id) { return (this.actual.rarezas || []).includes(id); },

  guardarRareza(id) {
    if (!this.actual.rarezas) this.actual.rarezas = [];
    if (!this.actual.rarezas.includes(id)) this.actual.rarezas.push(id);
    this.guardar();
  },

  // --- Las rutinas de casa: se reinician cada día ------------------------
  hoy() { return new Date().toISOString().slice(0, 10); },

  rutinasDeHoy() {
    const p = this.actual;
    if (!p.rutinas || p.rutinas.dia !== this.hoy()) p.rutinas = { dia: this.hoy(), hechas: [] };
    return p.rutinas.hechas;
  },

  hizoRutina(id) { return this.rutinasDeHoy().includes(id); },

  /* El trabajo de la granja: la primera vez del día paga mejor */
  trabajoDeHoy(id) {
    const p = this.actual;
    if (!p.trabajos || p.trabajos.dia !== this.hoy()) p.trabajos = { dia: this.hoy(), hechos: [] };
    if (p.trabajos.hechos.includes(id)) return false;
    p.trabajos.hechos.push(id);
    this.guardar();
    return true;
  },

  /* UN RETO AL DÍA: superado hoy, ya no se repite hasta mañana */
  hechoHoy(id) {
    const p = this.actual;
    return !!p.hechosHoy && p.hechosHoy.dia === this.hoy() && p.hechosHoy.ids.includes(id);
  },

  marcarHechoHoy(id) {
    const p = this.actual;
    if (!p.hechosHoy || p.hechosHoy.dia !== this.hoy()) p.hechosHoy = { dia: this.hoy(), ids: [] };
    if (!p.hechosHoy.ids.includes(id)) p.hechosHoy.ids.push(id);
    this.guardar();
  },

  /* Qué reto hay en un sitio de la isla (o null si allí no hay reto) */
  retoDeLugar(l) {
    if (l.accion === 'reto' || l.accion === 'letras') return l.id;
    if (l.accion === 'cuidar') return l.id + 'Reto';
    if (l.accion === 'montar') return (MUNDO.paseos[l.id] || {}).reto || null;
    return null;
  },

  /* LOS SITIOS DE HOY: cada mañana se sortean unos cuantos. Así no puede ir
     siempre al que le resulta fácil. Los de cristal sin ganar, siempre. */
  retosDeHoy() {
    const p = this.actual;
    if (!AJUSTES.retosPorDia) return this.todosLosRetos();   // todo abierto
    if (p.retosDelDia && p.retosDelDia.dia === this.hoy()) return p.retosDelDia.ids;
    const todos = MUNDO.lugares.map(l => this.retoDeLugar(l)).filter(id => id && RETOS[id]);
    const pendientes = todos.filter(id => !RETOS[id].trabajo && !RETOS[id].paseo && !this.tieneCristal(id));
    const resto = todos.filter(id => !pendientes.includes(id)).sort(() => Math.random() - 0.5);
    p.retosDelDia = { dia: this.hoy(), ids: pendientes.concat(resto.slice(0, AJUSTES.retosPorDia)) };
    this.guardar();
    return p.retosDelDia.ids;
  },

  todosLosRetos() {
    return MUNDO.lugares.map(l => this.retoDeLugar(l)).filter(id => id && RETOS[id]);
  },

  abiertoHoy(id) { return !AJUSTES.retosPorDia || this.retosDeHoy().includes(id); },

  apuntarRutina(id) {
    if (this.hizoRutina(id)) return false;
    this.actual.rutinas.hechas.push(id);
    this.guardar();
    return true;                       // true = es la primera vez hoy
  },

  // --- Piezas sueltas y lo que ponen en marcha ---------------------------
  llevaPieza(id) { return (this.actual.piezas || []).includes(id); },

  cogerPieza(id) {
    if (!this.actual.piezas) this.actual.piezas = [];
    if (!this.actual.piezas.includes(id)) this.actual.piezas.push(id);
    this.guardar();
  },

  pasoAbierto(id) { return !!(this.actual.pasos || {})[id]; },

  abrirPaso(id) {
    if (!this.actual.pasos) this.actual.pasos = {};
    this.actual.pasos[id] = true;
    this.guardar();
  },

  estaEncajado(id) { return !!(this.actual.encajado || {})[id]; },

  encajar(pieza, lugar) {
    if (!this.actual.encajado) this.actual.encajado = {};
    this.actual.encajado[lugar] = true;
    this.actual.piezas = (this.actual.piezas || []).filter(p => p !== pieza);
    this.guardar();
  },

  /* Cuántos problemas ha resuelto de cada forma: sirve para saber en qué
     flojea (se puede mirar en la consola con Estado.actual.problemas) */
  apuntarProblema(tipo) {
    if (!this.actual.problemas) this.actual.problemas = {};
    this.actual.problemas[tipo] = (this.actual.problemas[tipo] || 0) + 1;
    this.guardar();
    return this.actual.problemas[tipo];      // 1 = pegatina nueva en el álbum
  },

  leerHistoria(id) {
    if (!this.actual.historias) this.actual.historias = {};
    const nueva = !this.actual.historias[id];
    this.actual.historias[id] = true;
    this.guardar();
    return nueva;
  },

  /* El mapa se destapa por donde se ha caminado. La isla se parte en casillas
     y se apunta cada una que se pisa. */
  CASILLA: 150,

  marcarVisitada(x, y) {
    const p = this.actual;
    if (!p.visitadas) p.visitadas = {};
    const clave = Math.floor(x / this.CASILLA) + ',' + Math.floor(y / this.CASILLA);
    if (p.visitadas[clave]) return false;
    p.visitadas[clave] = 1;
    this.guardar();
    return true;
  },

  // --- Explorar la isla ---------------------------------------------------
  estaDescubierto(id) { return !!(this.actual.descubiertos || {})[id]; },

  descubrir(id) {
    if (!this.actual.descubiertos) this.actual.descubiertos = {};
    if (this.actual.descubiertos[id]) return false;
    this.actual.descubiertos[id] = true;
    this.guardar();
    return true;                          // true = es la primera vez
  },

  // --- Secretos escondidos ------------------------------------------------
  tieneSecreto(id) { return !!(this.actual.secretos || {})[id]; },

  guardarSecreto(id, premio) {
    if (!this.actual.secretos) this.actual.secretos = {};
    this.actual.secretos[id] = true;
    if (premio) this.actual.comprado.push(premio.id);   // ya es suyo
    this.guardar();
  },

  /* Se ha superado un reto: cristal la primera vez, y conchas siempre.
     yaHoy = hoy ya lo había ganado: se puede repetir, pero paga poco. */
  superarReto(id, yaHoy) {
    const primeraVez = !this.tieneCristal(id);
    if (primeraVez) this.actual.cristales.push(id);
    this.actual.veces[id] = this.vecesHecho(id) + 1;
    delete this.actual.dormidos[id];
    const conchas = primeraVez ? AJUSTES.conchasPorRetoNuevo
                  : yaHoy      ? AJUSTES.conchasPorRepetirHoy
                               : AJUSTES.conchasPorRepetir;
    this.actual.conchas += conchas;
    this.guardar();
    return { primeraVez, conchas };
  },
};

</script>
<script>
/* === motor/personaje.js === */
/* DIBUJO DEL PERSONAJE Y DE LA MASCOTA
   Todo se dibuja con código, por capas: pelo de atrás, piernas, ropa, brazos,
   cabeza, cara, peinado y complemento. Añadir un peinado nuevo es añadir un
   caso más en dibujarPeinado(). */

const Avatar = {

  color(lista, id, campo) {
    const x = lista.find(e => e.id === id);
    return x ? x[campo] : '#888';
  },

  /* x, yPies = dónde apoya los pies. paso = animación de andar (0 si quieto) */
  dibujar(ctx, x, yPies, esc, look, mirando, paso) {
    const pelo = this.color(ROPA.coloresPelo, look.colorPelo, 'color');
    const conj = ROPA.conjuntos.find(c => c.id === look.conjunto) || ROPA.conjuntos[0];
    const bal = Math.sin(paso) * 3;        // balanceo de piernas al andar

    ctx.save();
    ctx.translate(x, yPies);
    ctx.scale(esc * (mirando < 0 ? -1 : 1), esc);

    // --- pelo de atrás
    ctx.fillStyle = pelo;
    const pein = look.peinado;
    if (pein === 'melena') {
      ctx.beginPath(); ctx.ellipse(0, -44, 18, 22, 0, 0, 7); ctx.fill();
    } else if (pein === 'coleta') {
      ctx.beginPath(); ctx.ellipse(-2, -58, 8, 12, 0.4, 0, 7); ctx.fill();
    } else if (pein === 'media') {
      ctx.beginPath(); ctx.ellipse(0, -42, 17, 20, 0, 0, 7); ctx.fill();
    } else if (pein === 'monyo' || pein === 'cresta') {
      ctx.beginPath(); ctx.ellipse(0, -46, 13, 14, 0, 0, 7); ctx.fill();
    } else if (pein === 'monyos') {
      ctx.beginPath(); ctx.ellipse(0, -46, 15, 16, 0, 0, 7); ctx.fill();
    } else if (pein === 'bob') {
      ctx.beginPath(); ctx.ellipse(0, -46, 17, 17, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-17, -46); ctx.lineTo(-15, -32); ctx.lineTo(-9, -34);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(17, -46); ctx.lineTo(15, -32); ctx.lineTo(9, -34);
      ctx.closePath(); ctx.fill();
    } else if (pein === 'rizos') {
      [[0, -50, 17], [-15, -44, 10], [15, -44, 10], [-11, -32, 8], [11, -32, 8],
       [0, -30, 9], [-17, -52, 8], [17, -52, 8]].forEach(r => {
        ctx.beginPath(); ctx.arc(r[0], r[1], r[2], 0, 7); ctx.fill();
      });
    } else if (pein === 'coletas') {
      [[-1, -16], [1, 16]].forEach(c => {
        ctx.beginPath(); ctx.ellipse(c[1], -54, 7, 13, c[0] * 0.35, 0, 7); ctx.fill();
      });
      ctx.beginPath(); ctx.ellipse(0, -46, 14, 15, 0, 0, 7); ctx.fill();
    } else if (pein === 'ondas') {
      ctx.beginPath(); ctx.ellipse(0, -40, 19, 26, 0, 0, 7); ctx.fill();
      [-14, -5, 5, 14].forEach((ox, i) => {              // las ondas del bajo
        ctx.beginPath(); ctx.arc(ox, -16 + (i % 2) * 3, 6, 0, 7); ctx.fill();
      });
    } else if (pein === 'trenzaslargas') {
      [-1, 1].forEach(d => {
        for (let k = 0; k < 7; k++) {                    // trenza de bolitas
          ctx.beginPath();
          ctx.ellipse(d * (15 + Math.sin(k) * 1.5), -50 + k * 6, 5 - k * 0.25, 4, 0, 0, 7);
          ctx.fill();
        }
      });
      ctx.beginPath(); ctx.ellipse(0, -46, 15, 16, 0, 0, 7); ctx.fill();
    } else if (pein === 'melenasirena') {
      ctx.beginPath(); ctx.ellipse(0, -38, 16, 30, 0, 0, 7); ctx.fill();
      [[-15, -14], [15, -14], [-16, -6], [16, -6]].forEach(o => {   // las puntas onduladas
        ctx.beginPath(); ctx.arc(o[0], o[1], 6, 0, 7); ctx.fill();
      });
      ctx.fillStyle = 'rgba(255,255,255,0.22)';          // los brillos del pelo
      [[-12, -42], [12, -34], [-13, -22]].forEach(b => {
        ctx.beginPath(); ctx.ellipse(b[0], b[1], 2.4, 8, 0.2, 0, 7); ctx.fill();
      });
      ctx.fillStyle = pelo;
    } else {
      ctx.beginPath(); ctx.ellipse(-15, -40, 5, 14, 0.2, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(15, -40, 5, 14, -0.2, 0, 7); ctx.fill();
    }

    // --- lo que va detrás del todo: se dibuja antes que el cuerpo
    if (look.complemento === 'capa') {
      ctx.fillStyle = '#D93B4A';
      ctx.beginPath();
      ctx.moveTo(-10, -38); ctx.lineTo(10, -38);
      ctx.quadraticCurveTo(30, -22, 27, -2);
      ctx.quadraticCurveTo(14, -6, 0, -4);
      ctx.quadraticCurveTo(-14, -6, -27, -2);
      ctx.quadraticCurveTo(-30, -22, -10, -38);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.12)';              // el pliegue de un lado
      ctx.beginPath(); ctx.moveTo(0, -38); ctx.lineTo(10, -38);
      ctx.quadraticCurveTo(30, -22, 27, -2); ctx.quadraticCurveTo(14, -6, 0, -4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFE066';                       // dos estrellas, a la vista
      this.estrella(ctx, -20, -20, 5, 2.2, 5);
      this.estrella(ctx, 20, -20, 5, 2.2, 5);
      ctx.fillStyle = '#FFE066';                       // el cuello de la capa
      ctx.fillRect(-11, -38, 22, 3.5);
    }
    if (look.complemento === 'caparazon') {
      ctx.fillStyle = '#6E8F3E';
      ctx.beginPath(); ctx.ellipse(0, -22, 24, 20, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#8FA85A';
      ctx.beginPath(); ctx.ellipse(0, -23, 19, 15, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#5A7530'; ctx.lineWidth = 1.4;  // los gajos del caparazón
      [[0, -34], [-13, -26], [13, -26], [-11, -12], [11, -12]].forEach(g => {
        ctx.beginPath(); ctx.arc(g[0], g[1], 5.5, 0, 7); ctx.stroke();
      });
      ctx.strokeStyle = '#4A6326'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, -22, 24, 20, 0, 0, 7); ctx.stroke();
    }
    if (look.complemento === 'alasdragon') {
      [[-1, -1], [1, 1]].forEach(w => {
        const d = w[0];
        ctx.fillStyle = 'rgba(120, 90, 160, 0.9)';
        ctx.beginPath();
        ctx.moveTo(d * 6, -36);
        ctx.quadraticCurveTo(d * 34, -46, d * 32, -22);
        ctx.quadraticCurveTo(d * 24, -26, d * 20, -14);
        ctx.quadraticCurveTo(d * 16, -22, d * 10, -18);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#5B4B7A'; ctx.lineWidth = 1.6;  // los deditos del ala
        [[d * 32, -22], [d * 20, -14]].forEach(punta => {
          ctx.beginPath(); ctx.moveTo(d * 6, -36); ctx.lineTo(punta[0], punta[1]); ctx.stroke();
        });
        ctx.beginPath(); ctx.moveTo(d * 6, -36);
        ctx.quadraticCurveTo(d * 34, -46, d * 32, -22); ctx.stroke();
      });
    }
    if (look.complemento === 'cohete') {
      ctx.fillStyle = '#C9C4BC';
      ctx.beginPath(); ctx.roundRect(-24, -38, 10, 24, 5); ctx.fill();
      ctx.beginPath(); ctx.roundRect(14, -38, 10, 24, 5); ctx.fill();
      ctx.fillStyle = '#E8506B';
      ctx.fillRect(-24, -35, 10, 3.5); ctx.fillRect(14, -35, 10, 3.5);
      ctx.fillStyle = '#8A837A';                       // la correa de la espalda
      ctx.fillRect(-24, -30, 48, 3);
      [-19, 19].forEach(px => {                        // las llamas
        ctx.fillStyle = '#FFB03B';
        ctx.beginPath(); ctx.moveTo(px - 5, -14); ctx.lineTo(px, 2); ctx.lineTo(px + 5, -14); ctx.fill();
        ctx.fillStyle = '#FFE066';
        ctx.beginPath(); ctx.moveTo(px - 2.5, -14); ctx.lineTo(px, -4); ctx.lineTo(px + 2.5, -14); ctx.fill();
      });
    }

    // --- piernas
    ctx.fillStyle = look.piel;
    this.capsula(ctx, -5 + bal, -14, 5, 14);
    this.capsula(ctx, 5 - bal, -14, 5, 14);
    const zap = ROPA.zapatos.find(z => z.id === look.zapatos);
    const pies = [-5 + bal, 5 - bal];
    if (zap && zap.forma === 'esquis') {
      ctx.fillStyle = zap.color;                       // dos tablas larguísimas
      pies.forEach(px => { ctx.beginPath(); ctx.roundRect(px - 21, -4, 42, 4.5, 2.2); ctx.fill(); });
      ctx.fillStyle = '#FFF';                          // las rayas de las tablas
      pies.forEach(px => { ctx.fillRect(px - 16, -3.2, 7, 1.3); ctx.fillRect(px + 9, -3.2, 7, 1.3); });
      ctx.fillStyle = '#3A3A3A';                       // la bota, encima
      pies.forEach(px => this.capsula(ctx, px, -7.5, 7.5, 7));
    } else if (zap && zap.forma === 'patines') {
      ctx.fillStyle = zap.color;
      pies.forEach(px => this.capsula(ctx, px, -7, 7.5, 8));
      ctx.fillStyle = '#F4F4F4';
      pies.forEach(px => ctx.fillRect(px - 4, -3.6, 8, 1.8));
      ctx.fillStyle = '#3A3A3A';                       // las ruedas
      pies.forEach(px => [-3, 0, 3].forEach(d => {
        ctx.beginPath(); ctx.arc(px + d, -1.4, 1.7, 0, 7); ctx.fill();
      }));
    } else if (zap && zap.forma === 'calcetines') {
      const raya = '#FFF';
      pies.forEach(px => {                             // el calcetín, hasta la rodilla
        ctx.fillStyle = zap.color;
        this.capsula(ctx, px, -12, 6, 18);
        ctx.fillStyle = raya;
        [-18, -14, -10, -6].forEach(y => ctx.fillRect(px - 3, y, 6, 1.8));
      });
      ctx.fillStyle = '#3A3A3A';                       // el zapatito
      pies.forEach(px => this.capsula(ctx, px, -2.5, 7, 4.5));
    } else if (zap && zap.forma === 'aletas') {
      ctx.fillStyle = zap.color;                       // aletas enormes de rana
      pies.forEach((px, i) => {
        const fuera = i ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(px - 4, -6); ctx.lineTo(px + 4, -6);
        ctx.quadraticCurveTo(px + fuera * 20, -4, px + fuera * 17, 1);
        ctx.quadraticCurveTo(px + fuera * 6, 2, px - 4, -1);
        ctx.closePath(); ctx.fill();
      });
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      pies.forEach((px, i) => {
        const fuera = i ? 1 : -1;
        [4, 8, 12].forEach(d => ctx.fillRect(px + fuera * d, -4, 1.4, 4));
      });
      ctx.fillStyle = '#2F6F73';
      pies.forEach(px => this.capsula(ctx, px, -7, 7, 6));
    } else if (zap && zap.forma === 'peludas') {
      ctx.fillStyle = zap.color;
      pies.forEach(px => this.capsula(ctx, px, -7, 10, 13));
      ctx.fillStyle = '#FFF6E8';                       // el borde de pelo
      pies.forEach(px => [-4, 0, 4].forEach(d => {
        ctx.beginPath(); ctx.arc(px + d, -13, 3.6, 0, 7); ctx.fill();
      }));
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      pies.forEach(px => this.capsula(ctx, px, -2.5, 10, 4));
    } else if (zap && zap.forma === 'arcoiris') {
      const franjas = ['#E8506B', '#F2A65A', '#FFE066', '#7ED6A5', '#5AA9DC', '#B58BE0'];

        ctx.fillRect(px - 4, -3 - i * 2.2, 8, 2.2);

    } else if (zap && zap.color) {

      this.capsula(ctx, -5 + bal, -3, 6.5, 5);
      this.capsula(ctx, 5 - bal, -3, 6.5, 5);
    } else {
      // Descalza: los pies son del color de la piel, no un hueco
      ctx.fillStyle = look.piel;
      this.capsula(ctx, -5 + bal, -2.5, 6, 4.5);
      this.capsula(ctx, 5 - bal, -2.5, 6, 4.5);

    // --- ropa
    ctx.fillStyle = conj.color;

      ctx.fillStyle = conj.detalle;                  // cenefa del bajo
      ctx.beginPath();
      ctx.moveTo(-bajo, -12); ctx.lineTo(bajo, -12);
      ctx.lineTo(bajo - 1.5, -15); ctx.lineTo(-bajo + 1.5, -15);
      ctx.closePath(); ctx.fill();
      if (conj.id === 'estrellas') {                 // estrellitas
        ctx.fillStyle = conj.detalle;
        [[-4, -28], [3, -22], [-6, -18], [6, -30]].forEach(p => {

    // --- el dibujo de la ropa (los conjuntos llamativos llevan uno)
    if (conj.dibujo === 'gato') {
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(0, -27, 5.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-5, -30); ctx.lineTo(-3.5, -35); ctx.lineTo(-1, -30.5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(5, -30); ctx.lineTo(3.5, -35); ctx.lineTo(1, -30.5); ctx.fill();
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(-2, -28, 0.9, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(2, -28, 0.9, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3A3A3A'; ctx.lineWidth = 0.6;
      [-1, 1].forEach(d => [0, 1.6].forEach(k => {
        ctx.beginPath(); ctx.moveTo(d * 1.5, -25.5 + k * 0.6);

    if (conj.dibujo === 'arcoiris') {
      const franjas = ['#E8506B', '#F2A65A', '#FFE066', '#7ED6A5', '#5AA9DC', '#B58BE0'];

    if (conj.dibujo === 'sirena') {
      ctx.save();                                       // escamas en la falda

      ctx.moveTo(-9, -34); ctx.lineTo(9, -34); ctx.lineTo(15, -12); ctx.lineTo(-15, -12);
      ctx.closePath(); ctx.clip();
      ctx.strokeStyle = conj.detalle; ctx.lineWidth = 1;
      for (let f = 0; f < 6; f++) for (let k = -4; k <= 4; k++) {
        ctx.beginPath();
        ctx.arc(k * 4 + (f % 2 ? 2 : 0), -32 + f * 4, 2.2, Math.PI, 0);
        ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = conj.color;                       // la cola, tapando las piernas
      ctx.beginPath();
      ctx.moveTo(-15, -12); ctx.lineTo(15, -12);
      ctx.quadraticCurveTo(8, -6, 5, -2); ctx.lineTo(-5, -2);
      ctx.quadraticCurveTo(-8, -6, -15, -12);

      ctx.fillStyle = conj.detalle;                     // la aleta de la punta
      ctx.beginPath();
      ctx.moveTo(0, -6);

    if (conj.dibujo === 'rana') {
      ctx.fillStyle = '#EAF7D9';                        // la barriga
      ctx.beginPath(); ctx.ellipse(0, -22, 8, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#5E9E3E';                        // manchitas
      [[-7, -17], [7, -16], [0, -13]].forEach(m => {
        ctx.beginPath(); ctx.arc(m[0], m[1], 2, 0, 7); ctx.fill();
      });
      [[-5, -32], [5, -32]].forEach(o => {              // los ojos de rana
        ctx.fillStyle = '#8FD86B';
        ctx.beginPath(); ctx.arc(o[0], o[1], 4.4, 0, 7); ctx.fill();
        ctx.fillStyle = '#FFF';

    ctx.fillStyle = look.piel;
    this.capsula(ctx, -11 - bal * 0.5, -26, 4.5, 13);
    this.capsula(ctx, 11 + bal * 0.5, -26, 4.5, 13);

    // --- lo que lleva en las manos (las manos caen sobre y = -20)
    const man = ROPA.manos.find(m => m.id === look.manos);
    const mx = 11 + bal * 0.5, my = -20;
    if (man && man.id === 'mitones') {
      ctx.fillStyle = man.color;
      [[-mx, my], [mx, my]].forEach(h => {
        this.capsula(ctx, h[0], h[1], 7, 8);
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(h[0], h[1] - 4.5, 2.4, 0, 7); ctx.fill();
        ctx.fillStyle = man.color;
      });
    }
    if (man && man.id === 'garras') {
      [[-mx, my], [mx, my]].forEach(h => {
        ctx.fillStyle = man.color;
        this.capsula(ctx, h[0], h[1], 10, 10);
        ctx.fillStyle = '#F26FA8';
        ctx.beginPath(); ctx.arc(h[0], h[1] + 1.4, 2.8, 0, 7); ctx.fill();
        [-3, 0, 3].forEach(d => {
          ctx.beginPath(); ctx.arc(h[0] + d, h[1] - 3, 1.7, 0, 7); ctx.fill();
        });
      });
    }
    if (man && man.id === 'guantesarco') {
      const franjas = ['#E8506B', '#F2A65A', '#FFE066', '#7ED6A5', '#5AA9DC'];
      [[-mx, my], [mx, my]].forEach(h => franjas.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.fillRect(h[0] - 3, h[1] - 4 + i * 2, 6, 2);
      }));
      ctx.fillStyle = '#FFF';
      [[-mx, my], [mx, my]].forEach(h => { ctx.beginPath(); ctx.arc(h[0], h[1] + 6, 3, 0, 7); ctx.fill(); });
    }
    if (man && man.id === 'helado') {
      const hx = mx + 9;
      ctx.fillStyle = '#D9A15B';                        // el cucurucho
      ctx.beginPath(); ctx.moveTo(hx - 7, my - 13); ctx.lineTo(hx + 7, my - 13);
      ctx.lineTo(hx, my + 3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 0.8;
      [-4, 0, 4].forEach(d => {
        ctx.beginPath(); ctx.moveTo(hx + d - 3, my - 11); ctx.lineTo(hx + d + 3, my - 4); ctx.stroke();
      });
      [['#FFF1F4', -18], ['#8FD86B', -26], ['#F26FA8', -34]].forEach(b => {
        ctx.fillStyle = b[0];
        ctx.beginPath(); ctx.arc(hx, my + b[1], 8.5, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(hx - 3, my + b[1] - 3, 2.6, 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#E8506B';                        // la guinda
      ctx.beginPath(); ctx.arc(hx, my - 44, 3.4, 0, 7); ctx.fill();
      ctx.strokeStyle = '#5E9E3E'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(hx, my - 47); ctx.lineTo(hx + 4, my - 51); ctx.stroke();
    }
    if (man && man.id === 'pompones') {
      [[-mx, my], [mx, my]].forEach(h => {

        for (let k = 0; k < 9; k++) {

          ctx.fillStyle = c[k % 3];
          ctx.beginPath();
          ctx.arc(h[0] + Math.cos(a) * 4.5, h[1] + Math.sin(a) * 4.5, 3.4, 0, 7); ctx.fill();
        }
        ctx.fillStyle = '#FFF';
        ctx.beginPath(); ctx.arc(h[0], h[1], 3, 0, 7); ctx.fill();
      });
    }
    if (man && man.id === 'farolillo') {
      const fx = mx + 11;
      ctx.strokeStyle = '#6B4226'; ctx.lineWidth = 2.2;   // el palo
      ctx.beginPath(); ctx.moveTo(mx, my + 2); ctx.lineTo(fx, my - 28); ctx.stroke();
      ctx.lineWidth = 1.4;                                // el ganchito
      ctx.beginPath(); ctx.moveTo(fx, my - 28); ctx.lineTo(fx, my - 22); ctx.stroke();
      ctx.fillStyle = 'rgba(255,214,110,0.40)';           // el halo de la luz
      ctx.beginPath(); ctx.arc(fx, my - 13, 17, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,230,150,0.55)';
      ctx.beginPath(); ctx.arc(fx, my - 13, 10, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFD98A';                          // los cristales
      ctx.beginPath(); ctx.roundRect(fx - 7, my - 21, 14, 17, 3); ctx.fill();
      ctx.fillStyle = '#FFF9E0';
      ctx.beginPath(); ctx.arc(fx, my - 13, 4.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#6B4226';                          // la montura
      ctx.fillRect(fx - 9, my - 23.5, 18, 3.5);
      ctx.fillRect(fx - 9, my - 6, 18, 3.5);
      ctx.fillRect(fx - 1, my - 21, 2, 17);
      ctx.fillStyle = '#E8C33D';
      ctx.beginPath(); ctx.arc(fx, my - 25, 2, 0, 7); ctx.fill();
    }
    if (man && man.id === 'varita') {
      ctx.strokeStyle = '#E8DCC0'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';

      ctx.fillStyle = 'rgba(255,240,170,0.5)';          // el resplandor

      this.estrella(ctx, mx + 11, my - 32, 11, 4.6, 5);
      ctx.fillStyle = '#FFF';
      this.estrella(ctx, mx + 11, my - 32, 4.5, 1.8, 5);
    }

    // --- complemento por detrás
    if (look.complemento === 'alas') {
      ctx.fillStyle = 'rgba(180, 235, 255, 0.75)';

    if (look.complemento === 'mariposa') {

        ctx.beginPath(); ctx.arc(lado * 15, -21, 3, 0, 7); ctx.fill();
        ctx.fillStyle = '#FFE066';
        ctx.beginPath(); ctx.arc(lado * 12, -30, 2, 0, 7); ctx.fill();
      });

    if (look.complemento === 'bufanda') {
      const franjas = ['#E8506B', '#F2A65A', '#FFE066', '#7ED6A5', '#5AA9DC', '#C3A6FF'];
      franjas.forEach((c, i) => {
        ctx.fillStyle = c;

      });
      franjas.forEach((c, i) => {                          // el cabo que cuelga

    if (look.complemento === 'mochila') {
      ctx.fillStyle = '#F6C9A8';
