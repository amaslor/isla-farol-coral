    if (hecho) { ctx.font = '14px system-ui'; ctx.fillText('✉️', x + 44, y - 12); ctx.fillText('✉️', x + 52, y - 30); }
  },

  pintar_cartel(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 20, 0);
    ctx.fillStyle = '#8D5A3B'; ctx.fillRect(x - 3, y - 44, 6, 44);
    ctx.fillStyle = '#FFF3C4'; ctx.fillRect(x - 36, y - 76, 72, 34);
    ctx.strokeStyle = '#8D5A3B'; ctx.lineWidth = 2; ctx.strokeRect(x - 36, y - 76, 72, 34);
    ctx.fillStyle = '#3C6E71'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('PARA CRUZAR', x, y - 66);
    ctx.fillText('HAY QUE', x, y - 55);
    ctx.fillText('ACERTAR', x, y - 44);
  },

  pintar_farol(ctx, x, y) {
    const n = Estado.actual.cristales.length;
    this.sombra(ctx, x, y + 4, 42, 0);
    ctx.fillStyle = '#EDE4D3';
    ctx.beginPath(); ctx.moveTo(x - 30, y); ctx.lineTo(x - 18, y - 128);
    ctx.lineTo(x + 18, y - 128); ctx.lineTo(x + 30, y); ctx.fill();
    ctx.fillStyle = '#E8927E';
    for (let k = 0; k < 3; k++) ctx.fillRect(x - 28 + k * 1.5, y - 32 - k * 36, 56 - k * 3, 8);
    ctx.fillStyle = '#C9BFA8'; ctx.fillRect(x - 22, y - 142, 44, 14);
    ctx.fillStyle = n >= 5 ? '#FFE066' : '#9AA0A6';
    ctx.beginPath(); ctx.arc(x, y - 152, 16, 0, 7); ctx.fill();
    if (n >= 5) {
      ctx.fillStyle = 'rgba(255,224,102,0.22)';
      ctx.beginPath(); ctx.arc(x, y - 152, 48 + Math.sin(this.t * 2) * 7, 0, 7); ctx.fill();
    }
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = k < n ? '#7FD3E8' : 'rgba(0,0,0,0.14)';
      ctx.beginPath();
      ctx.moveTo(x - 40 + k * 20, y - 100); ctx.lineTo(x - 34 + k * 20, y - 90);
      ctx.lineTo(x - 40 + k * 20, y - 80); ctx.lineTo(x - 46 + k * 20, y - 90); ctx.fill();
    }
  },

  pintar_mirador(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 30, 0);
    ctx.fillStyle = '#A6784D'; ctx.fillRect(x - 30, y - 22, 60, 8);
    ctx.fillRect(x - 26, y - 14, 6, 14); ctx.fillRect(x + 20, y - 14, 6, 14);
    ctx.fillRect(x - 30, y - 44, 60, 6);
    ctx.fillRect(x - 26, y - 44, 6, 24); ctx.fillRect(x + 20, y - 44, 6, 24);
    ctx.fillStyle = '#7FA9C9'; ctx.beginPath(); ctx.arc(x + 44, y - 52, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7FA9C9'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 44, y - 43); ctx.lineTo(x + 44, y); ctx.stroke();
    if (Estado.estaEncajado('mirador')) {              // el catalejo, ya montado
      ctx.save();
      ctx.translate(x - 2, y - 52);
      ctx.rotate(-0.5 + Math.sin(this.t * 0.5) * 0.18);
      ctx.fillStyle = '#C9A227'; ctx.fillRect(0, -5, 34, 10);
      ctx.fillStyle = '#E2C44F'; ctx.fillRect(30, -7, 14, 14);
      ctx.fillStyle = '#6B5A2A'; ctx.fillRect(-6, -4, 8, 8);
      ctx.restore();
      ctx.strokeStyle = '#8A6D3B'; ctx.lineWidth = 4;   // el trípode
      ctx.beginPath(); ctx.moveTo(x - 2, y - 50); ctx.lineTo(x - 2, y - 22); ctx.stroke();
    }
  },

  pintar_barca(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 54, 0);
    ctx.fillStyle = '#B5764B';
    ctx.beginPath();
    ctx.moveTo(x - 58, y - 20); ctx.quadraticCurveTo(x, y + 18, x + 58, y - 20);
    ctx.lineTo(x + 50, y - 30); ctx.quadraticCurveTo(x, y + 4, x - 50, y - 30);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.moveTo(x - 50, y - 30); ctx.quadraticCurveTo(x, y + 4, x + 50, y - 30);
    ctx.lineTo(x + 44, y - 34); ctx.quadraticCurveTo(x, y - 2, x - 44, y - 34); ctx.fill();
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x + 6, y - 26); ctx.lineTo(x + 30, y - 62); ctx.stroke();
    if (Estado.estaEncajado('barcavieja')) {                 // con la vela puesta
      const viento = Math.sin(this.t * 1.4) * 6;
      ctx.fillStyle = '#F6F2E8';
      ctx.beginPath();
      ctx.moveTo(x + 28, y - 60);
      ctx.quadraticCurveTo(x - 18 + viento, y - 46, x + 8, y - 22);
      ctx.lineTo(x + 26, y - 26); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#D9CDB4'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + 24, y - 52);
      ctx.quadraticCurveTo(x + 4 + viento, y - 44, x + 14, y - 28); ctx.stroke();
    }
    ctx.fillStyle = '#3C6E71'; ctx.font = 'italic 11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('La Peixera', x - 6, y - 22);
  },

  pintar_ruinas(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 44, 0);
    ctx.fillStyle = '#CFC6B4';
    [[-44, 46], [-14, 62], [18, 38], [46, 54]].forEach(c => {
      ctx.fillRect(x + c[0], y - c[1], 18, c[1]);
      ctx.fillRect(x + c[0] - 3, y - c[1] - 6, 24, 7);
    });
    ctx.fillStyle = '#EDE4D3'; ctx.beginPath(); ctx.arc(x + 2, y - 84, 20, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8A837A'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x + 2, y - 84, 20, 0, 7); ctx.stroke();
    /* Con la manecilla puesta, el reloj anda. Sin ella sigue en las 7 y cuarto. */
    const anda = Estado.estaEncajado('ruinas');
    const min = anda ? this.t * 1.1 : 1.05, hor = anda ? this.t * 0.09 : 0.55;
    ctx.beginPath(); ctx.moveTo(x + 2, y - 84);
    ctx.lineTo(x + 2 + Math.sin(min) * 15, y - 84 - Math.cos(min) * 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 2, y - 84);
    ctx.lineTo(x + 2 + Math.sin(hor) * 9, y - 84 - Math.cos(hor) * 9); ctx.stroke();
  },

  pintar_pozo(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 30, 0);
    ctx.fillStyle = '#A8A29A';
    ctx.beginPath(); ctx.ellipse(x, y - 12, 28, 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#4A4640';
    ctx.beginPath(); ctx.ellipse(x, y - 14, 21, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#BDB7AE';
    for (let k = 0; k < 8; k++) {
      const a = k * 0.8;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 25, y - 12 + Math.sin(a) * 14, 5, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = '#8D5A3B'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x - 20, y - 20); ctx.lineTo(x - 20, y - 54); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 20, y - 20); ctx.lineTo(x + 20, y - 54); ctx.stroke();
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.moveTo(x - 30, y - 54); ctx.lineTo(x, y - 72); ctx.lineTo(x + 30, y - 54); ctx.fill();
    ctx.strokeStyle = '#5E3A24'; ctx.lineWidth = 1.5;
    const largo = Estado.estaEncajado('pozo')
      ? 18 + Math.abs(Math.sin(this.t * 0.5)) * 26      // el cubo sube y baja
      : 28;
    ctx.beginPath(); ctx.moveTo(x, y - 58); ctx.lineTo(x, y - 58 + largo); ctx.stroke();
    if (Estado.estaEncajado('pozo')) {
      const cy = y - 58 + largo;
      ctx.fillStyle = '#8D5A3B';
      ctx.beginPath(); ctx.moveTo(x - 9, cy); ctx.lineTo(x + 9, cy);
      ctx.lineTo(x + 7, cy + 13); ctx.lineTo(x - 7, cy + 13); ctx.fill();
      ctx.fillStyle = '#4FB8D8';                         // el agua dentro
      ctx.beginPath(); ctx.ellipse(x, cy + 1, 8, 2.6, 0, 0, 7); ctx.fill();
    }
  },

  pintar_tronco(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 40, 0);
    ctx.fillStyle = '#A6784D';
    ctx.beginPath(); ctx.roundRect(x - 44, y - 26, 88, 26, 13); ctx.fill();
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.ellipse(x - 44, y - 13, 7, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#C69C6D';
    ctx.beginPath(); ctx.ellipse(x + 44, y - 13, 7, 13, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6B4226'; ctx.lineWidth = 1.4;
    for (let k = 0; k < 4; k++) {
      ctx.beginPath(); ctx.moveTo(x - 30 + k * 18, y - 20); ctx.lineTo(x - 26 + k * 18, y - 8); ctx.stroke();
    }
  },

  pintar_estatua(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 32, 0);
    ctx.fillStyle = '#CFC6B4'; ctx.fillRect(x - 26, y - 18, 52, 18);
    ctx.fillRect(x - 20, y - 30, 40, 14);
    ctx.fillStyle = '#DDD5C6';
    ctx.beginPath(); ctx.moveTo(x - 16, y - 30); ctx.lineTo(x - 12, y - 78);
    ctx.lineTo(x + 12, y - 78); ctx.lineTo(x + 16, y - 30); ctx.fill();
    ctx.fillStyle = '#EDE4D3'; ctx.fillRect(x - 20, y - 62, 40, 12);   // el libro
    ctx.strokeStyle = '#B5AC98'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y - 62); ctx.lineTo(x, y - 50); ctx.stroke();
    ctx.fillStyle = '#C4BBAA'; ctx.fillRect(x - 13, y - 84, 26, 8);    // el cuello
    if (Estado.estaEncajado('estatua')) {               // …y su cabeza, ya puesta
      ctx.fillStyle = '#DDD5C6';
      ctx.beginPath(); ctx.arc(x, y - 98, 15, 0, 7); ctx.fill();
      ctx.fillStyle = '#C4BBAA';
      ctx.beginPath(); ctx.arc(x, y - 106, 15, 3.3, 6.1); ctx.fill();   // el pelo
      ctx.fillStyle = '#8A837A';
      ctx.beginPath(); ctx.arc(x - 5, y - 99, 1.8, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 5, y - 99, 1.8, 0, 7); ctx.fill();
    }
  },

  pintar_claro(ctx, x, y) {
    ctx.strokeStyle = '#8FCB7C'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 26; k++) {
      const hx = x - 76 + (k * 13) % 152, hy = y + (k % 4) * 9 - 10;
      const dob = Math.sin(this.t + k) * 4;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + dob, hy - 28); ctx.stroke();
    }
    /* Con el farolillo colgado salen muchísimas más luciérnagas */
    const encendido = Estado.estaEncajado('claro');
    for (let k = 0; k < (encendido ? 18 : 5); k++) {
      const a = this.t * 0.7 + k * 1.6;
      ctx.fillStyle = 'rgba(255,235,120,' + (0.35 + Math.sin(this.t * 3 + k) * 0.3) + ')';
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 60, y - 34 + Math.sin(a * 1.3) * 24, 4, 0, 7); ctx.fill();
    }
    if (encendido) {
      ctx.fillStyle = 'rgba(255,214,110,0.30)';
      ctx.beginPath(); ctx.arc(x, y - 60, 46, 0, 7); ctx.fill();
      ctx.strokeStyle = '#8A6D3B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y - 96); ctx.lineTo(x, y - 78); ctx.stroke();
      ctx.fillStyle = '#E8724C';
      ctx.beginPath(); ctx.ellipse(x, y - 66, 13, 16, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#FFD76E';
      ctx.beginPath(); ctx.ellipse(x, y - 66, 8, 11, 0, 0, 7); ctx.fill();
    }
  },

  pintar_cala(ctx, x, y) {
    ctx.fillStyle = '#EFE0B8';
    ctx.beginPath(); ctx.ellipse(x, y + 10, 80, 36, 0, 0, 7); ctx.fill();
    [[-60, -6], [58, 4], [-22, 20], [32, -14]].forEach(r => this.roca(ctx, x + r[0], y + r[1]));
  },

  pintar_nido(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 46, 0);
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 5;
    for (let k = 0; k < 12; k++) {
      ctx.beginPath(); ctx.ellipse(x, y - 8, 48 - (k % 3) * 5, 24 - (k % 3) * 3, k * 0.52, 0, Math.PI);
      ctx.stroke();
    }
    ctx.fillStyle = '#C9A87C';
    ctx.beginPath(); ctx.ellipse(x, y - 6, 40, 18, 0, 0, 7); ctx.fill();
  },

  pintar_cueva(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 40, 0);
    ctx.fillStyle = '#9E9A93';
    ctx.beginPath(); ctx.ellipse(x, y - 20, 50, 44, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 50, y - 20, 100, 20);
    ctx.fillStyle = '#3A3632';
    ctx.beginPath(); ctx.ellipse(x, y - 8, 22, 26, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 22, y - 8, 44, 8);
    ctx.fillStyle = '#B5B0A8';
    this.roca(ctx, x - 44, y + 2); this.roca(ctx, x + 46, y + 4);
  },

  pintar_espantapajaros(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 20, 0);
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 74); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 30, y - 52); ctx.lineTo(x + 30, y - 52); ctx.stroke();
    ctx.fillStyle = '#7FA9C9';
    ctx.beginPath(); ctx.moveTo(x - 26, y - 56); ctx.lineTo(x + 26, y - 56);
    ctx.lineTo(x + 16, y - 22); ctx.lineTo(x - 16, y - 22); ctx.fill();
    ctx.fillStyle = '#E8C9A0'; ctx.beginPath(); ctx.arc(x, y - 68, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    ctx.beginPath(); ctx.arc(x - 4, y - 70, 1.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 4, y - 70, 1.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#E8C33D';
    ctx.beginPath(); ctx.ellipse(x, y - 78, 20, 6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y - 82, 11, 7, 0, 0, 7); ctx.fill();
    if (Estado.estaEncajado('espantapajaros')) {        // el molinillo: gira y espanta
      const g = this.t * 3;
      ctx.strokeStyle = '#8A6D3B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x + 16, y - 84); ctx.lineTo(x + 16, y - 98); ctx.stroke();
      ['#F26FA8', '#FFE066', '#5AA9DC', '#7FC97F'].forEach((col, k) => {
        const a = g + k * 1.57;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(x + 16, y - 98);
        ctx.lineTo(x + 16 + Math.cos(a) * 11, y - 98 + Math.sin(a) * 11);
        ctx.lineTo(x + 16 + Math.cos(a + 0.7) * 8, y - 98 + Math.sin(a + 0.7) * 8);
        ctx.fill();
      });
    } else {
      ctx.font = '13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('🐦', x + 22, y - 74);
    }
  },

  pintar_buzon(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 16, 0);
    ctx.fillStyle = '#8D5A3B'; ctx.fillRect(x - 4, y - 40, 8, 40);
    ctx.fillStyle = '#E8506B';
    ctx.beginPath(); ctx.roundRect(x - 18, y - 66, 36, 28, 6); ctx.fill();
    ctx.fillStyle = '#FFF'; ctx.fillRect(x - 12, y - 58, 24, 4);
    ctx.fillStyle = '#F2C14E'; ctx.fillRect(x + 18, y - 70, 4, 20);
    ctx.fillStyle = '#E8506B';
    ctx.beginPath(); ctx.moveTo(x + 22, y - 70); ctx.lineTo(x + 36, y - 64);
    ctx.lineTo(x + 22, y - 58); ctx.fill();
  },

  pintar_embarcadero(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 34, 0);
    ctx.fillStyle = '#A6784D';
    ctx.fillRect(x - 40, y - 12, 80, 14);
    for (let k = 0; k < 4; k++) ctx.fillRect(x - 34 + k * 22, y + 2, 7, 16);
    ctx.fillStyle = '#B5764B';
    ctx.beginPath();
    ctx.moveTo(x + 20, y + 20); ctx.quadraticCurveTo(x + 56, y + 44, x + 92, y + 20);
    ctx.lineTo(x + 84, y + 8); ctx.quadraticCurveTo(x + 56, y + 28, x + 28, y + 8);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#8D5A3B'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 30, y + 6); ctx.lineTo(x + 8, y - 8); ctx.stroke();
    ctx.font = '18px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('⛵', x, y - 26);
  },

  pintar_pescador(ctx, x, y) {

  /* La barca, el caballo y el coche, con la niña encima */
  dibujarVehiculo(ctx, x, y, tipo, mirando) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(mirando < 0 ? -1 : 1, 1);

    if (tipo === 'barca') {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';                 // estela
      ctx.beginPath(); ctx.ellipse(-30, 4, 30, 9, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#B5764B';
      ctx.beginPath();
      ctx.moveTo(-44, -6); ctx.quadraticCurveTo(0, 26, 44, -6);
      ctx.lineTo(38, -16); ctx.quadraticCurveTo(0, 12, -38, -16);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8D5A3B';
      ctx.beginPath(); ctx.moveTo(-38, -16); ctx.quadraticCurveTo(0, 12, 38, -16);
      ctx.lineTo(34, -20); ctx.quadraticCurveTo(0, 6, -34, -20); ctx.fill();
      ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 4;          // los remos
      const rem = Math.sin(this.t * 5) * 0.35;
      ctx.save(); ctx.rotate(rem);
      ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(-40, -34); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.rotate(-rem);
      ctx.beginPath(); ctx.moveTo(6, -14); ctx.lineTo(42, -30); ctx.stroke(); ctx.restore();
    }

    if (tipo === 'caballo') {
      ctx.fillStyle = '#B5885A';
      ctx.beginPath(); ctx.ellipse(0, -30, 30, 17, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(26, -46, 12, 0, 7); ctx.fill();
      ctx.fillStyle = '#8D6B45';
      ctx.beginPath(); ctx.moveTo(20, -56); ctx.lineTo(22, -64); ctx.lineTo(27, -55); ctx.fill();
      ctx.fillStyle = '#6B4226';
      ctx.beginPath(); ctx.ellipse(12, -50, 6, 14, 0.3, 0, 7); ctx.fill();   // crines
      ctx.beginPath(); ctx.ellipse(-30, -34, 7, 15, -0.4, 0, 7); ctx.fill(); // cola
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(31, -48, 1.8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#B5885A'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      const t1 = Math.sin(this.t * 9) * 8, t2 = Math.sin(this.t * 9 + 2) * 8;
      [[-18, t1], [-6, t2], [10, -t1], [22, -t2]].forEach(p => {
        ctx.beginPath(); ctx.moveTo(p[0], -22); ctx.lineTo(p[0] + p[1] * 0.4, -2); ctx.stroke();
      });
    }

    if (tipo === 'coche') {
      ctx.fillStyle = '#2F2A28';
      [[-20, 4], [20, 4]].forEach(r => {
        ctx.beginPath(); ctx.ellipse(r[0], r[1], 10, 7, 0, 0, 7); ctx.fill();
      });
      ctx.fillStyle = '#E8506B';
      ctx.beginPath(); ctx.roundRect(-34, -22, 68, 26, 12); ctx.fill();
      ctx.fillStyle = '#F0839A';
      ctx.beginPath(); ctx.roundRect(-26, -30, 40, 14, 8); ctx.fill();
      ctx.fillStyle = '#FFF3C4';
      ctx.beginPath(); ctx.arc(34, -12, 5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#7A2E3E'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(4, -26, 7, 0, 7); ctx.stroke();     // volante
    }
    ctx.restore();
  },

  /* LAS TAZAS (arreglado el 12-09-2026)
     Antes el plato giraba por su cuenta y la jugadora daba vueltas al lado, en
     el aire: parecía que montarse no funcionaba. Ahora, mientras hay paseo, las
     tazas giran con ella y la suya (la rosa) va siempre justo debajo. */
  RADIO_TAZA: 62,

  pintar_tazas(ctx, x, y) {
    const v = this.vehiculo;
    const montada = v && v.tipo === 'taza';
    this.sombra(ctx, x, y + 4, 100, 0);
    ctx.fillStyle = '#C9A8E8';
    ctx.beginPath(); ctx.ellipse(x, y, 116, 62, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#DCC4F2';
    ctx.beginPath(); ctx.ellipse(x, y - 6, 116, 60, 0, 0, 7); ctx.fill();
    const g = montada ? v.giro : this.t * 1.2;
    for (let k = 0; k < 3; k++) {
      const a = g + k * 2.09;
      const cx = x + Math.cos(a) * this.RADIO_TAZA;
      const cy = y - 10 + Math.sin(a) * this.RADIO_TAZA * 0.55;
      ctx.fillStyle = ['#F26FA8', '#FFE066', '#5AA9DC'][k];
      ctx.beginPath(); ctx.ellipse(cx, cy, 24, 17, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.ellipse(cx, cy - 5, 19, 11, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = ['#F26FA8', '#FFE066', '#5AA9DC'][k]; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx + 27, cy, 8, -1.2, 1.2); ctx.stroke();
    }
    ctx.fillStyle = '#3C6E71'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('TAZAS', x, y - 60);
  },

  /* Nit, el ratón del molino: pequeñísimo, que de eso va su historia */
  pintar_raton(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 16, 0);
    ctx.fillStyle = '#B5AC98';                            // su puertecita
    ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.lineTo(x - 20, y - 22);
    ctx.quadraticCurveTo(x - 20, y - 34, x - 8, y - 34);
    ctx.quadraticCurveTo(x + 4, y - 34, x + 4, y - 22); ctx.lineTo(x + 4, y); ctx.fill();
    ctx.fillStyle = '#7A6A55';
    ctx.beginPath(); ctx.moveTo(x - 17, y); ctx.lineTo(x - 17, y - 22);
    ctx.quadraticCurveTo(x - 17, y - 31, x - 8, y - 31);
    ctx.quadraticCurveTo(x + 1, y - 31, x + 1, y - 22); ctx.lineTo(x + 1, y); ctx.fill();
    const b = Math.sin(this.t * 2) * 1.5;                 // y él, asomado
    ctx.strokeStyle = '#A89A88'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x + 14, y - 8);
    ctx.quadraticCurveTo(x + 24, y - 10 + b, x + 22, y - 18); ctx.stroke();
    ctx.fillStyle = '#9B9186';
    ctx.beginPath(); ctx.ellipse(x + 14, y - 10, 8, 6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 21, y - 15, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#E8BFC8';                            // las orejotas
    ctx.beginPath(); ctx.arc(x + 18, y - 20 + b * 0.3, 3.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 24, y - 19 + b * 0.3, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    ctx.beginPath(); ctx.arc(x + 23, y - 16, 1.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#E8506B';
    ctx.beginPath(); ctx.arc(x + 26, y - 14, 1.2, 0, 7); ctx.fill();
  },

  /* La Casa dels Bitxos: la tienda de mascotas de Ona */
  pintar_casaBitxos(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 56, 0);
    ctx.fillStyle = '#8FBF7A';                            // el seto de la entrada
    [[-56, 6], [56, 6]].forEach(g => {
      ctx.beginPath(); ctx.ellipse(x + g[0], y - g[1], 14, 11, 0, 0, 7); ctx.fill();
    });
    ctx.fillStyle = '#E8C9A0';                            // la casita
    ctx.fillRect(x - 46, y - 62, 92, 62);
    ctx.fillStyle = '#D8B387';
    ctx.fillRect(x - 46, y - 62, 92, 8);
    ctx.fillStyle = '#5AA9DC';                            // el tejado
    ctx.beginPath(); ctx.moveTo(x - 58, y - 60); ctx.lineTo(x, y - 96);
    ctx.lineTo(x + 58, y - 60); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7FC3E8';
    ctx.beginPath(); ctx.moveTo(x - 58, y - 60); ctx.lineTo(x, y - 96);
    ctx.lineTo(x, y - 60); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6B4E32';                            // la puerta
    ctx.fillRect(x - 13, y - 40, 26, 40);
    ctx.fillStyle = '#FFE066';
    ctx.beginPath(); ctx.arc(x + 8, y - 20, 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#B8ECDF';                            // las ventanas
    [[-32, -46], [32, -46]].forEach(g => {
      ctx.beginPath(); ctx.roundRect(x + g[0] - 11, y + g[1], 22, 20, 6); ctx.fill();
    });
    ctx.fillStyle = '#3C6E71';                            // el rótulo
    ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('BITXOS', x, y - 66);
    // dos bichos asomados a las ventanas, que se turnan
    ctx.font = '15px system-ui';
    ctx.fillText(['🦩', '🦜', '🐙'][Math.floor(this.t / 2) % 3], x - 32, y - 30);
    ctx.fillText(['🦎', '🐧', '🦚'][Math.floor(this.t / 2 + 1) % 3], x + 32, y - 30);
  },

  pintar_tren(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 56, 0);
    ctx.strokeStyle = '#B5AC98'; ctx.lineWidth = 5;         // las vías
    ctx.beginPath(); ctx.ellipse(x, y, 110, 56, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y, 92, 44, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#8D5A3B'; ctx.lineWidth = 3;
    for (let a = 0; a < 6.28; a += 0.4) {
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * 92, y + Math.sin(a) * 44);
      ctx.lineTo(x + Math.cos(a) * 110, y + Math.sin(a) * 56); ctx.stroke();
    }
    const a = this.t * 0.8;
    const tx = x + Math.cos(a) * 101, ty = y + Math.sin(a) * 50;
    ctx.fillStyle = '#E8506B';
    ctx.beginPath(); ctx.roundRect(tx - 18, ty - 20, 36, 22, 6); ctx.fill();
    ctx.fillStyle = '#3C6E71'; ctx.fillRect(tx - 6, ty - 32, 10, 12);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(tx - 1, ty - 38, 5 + Math.sin(this.t * 5) * 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#2F2A28';
    ctx.beginPath(); ctx.arc(tx - 10, ty + 2, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(tx + 10, ty + 2, 5, 0, 7); ctx.fill();
  },

  pintar_taquilla(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 34, 0);
    ctx.fillStyle = '#FFF3C4'; ctx.fillRect(x - 30, y - 56, 60, 56);
    ctx.fillStyle = '#E8506B';
    ctx.beginPath(); ctx.moveTo(x - 40, y - 54); ctx.lineTo(x, y - 84); ctx.lineTo(x + 40, y - 54); ctx.fill();
    ctx.fillStyle = '#5AA9DC'; ctx.fillRect(x - 18, y - 42, 36, 22);
    ctx.fillStyle = '#3C6E71'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('ENTRADA', x, y - 12);
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = Math.sin(this.t * 4 + k) > 0 ? '#FFE066' : 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(x - 30 + k * 20, y - 60 - Math.abs(k - 1.5) * 6, 4, 0, 7); ctx.fill();
    }
  },

  pintar_molino(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 44, 0);
    ctx.fillStyle = '#EDE4D3';
    ctx.beginPath(); ctx.moveTo(x - 34, y); ctx.lineTo(x - 22, y - 96);
    ctx.lineTo(x + 22, y - 96); ctx.lineTo(x + 34, y); ctx.fill();
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.moveTo(x - 30, y - 94); ctx.lineTo(x, y - 126); ctx.lineTo(x + 30, y - 94); ctx.fill();
    ctx.fillStyle = '#5E3A24'; ctx.fillRect(x - 10, y - 34, 20, 34);
    const gira = Estado.estaEncajado('molino');
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 6;
    const giro = gira ? this.t * 1.6 : 0.4;
    for (let k = 0; k < 4; k++) {
      const a = giro + k * 1.57;
      if (!gira && k === 3) continue;                       // le falta un aspa
      ctx.beginPath(); ctx.moveTo(x, y - 100);
      ctx.lineTo(x + Math.cos(a) * 46, y - 100 + Math.sin(a) * 46); ctx.stroke();
      ctx.fillStyle = k % 2 ? '#F6E7BF' : '#EFDCAC';
      ctx.save(); ctx.translate(x, y - 100); ctx.rotate(a);
      ctx.fillRect(16, -9, 30, 18);
      ctx.restore();
    }
    ctx.fillStyle = '#6B4226'; ctx.beginPath(); ctx.arc(x, y - 100, 6, 0, 7); ctx.fill();
  },

  pintar_fuente(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 40, 0);
    ctx.fillStyle = '#BDB7AE';
    ctx.beginPath(); ctx.ellipse(x, y - 6, 40, 22, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#5AA9DC';
    ctx.beginPath(); ctx.ellipse(x, y - 8, 32, 16, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#CFC6B4'; ctx.fillRect(x - 6, y - 40, 12, 32);
    ctx.beginPath(); ctx.ellipse(x, y - 42, 16, 7, 0, 0, 7); ctx.fill();
    if (Estado.estaEncajado('fuente')) {
      ctx.fillStyle = '#E8C33D';                            // el grifo puesto
      ctx.fillRect(x - 3, y - 50, 6, 8);
      ctx.fillRect(x + 1, y - 48, 8, 4);
      ctx.fillStyle = 'rgba(160,220,255,0.75)';             // y el agua saliendo
      for (let k = 0; k < 6; k++) {
        const p = (this.t * 2 + k * 0.17) % 1;
        ctx.beginPath();
        ctx.arc(x + 8 + Math.sin(k) * 4, y - 44 + p * 34, 3 - p, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#E8C33D';                            // monedas brillando
      [[-14, -6], [8, -10], [16, -2], [-4, 0]].forEach(m => {
        ctx.beginPath(); ctx.ellipse(x + m[0], y + m[1] - 8, 3.4, 2.4, 0, 0, 7); ctx.fill();
      });
    } else {
      ctx.fillStyle = '#BDB7AE';                            // sin grifo: seca
      ctx.fillRect(x - 3, y - 48, 6, 6);
      ctx.fillStyle = '#8A837A'; ctx.font = 'italic 11px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('seca', x, y - 2);
    }
  },

  pintar_hamaca(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 40, 0);
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(x - 54, y); ctx.lineTo(x - 50, y - 74); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 54, y); ctx.lineTo(x + 50, y - 74); ctx.stroke();
    const cuelga = Math.sin(this.t * 1.1) * 5;
    ctx.strokeStyle = '#F26FA8'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - 48, y - 64);
    ctx.quadraticCurveTo(x + cuelga, y - 22, x + 48, y - 64);
    ctx.stroke();
    ctx.strokeStyle = '#FFF3C4'; ctx.lineWidth = 2;
    for (let k = -3; k <= 3; k++) {
      ctx.beginPath();
      ctx.moveTo(x + k * 13, y - 60 + Math.abs(k) * 2);
      ctx.lineTo(x + k * 13 + cuelga * 0.3, y - 34 + Math.abs(k) * 5); ctx.stroke();
    }
    ctx.font = '15px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('📖', x + 20, y - 4);
  },

  pintar_totem(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 26, 0);
    const caras = [['#B5764B', '#8D5A3B'], ['#C9A87C', '#A6784D'], ['#A6784D', '#8D5A3B']];
    caras.forEach((c, k) => {
      const cy = y - 34 - k * 34;
      ctx.fillStyle = c[0];
      ctx.beginPath(); ctx.roundRect(x - 24, cy - 18, 48, 36, 6); ctx.fill();
      ctx.fillStyle = c[1];
      ctx.beginPath(); ctx.arc(x - 10, cy - 4, 5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 10, cy - 4, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#5E3A24';
      if (k === 0) { ctx.beginPath(); ctx.arc(x, cy + 8, 8, 0, Math.PI); ctx.fill(); }
      if (k === 1) { ctx.beginPath(); ctx.ellipse(x, cy + 9, 7, 5, 0, 0, 7); ctx.fill(); }
      if (k === 2) ctx.fillRect(x - 8, cy + 7, 16, 3);
    });
    ctx.fillStyle = '#5FA55A';
    ctx.beginPath(); ctx.moveTo(x - 30, y - 120); ctx.lineTo(x, y - 142); ctx.lineTo(x + 30, y - 120); ctx.fill();
  },

  /* Un corral con su vallita: sirve para los tres animales de la granja */
  corral(ctx, x, y, color) {
    this.sombra(ctx, x, y + 4, 66, 0);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(x, y, 86, 46, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let a = 0; a < 6.28; a += 0.5) {
      const vx = x + Math.cos(a) * 86, vy = y + Math.sin(a) * 46;
      ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx, vy - 24); ctx.stroke();
    }
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y - 14, 86, 46, 0, 0, 7); ctx.stroke();
  },

  pintar_corralElefantes(ctx, x, y) {
    this.corral(ctx, x, y, '#CFE0C4');
    for (let k = 0; k < 2; k++) {
      const ex = x - 26 + k * 52, ey = y - 6 + (k % 2) * 10;
      ctx.fillStyle = '#9BA7B0';
      ctx.beginPath(); ctx.ellipse(ex, ey - 18, 24, 17, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + 20, ey - 26, 12, 0, 7); ctx.fill();
      ctx.fillStyle = '#8B97A0';
      ctx.beginPath(); ctx.ellipse(ex + 14, ey - 30, 9, 11, 0, 0, 7); ctx.fill();  // oreja
      ctx.strokeStyle = '#9BA7B0'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex + 30, ey - 22);
      ctx.quadraticCurveTo(ex + 40, ey - 10 + Math.sin(this.t * 2 + k) * 4, ex + 34, ey + 2);
      ctx.stroke();
      ctx.fillStyle = '#9BA7B0';
      [-14, -4, 8, 16].forEach(p => ctx.fillRect(ex + p, ey - 4, 7, 10));
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(ex + 23, ey - 28, 1.8, 0, 7); ctx.fill();
      ctx.fillStyle = '#8D6E52';                                   // manchas de barro
      [[-8, -22], [4, -14], [-16, -12]].forEach(m => {
        ctx.beginPath(); ctx.arc(ex + m[0], ey + m[1], 4, 0, 7); ctx.fill();
      });
    }
  },

  pintar_corralPonis(ctx, x, y) {
    this.corral(ctx, x, y, '#E4DCC0');
    for (let k = 0; k < 2; k++) {
      const px = x - 24 + k * 50, py = y - 4 + (k % 2) * 12;
      ctx.fillStyle = k ? '#C9A87C' : '#8D6E52';
      ctx.beginPath(); ctx.ellipse(px, py - 16, 20, 12, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(px + 17, py - 28, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#5E3A24';
      ctx.beginPath(); ctx.moveTo(px + 12, py - 35); ctx.lineTo(px + 13, py - 41);
      ctx.lineTo(px + 17, py - 34); ctx.fill();
      ctx.beginPath(); ctx.ellipse(px + 8, py - 30, 4, 9, 0.3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(px - 19, py - 20, 5, 10, -0.4, 0, 7); ctx.fill();
      ctx.strokeStyle = k ? '#C9A87C' : '#8D6E52'; ctx.lineWidth = 5;
      const tr = Math.sin(this.t * 5 + k) * 3;
      [-12, -2, 8, 14].forEach((p, i) => {
        ctx.beginPath(); ctx.moveTo(px + p, py - 8);
        ctx.lineTo(px + p + (i % 2 ? tr : -tr), py + 4); ctx.stroke();
      });
      ctx.fillStyle = '#3A3A3A';
      ctx.beginPath(); ctx.arc(px + 20, py - 30, 1.6, 0, 7); ctx.fill();
    }
  },

  pintar_corralOvejas(ctx, x, y) {
    this.corral(ctx, x, y, '#D8E8C8');
    for (let k = 0; k < 3; k++) {
      const ox = x - 34 + k * 34, oy = y - 4 + (k % 2) * 14;
      ctx.fillStyle = '#F6F2E8';
      for (let b = 0; b < 5; b++) {
        const a = b * 1.25;
        ctx.beginPath();
        ctx.arc(ox + Math.cos(a) * 10, oy - 16 + Math.sin(a) * 7, 8, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#3A3632';
      ctx.beginPath(); ctx.arc(ox + 13, oy - 20, 6, 0, 7); ctx.fill();
      ctx.fillRect(ox - 6, oy - 8, 3, 8); ctx.fillRect(ox + 5, oy - 8, 3, 8);
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(ox + 15, oy - 21, 1.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#8D6E52';
      ctx.beginPath(); ctx.arc(ox - 4, oy - 18, 3, 0, 7); ctx.fill();
    }
  },

  pintar_establo(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 52, 0);
    ctx.fillStyle = '#C25A2E'; ctx.fillRect(x - 48, y - 58, 96, 58);
    ctx.fillStyle = '#8E3F1F';
    ctx.beginPath(); ctx.moveTo(x - 60, y - 56); ctx.lineTo(x, y - 96); ctx.lineTo(x + 60, y - 56); ctx.fill();
    ctx.fillStyle = '#F6E7BF'; ctx.fillRect(x - 20, y - 40, 40, 40);
    ctx.strokeStyle = '#8E3F1F'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 20, y - 22); ctx.lineTo(x + 20, y - 22); ctx.stroke();
    ctx.fillStyle = '#E8C33D';
    for (let k = 0; k < 6; k++) ctx.fillRect(x + 26 + (k % 3) * 7, y - 12 + Math.floor(k / 3) * 7, 5, 5);
    ctx.font = '18px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('🐴', x - 36, y - 8);
    if (Estado.estaEncajado('caballo')) {
      ctx.font = '16px system-ui';
      ctx.fillText('🧲', x + 4, y - 46);                     // la herradura de la suerte
      ctx.fillStyle = 'rgba(255,240,170,' + (0.3 + Math.sin(this.t * 3) * 0.2) + ')';
      ctx.beginPath(); ctx.arc(x + 4, y - 50, 14, 0, 7); ctx.fill();
    }
  },

  pintar_cochecitos(ctx, x, y) {
    this.sombra(ctx, x, y + 4, 56, 0);
    ctx.strokeStyle = '#5B8FA8'; ctx.lineWidth = 5;              // barandilla
    ctx.beginPath(); ctx.ellipse(x, y - 120, 250, 145, 0, 0, 7); ctx.stroke();
    ctx.fillStyle = '#3C6E71'; ctx.fillRect(x - 46, y - 66, 92, 66);
    ctx.fillStyle = '#E8506B';
    ctx.beginPath(); ctx.moveTo(x - 58, y - 64); ctx.lineTo(x, y - 100); ctx.lineTo(x + 58, y - 64); ctx.fill();
    ctx.fillStyle = '#FFF3C4'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('CHOQUE', x, y - 34);
    for (let k = 0; k < 5; k++) {                                 // bombillas
      const c = ['#FFE066', '#FF8FA3', '#8FE3C8'][k % 3];
      ctx.fillStyle = Math.sin(this.t * 4 + k) > 0 ? c : 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(x - 48 + k * 24, y - 70 - Math.abs(k - 2) * 8, 4, 0, 7); ctx.fill();
    }
  },

  pintar_tiovivo(ctx, x, y) {
    this.sombra(ctx, x, y + 6, 84, 0);
    ctx.fillStyle = '#EFDCAC';
    ctx.beginPath(); ctx.ellipse(x, y, 86, 44, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#D9C48F';
    ctx.beginPath(); ctx.ellipse(x, y - 6, 86, 42, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#A6784D'; ctx.fillRect(x - 5, y - 104, 10, 100);
    const giro = this.t * 0.9;
    for (let k = 0; k < 4; k++) {                                 // caballitos
      const a = giro + k * 1.57;
      const cx = x + Math.cos(a) * 62, cy = y - 14 + Math.sin(a) * 30;
      ctx.strokeStyle = '#C9BFA8'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy - 40); ctx.lineTo(cx, cy); ctx.stroke();
      ctx.fillStyle = k % 2 ? '#FFF8E0' : '#F0839A';
      ctx.beginPath(); ctx.ellipse(cx, cy + Math.sin(this.t * 3 + k) * 6, 13, 8, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 10, cy - 8 + Math.sin(this.t * 3 + k) * 6, 5, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#E8506B';                                    // toldo
    for (let k = 0; k < 8; k++) {
      ctx.fillStyle = k % 2 ? '#E8506B' : '#FFF3C4';
      ctx.beginPath(); ctx.moveTo(x, y - 104);
      ctx.arc(x, y - 104, 96, Math.PI + k * (Math.PI / 8), Math.PI + (k + 1) * (Math.PI / 8));
      ctx.fill();
    }
    ctx.fillStyle = '#E8C33D';
    ctx.beginPath(); ctx.arc(x, y - 112, 8, 0, 7); ctx.fill();
  },

  // --- figuras sueltas ---------------------------------------------------
  personajeSimple(ctx, x, y, ropa, pelo, dormido) {
    ctx.fillStyle = ropa;
    ctx.beginPath(); ctx.moveTo(x - 11, y); ctx.lineTo(x - 8, y - 28);
    ctx.lineTo(x + 8, y - 28); ctx.lineTo(x + 11, y); ctx.fill();
    ctx.fillStyle = '#F5D6BE'; ctx.beginPath(); ctx.arc(x, y - 37, 11, 0, 7); ctx.fill();
    ctx.fillStyle = pelo;
    ctx.beginPath(); ctx.arc(x, y - 39, 11.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(x - 11.5, y - 41, 23, 3);
    ctx.fillStyle = '#3A3A3A';
    if (dormido) { ctx.fillRect(x - 6, y - 37, 4, 1.6); ctx.fillRect(x + 2, y - 37, 4, 1.6); }
    else {
      ctx.beginPath(); ctx.arc(x - 4, y - 37, 1.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 4, y - 37, 1.6, 0, 7); ctx.fill();
    }
    ctx.fillStyle = 'rgba(240,140,150,0.4)';
    ctx.beginPath(); ctx.arc(x - 7, y - 33, 2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 7, y - 33, 2, 0, 7); ctx.fill();
  },

  oso(ctx, x, y, dormido) {
    this.sombra(ctx, x, y + 2, 18, 0);
    ctx.fillStyle = '#B07D4E';
    ctx.beginPath(); ctx.ellipse(x, y - 16, 15, 17, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - 42, 13, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 11, y - 52, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 11, y - 52, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#E8C9A0';
    ctx.beginPath(); ctx.ellipse(x, y - 37, 6, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';
    if (dormido) { ctx.fillRect(x - 7, y - 45, 5, 1.6); ctx.fillRect(x + 2, y - 45, 5, 1.6); }
    else {
      ctx.beginPath(); ctx.arc(x - 4.5, y - 45, 1.7, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 4.5, y - 45, 1.7, 0, 7); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(x, y - 37, 2, 0, 7); ctx.fill();
  },

  loro(ctx, x, y) {
    this.sombra(ctx, x, y + 2, 10, 0);
    ctx.fillStyle = '#4CAF50';
    ctx.beginPath(); ctx.ellipse(x, y - 13, 9, 12, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 2, y - 28, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#F2C14E';
    ctx.beginPath(); ctx.moveTo(x + 9, y - 29); ctx.lineTo(x + 17, y - 26); ctx.lineTo(x + 9, y - 23); ctx.fill();
    ctx.fillStyle = '#3A3A3A'; ctx.beginPath(); ctx.arc(x + 4, y - 30, 1.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#E85D75';
    ctx.beginPath(); ctx.ellipse(x - 6, y - 13, 4, 9, 0.3, 0, 7); ctx.fill();
  },

  palmera(ctx, x, y) {
    this.sombra(ctx, x, y, 24, 0);
    ctx.strokeStyle = '#A6784D'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10, y - 54, x + 5, y - 100); ctx.stroke();
    ctx.strokeStyle = '#B98B5E'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x + 1, y - 10); ctx.quadraticCurveTo(x + 11, y - 54, x + 6, y - 96); ctx.stroke();
    const vaiven = Math.sin(this.t * 0.8 + x) * 0.05;
    for (let k = 0; k < 7; k++) {
      const a = -Math.PI / 2 + (k - 3) * 0.5 + vaiven;
      ctx.save(); ctx.translate(x + 5, y - 100); ctx.rotate(a);
      ctx.fillStyle = k % 2 ? '#4E9A51' : '#5CB05F';
      ctx.beginPath(); ctx.ellipse(30, 0, 30, 9, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#8D5A3B';
    ctx.beginPath(); ctx.arc(x + 13, y - 94, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 2, y - 92, 4.5, 0, 7); ctx.fill();
  },

  arbol(ctx, x, y) {
    this.sombra(ctx, x, y, 22, 0);
    ctx.fillStyle = '#8D5A3B'; ctx.fillRect(x - 6, y - 46, 12, 46);
    ctx.fillStyle = '#3E8A4A';
    ctx.beginPath(); ctx.arc(x, y - 62, 30, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 22, y - 48, 21, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 22, y - 48, 21, 0, 7); ctx.fill();
    ctx.fillStyle = '#4E9A51';
    ctx.beginPath(); ctx.arc(x - 8, y - 72, 20, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 14, y - 66, 16, 0, 7); ctx.fill();
  },

  mata(ctx, x, y) {
    this.sombra(ctx, x, y, 15, 0);
    ctx.fillStyle = '#7FBF6A';
    ctx.beginPath(); ctx.arc(x, y - 9, 12, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 12, y - 4, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 11, y - 4, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#69AA57'; ctx.beginPath(); ctx.arc(x + 3, y - 15, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFB3C6';
    ctx.beginPath(); ctx.arc(x - 6, y - 14, 2.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 9, y - 9, 2.5, 0, 7); ctx.fill();
  },

  roca(ctx, x, y) {
    this.sombra(ctx, x, y, 16, 0);
    ctx.fillStyle = '#A8A29A';
    ctx.beginPath(); ctx.ellipse(x, y - 8, 17, 13, 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#BDB7AE';
    ctx.beginPath(); ctx.ellipse(x - 3, y - 12, 11, 8, 0.2, 0, 7); ctx.fill();
  },

  flor(ctx, x, y) {
    const c = ['#FF8FA3', '#FFD166', '#C3A6FF', '#FFFFFF'][(x + y) % 4];
    ctx.strokeStyle = '#69AA57'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 13); ctx.stroke();
    ctx.fillStyle = c;
    for (let k = 0; k < 5; k++) {
      const a = k * 1.257;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 4.8, y - 15 + Math.sin(a) * 4.8, 3.4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#FFE066'; ctx.beginPath(); ctx.arc(x, y - 15, 2.4, 0, 7); ctx.fill();
  },

  mariposa(ctx) {
    this.mariposas.forEach(b => {
      const ala = Math.abs(Math.sin(this.t * 9 + b.x));
      ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.ellipse(b.x - 4, b.y, 4, 2 + ala * 3, -0.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(b.x + 4, b.y, 4, 2 + ala * 3, 0.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#5A4A3A'; ctx.fillRect(b.x - 1, b.y - 3, 2, 7);
    });
  },
};

</script>
<script>
/* === motor/inicio.js === */
/* PANTALLA DE INICIO: elegir jugadora o crear una nueva. */

const Inicio = {

  iniciar() {
    UI.iniciar();
    Estado.cargar();
    this.pintarPerfiles();
    UI.pantalla('inicio');
  },

  pintarPerfiles() {
    const zona = document.getElementById('listaPerfiles');
    zona.innerHTML = Estado.perfiles.map((p, i) => `
      <div class="ficha">
        <canvas class="mini" data-i="${i}" width="120" height="150"></canvas>
        <b>${p.nombre}</b>
        <small>🐚 ${p.conchas} · 💎 ${p.cristales.length}/5</small>
        <button class="btn jugar" data-i="${i}">Jugar</button>
        <div class="fila-enlaces">
          <button class="enlace reiniciar" data-i="${i}">empezar de nuevo</button>
          <button class="enlace borrar" data-i="${i}">borrar</button>
        </div>
      </div>`).join('') +
      (Estado.perfiles.length < 4
        ? `<div class="ficha nueva"><button class="btn" id="nueva">+ Nueva jugadora</button></div>` : '');

    zona.querySelectorAll('.mini').forEach(c => {
      const ctx = c.getContext('2d');
      Avatar.dibujar(ctx, 60, 140, 1.4, Estado.perfiles[+c.dataset.i].look, 1, 0);
    });
    zona.querySelectorAll('.jugar').forEach(b =>
      b.onclick = () => this.jugar(+b.dataset.i));
    zona.querySelectorAll('.reiniciar').forEach(b =>
      b.onclick = () => {
        const p = Estado.perfiles[+b.dataset.i];
        UI.dialogo(null, `<b>${p.nombre}</b> volvería a empezar de cero: sin conchas, sin ` +
          `cristales y sin la ropa conseguida. El personaje y el nombre se quedan.`, [
          { texto: 'No, dejarlo', accion: () => UI.cerrar() },
          { texto: 'Sí, empezar de nuevo', accion: () => {
              Estado.reiniciarPerfil(+b.dataset.i); UI.cerrar(); this.pintarPerfiles(); } },
        ]);
      });

    zona.querySelectorAll('.borrar').forEach(b =>
      b.onclick = () => {
        UI.dialogo(null, `¿Seguro que quieres borrar a <b>${Estado.perfiles[+b.dataset.i].nombre}</b>? Se pierde todo su progreso.`, [
          { texto: 'No, mejor no', accion: () => UI.cerrar() },
          { texto: 'Sí, borrar', accion: () => { Estado.borrarPerfil(+b.dataset.i); UI.cerrar(); this.pintarPerfiles(); } },
        ]);
      });
    const nueva = document.getElementById('nueva');
    if (nueva) nueva.onclick = () => this.formulario();

    this.pintarAvisoGuardado();
  },

  /* Deja claro si en este aparato se está guardando o no. Sin esto, cuando el
     navegador borra la partida al cerrar (pasa en el iPad y en las ventanas
     privadas) parece que el juego se ha estropeado. */
  pintarAvisoGuardado() {
    const aviso = document.getElementById('avisoGuardado');
    if (!aviso) return;

    if (!Estado.sePuedeGuardar()) {
      aviso.className = 'alerta';
      aviso.innerHTML = '⚠️ En este navegador <b>no se puede guardar la partida</b>. ' +
        'Se puede jugar, pero al cerrar se perderá todo.<br>' +
        'Prueba a abrir el juego en una ventana normal (no privada).';
      return;
    }

    const f = Estado.guardadoEl();
    aviso.className = '';
    const n = Pedidos.cuantas();
    const libreta = n
      ? ' · <button class="enlace" id="verLibreta">📦 ' + n +
        (n === 1 ? ' petición para la tienda' : ' peticiones para la tienda') + '</button>'
      : '';
    if (!f) {
      aviso.innerHTML = 'Todavía no se ha guardado nada en este aparato.' + libreta;
    } else {
      const hoy = new Date().toDateString() === f.toDateString();
      const hora = f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      const dia = f.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
      aviso.innerHTML = '🕓 Guardado en este aparato: ' + (hoy ? 'hoy' : 'el ' + dia) +
                        ' a las ' + hora + '.' + libreta;
    }
    const bl = document.getElementById('verLibreta');
    if (bl) bl.onclick = () => Pedidos.libreta();
  },

  formulario() {
    UI.pantalla('crear');
    document.getElementById('nombreNuevo').value = '';
    this.nivel = null; this.control = null;
    document.querySelectorAll('#crear .elige').forEach(b => b.classList.remove('elegido'));
  },

  prepararFormulario() {
    document.querySelectorAll('#crear .elige').forEach(b => {
      b.onclick = () => {
        const grupo = b.dataset.grupo;
        document.querySelectorAll(`#crear .elige[data-grupo="${grupo}"]`)
          .forEach(o => o.classList.remove('elegido'));
        b.classList.add('elegido');
        this[grupo] = b.dataset.v;
      };
    });

    document.getElementById('crearListo').onclick = () => {
      const nombre = document.getElementById('nombreNuevo').value.trim();
      const aviso = document.getElementById('avisoCrear');
      if (!nombre) { aviso.textContent = 'Escribe tu nombre'; return; }
      if (!this.nivel) { aviso.textContent = '¿Cuántos años tienes?'; return; }
      if (!this.control) { aviso.textContent = '¿Cómo quieres moverte?'; return; }
      Estado.crearPerfil(nombre, this.nivel, this.control);
      this.entrarAlMundo(true);
    };

    document.getElementById('crearVolver').onclick = () => {
      this.pintarPerfiles(); UI.pantalla('inicio');
    };

    document.getElementById('volverInicio').onclick = () => {
      UI.pararVoz();
      Sonido.ambienteEncendido(false);
      this.pintarPerfiles();
      UI.pantalla('inicio');
    };
  },

  jugar(i) {
    Estado.usar(i);
    this.entrarAlMundo(false);
  },

  entrarAlMundo(esNueva) {
    UI.pantalla('juego');
    UI.refrescarHud();
    Juego.iniciar();
    if (esNueva) {
      // el regalo de bienvenida, luego la historia y luego el tutorial
      this.regalo(() => this.contarHistoria());
    } else Hada.saludar();
  },

  /* EL REGALO DE BIENVENIDA
     Se entra al juego ya con un complemento puesto. Es lo primero que ven, y
     de paso les dice sin explicar nada que aquí se consiguen cosas. */
  regalo(seguir) {
    const nombre = Estado.actual.regalo;
    if (!nombre) return seguir();

    UI.abrir(`
      <div class="quien">Un regalo para empezar</div>
      <canvas id="lienzoRegalo" width="200" height="250"></canvas>
      <p class="dice">¡Mira lo que había en tu cabaña!<br>
         Te has encontrado <b>${nombre}</b> y ya lo llevas puesto.</p>
      <p class="pista">En el espejo de tu casa te lo puedes quitar y poner. Y en la tienda de Mila
         hay muchísimos más.</p>
      <div class="botones"><button class="btn defecto" id="seguirRegalo">¡Qué chulo!<span class="tecla">espacio</span></button></div>
    `);
    const c = document.getElementById('lienzoRegalo');
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#EAF6F6';
    ctx.beginPath(); ctx.roundRect(10, 10, c.width - 20, c.height - 20, 90); ctx.fill();
    Avatar.dibujar(ctx, c.width / 2, c.height - 26, 2.2, Estado.actual.look, 1, 0);
    Sonido.moneda();
    document.getElementById('seguirRegalo').onclick = () => { Sonido.clic(); seguir(); };
  },

  contarHistoria() {
    {
      let paso = 0;
      const contar = () => {
        if (paso < TEXTOS.historia.length) {
          UI.dialogo(null, TEXTOS.historia[paso++], [{ texto: 'Sigue', accion: contar }]);
        } else {
          Hada.presentarse();
        }
      };
      contar();
    }
  },
};

addEventListener('DOMContentLoaded', () => {
  Inicio.iniciar();
  Inicio.prepararFormulario();
});

</script>
</body>
</html>
