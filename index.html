                          this.pintarPanel(dueno, titulo, idLienzo, pie); });
    UI.modal.querySelectorAll('.opcion').forEach(b =>
      b.onclick = () => {
        Sonido.clic();
        p.look[dueno.seccion === 'pieles' ? 'piel' : sec.campo] = b.dataset.v;
        Estado.guardar();
        this.pintarPanel(dueno, titulo, idLienzo, pie);
      });
    document.getElementById('volverCasa').onclick = () => { Sonido.clic(); Casa.abrir(); };
  },

  /* EL DIBUJITO DE CADA PRENDA
     Vale más que el nombre: se ve cómo le quedaría puesto. Es lo que hace que
     una quiera juntar conchas para llevarse ese y no otro. */
  /* SIEMPRE EN COLOR (12-09-2026, lo pidió Gala). Antes, lo que aún no era
     suyo salía casi en blanco y negro, y se compraba una prenda preciosa cuyo
     color luego no gustaba. Ahora todo se ve tal cual es y lo que marca si ya
     la tienes es la chapa ✓ y el marco verde, no el color. */
  miniatura(o) {
    return `<canvas class="prevista" data-p="${o.id}" width="96" height="124"></canvas>`;
  },

  /* ¿ESTO YA ES SUYO? (vale para ropa y para mascotas) */
  esSuyoItem(seccion, o) {
    return seccion === 'mascotas' ? Estado.tieneMascota(o.id) : Estado.tiene(o);
  },

  /* CUÁNTAS TIENE DE CADA COSA (lo pidió Gala, 12-09-2026)
     Saber «6 de 18» convierte el armario en una colección, y una colección a
     medias pide que la acabes. Cuenta TODO lo que existe en el juego de esa
     estantería, lo que se compra y lo que se gana. */
  cuantas(seccion, grupo) {
    const lista = ROPA[seccion];
    if (!Array.isArray(lista)) return { tengo: 0, total: 0 };
    const grupos = GRUPOS[seccion];
    const dentro = lista.filter(o => o.id && (!grupo ||
      (o.grupo || (grupos && grupos[0].id)) === grupo));
    return { tengo: dentro.filter(o => this.esSuyoItem(seccion, o)).length,
             total: dentro.length };
  },

  /* La fila de arriba: cuántas tiene de cada estantería, y el total */
  resumen(secciones, actual) {
    const contables = secciones.filter(s => Array.isArray(ROPA[s.id]));
    if (!contables.length) return '';
    let tengo = 0, total = 0;
    const chips = contables.map(s => {
      const c = this.cuantas(s.id);
      tengo += c.tengo; total += c.total;
      return `<span class="cuenta-chip ${s.id === actual ? 'activa' : ''}">${s.titulo}
                <b>${c.tengo}/${c.total}</b></span>`;
    }).join('');
    return `<div class="cuentas">${chips}
              <span class="cuenta-chip total">En total <b>${tengo}/${total}</b></span>
            </div>`;
  },

  /* LAS ESTANTERÍAS
     Una lista larga y seguida no se mira; una lista con rótulos, sí. Cada
     grupo de GRUPOS sale con su título, cuántas tiene de ese estilo y sus
     prendas debajo. */
  lista(seccion, items, boton) {
    const grupos = GRUPOS[seccion];
    if (!grupos) return items.map(boton).join('');
    return grupos.map(g => {
      const dentro = items.filter(o => (o.grupo || grupos[0].id) === g.id);
      if (!dentro.length) return '';
      const c = this.cuantas(seccion, g.id);
      return `<h4 class="grupo-titulo">${g.titulo}
                <small>${c.tengo} de ${c.total}</small></h4>` + dentro.map(boton).join('');
    }).join('');
  },

  dibujarMiniaturas(seccion, campo) {
    if (!UI.modal) return;
    UI.modal.querySelectorAll('.prevista').forEach(c => {
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      if (seccion === 'mascotas') {
        Avatar.dibujarMascota(ctx, c.width / 2, c.height - 26, 1.9, c.dataset.p, 1, 0);
      } else {
        const look = Object.assign({}, Estado.actual.look);
        look[seccion === 'pieles' ? 'piel' : campo] = c.dataset.p;
        Avatar.dibujar(ctx, c.width / 2, c.height - 8, 1.25, look, 1, 0);
      }
    });
  },

  /* DEJAR ALGO EN GRIS, como los cromos que faltan del Cuaderno de Manitas.
     (En la tienda ya no se usa: allí todo se ve en color.) */
  apagar(ctx, ancho, alto) {
    try {
      const img = ctx.getImageData(0, 0, ancho, alto);
      const px = img.data;
      for (let i = 0; i < px.length; i += 4) {
        const gris = px[i] * 0.30 + px[i + 1] * 0.59 + px[i + 2] * 0.11;
        px[i]     += (gris - px[i]) * 0.85;
        px[i + 1] += (gris - px[i + 1]) * 0.85;
        px[i + 2] += (gris - px[i + 2]) * 0.85;
      }
      ctx.putImageData(img, 0, 0);
    } catch (e) { /* si el navegador no deja leer el dibujo, se queda en color */ }
  },

  dibujarEspejo(id) {
    const c = document.getElementById(id);
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#EAF6F6';
    ctx.beginPath(); ctx.roundRect(10, 10, c.width - 20, c.height - 20, 90); ctx.fill();
    Avatar.dibujar(ctx, c.width / 2, c.height - 30, 2.4, Estado.actual.look, 1, 0);
  },
};

  },

  /* EL CALENTAMIENTO: antes de cada cosa del día, algo de un segundo. A las
     mayores, una tabla de multiplicar; a las pequeñas, una suma; y a veces una
     palabra con b o v. Fallar no cuenta: se prueba otra. */
  calentar(seguir) {
    const nivel = Estado.actual.nivel, mayor = nivel === 'mayor';
    const palabra = Math.random() < 0.35 && palabrasPara(nivel, 1, true, 'b/v')[0];
    let arriba, opciones, sol;
    if (palabra) {
      arriba = '<p class="dice">' + palabra.frase.replace('___',
        '<b>' + palabra.inicio + '<span class="hueco">?</span>' + palabra.fin + '</b>') + '</p>';
      opciones = palabra.opciones; sol = palabra.correcta;
    } else {
      const a = AZ(2, 9), b = mayor ? AZ(2, 9) : AZ(1, 9);
      const bien = mayor ? a * b : a + b;
      const vecinos = mayor ? [a * (b + 1), a * (b - 1), (a + 1) * b] : [bien + 1, bien - 1, bien + 2];
      const malos = barajar([...new Set(vecinos)].filter(n => n > 0 && n !== bien)).slice(0, 2);
      sol = String(bien);
      opciones = barajar([sol].concat(malos.map(String)));
      arriba = '<p class="cuenta-grande">' + a + (mayor ? ' × ' : ' + ') + b + '</p>';
    }
    UI.abrir(`
      <div class="quien">Mientras te arreglas…</div>
      ${arriba}
      <div class="botones grandes">
        ${opciones.map(o => `<button class="btn num" data-v="${o}">${o}</button>`).join('')}
      </div>
      <p class="pista" id="pista"></p>
    `);
    UI.modal.querySelectorAll('.num').forEach(b => {
      b.onclick = () => {
        if (b.dataset.v === sol) { b.classList.add('bien'); Sonido.acierto(); setTimeout(seguir, 600); return; }
        b.classList.add('mal'); b.disabled = true;
        Sonido.fallo();
        document.getElementById('pista').textContent = palabra ? '💭 ' + palabra.pista : 'Casi. Prueba otra.';
      };
    });
  },

  hacer(c, calentado) {
    if (!calentado && novedad('calentamiento') && !Estado.hizoRutina(c.id)) return this.calentar(() => this.hacer(c, true));
    Sonido[c.sonido]();
    const primera = Estado.apuntarRutina(c.id);
    let texto = c.texto;

    if (primera) {
      Estado.darConchas(AJUSTES.conchasPorRutina);
      texto += '<br><br>🐚 <b>+' + AJUSTES.conchasPorRutina + ' concha</b>';
      if (Estado.rutinasDeHoy().length === this.cosas.length) {
        Estado.darConchas(AJUSTES.conchasPorRutinasTodas);
        texto += '<br>✨ <b>¡Las cuatro cosas! +' + AJUSTES.conchasPorRutinasTodas +
                 ' conchas de propina</b>';
        setTimeout(() => Sonido.fiesta(), 300);
      } else setTimeout(() => Sonido.moneda(), 300);
      UI.refrescarHud();
    } else {
      texto += '<br><br><small>Esto ya lo has hecho hoy, pero por repetir no pasa nada.</small>';
    }

    UI.dialogo(c.icono + ' ' + c.nombre, texto, [
      { texto: 'Seguir', accion: () => this.abrir() },
    ]);
  },
};

/* ==================================================== LOS CUADERNOS =====
   Tres cuadernos en uno, con pestañas, para que quepa en una sola cabeza:
     🧠 Cabeza   → las formas de problema resueltas, y su regla
     🔧 Manitas  → las cosas de la isla que ha puesto en marcha
     🤝 Vecinos  → la gente a la que le ha devuelto lo suyo
   Los tres funcionan igual: lo conseguido a color, lo que falta apagado y
   con una pista. Un cuaderno a medias tira mucho más que uno vacío. */
const Cuadernos = {

  pestana: 'cabeza',

  hojas: [
    { id: 'cabeza',  titulo: '🧠 Cabeza' },
    { id: 'manitas', titulo: '🔧 Manitas' },
    { id: 'vecinos', titulo: '🤝 Vecinos' },
  ],

  abrir(cual) {
    if (cual) this.pestana = cual;
    const p = this['hoja_' + this.pestana]();
    const pestanas = this.hojas.map(h =>
      `<button class="pestana ${h.id === this.pestana ? 'activa' : ''}" data-s="${h.id}">${h.titulo}</button>`
    ).join('');

    UI.abrir(`
      <div class="quien">📔 Mis cuadernos</div>
      <div class="pestanas">${pestanas}</div>
      <p class="contador">${p.cuenta}</p>
      <div class="album">${p.fichas}</div>
      <p class="pista">${p.pie}</p>
      <div class="botones"><button class="btn gris" id="cerrarCuadernos">Cerrar</button></div>
    `);

    UI.modal.querySelectorAll('.pestana').forEach(b =>
      b.onclick = () => { Sonido.clic(); this.abrir(b.dataset.s); });
    document.getElementById('cerrarCuadernos').onclick = () => { Sonido.clic(); UI.cerrar(); };
    if (p.despues) p.despues();
  },

  /* 🧠 LAS FORMAS DE PROBLEMA. Al tocar una pegatina conseguida sale su
     regla: la teoría llega después de haberlo hecho, nunca antes. */
  hoja_cabeza() {
    const hechos = Estado.actual.problemas || {};
    const tipos = [...new Set((PROBLEMAS[Estado.actual.nivel] || []).map(x => x.tipo))];
    const tengo = tipos.filter(t => hechos[t]).length;
    const fichas = tipos.map(t => {
      const pg = PEGATINAS[t] || { icono: '⭐', nombre: t };
      const n = hechos[t] || 0;
      if (!n) return '<div class="cromo falta"><span class="cara">?</span>' +
                     `<b>¿?</b><small>${pg.nombre}</small></div>`;
      const clase = n >= 6 ? 'oro' : n >= 3 ? 'plata' : 'hecho';
      const cuenta = n >= 6 ? '🏅 ¡De oro!' : n >= 3 ? '⭐ ' + n + ' de 6 para el oro'
                                                     : n + ' de 3 para la estrella';
      return `<button class="cromo ${clase} regla" data-t="${t}">
                <span class="cara">${pg.icono}</span>
                <b>${pg.nombre}</b><small>${cuenta}</small></button>`;
    }).join('');
    return {
      cuenta: `Tienes <b>${tengo}</b> de <b>${tipos.length}</b> pegatinas`,
      fichas,
      pie: 'Cada forma de problema que resuelves te da su pegatina. ' +
           '<b>Toca una que ya tengas</b> y te cuenta su regla.',
      despues: () => UI.modal.querySelectorAll('.regla').forEach(b =>
        b.onclick = () => {
          Sonido.clic();
          const pg = PEGATINAS[b.dataset.t];
          UI.dialogo(pg.icono + ' ' + pg.nombre, pg.regla, [
            { texto: '← Volver al cuaderno', accion: () => this.abrir('cabeza') },
          ]);
        }),
    };
  },

  /* 🔧 LAS COSAS ARREGLADAS */
  hoja_manitas() {
    const hechos = MUNDO.piezas.filter(p => Estado.estaEncajado(p.encaja)).length;
    const fichas = MUNDO.piezas.map(p => {
      if (Estado.estaEncajado(p.encaja))
        return `<div class="cromo hecho"><span class="cara">${p.icono}</span>
                <b>${p.arreglo}</b><small>${p.nombre}</small></div>`;
      if (Estado.llevaPieza(p.id))
        return `<div class="cromo llevo"><span class="cara">${p.icono}</span>
                <b>${p.nombre}</b><small>🎒 Lo llevas encima.<br>${p.pista}</small></div>`;
      return `<div class="cromo falta"><span class="cara">🔩</span>
              <b>¿?</b><small>${p.pista}</small></div>`;
    }).join('');
    return {
      cuenta: `Has arreglado <b>${hechos}</b> de <b>${MUNDO.piezas.length}</b> cosas de la isla`,
      fichas,
      pie: 'Por la isla hay cosas rotas o paradas. La pieza que les falta está tirada en otro ' +
           'sitio cualquiera: cógela y llévala donde toque. Para saber dónde va, <b>lee lo que ' +
           'cuenta cada sitio</b>: ahí está la pista.',
    };

  /* 🤝 LA GENTE A LA QUE HA AYUDADO */
  hoja_vecinos() {
    const hechos = RAREZAS.filter(r => Estado.yaEntregado(r.id)).length;
    const fichas = RAREZAS.map(r => {
      const quien = (MUNDO.lugares.find(l => l.id === r.para) || {});
      if (Estado.yaEntregado(r.id))
        return `<div class="cromo hecho"><span class="cara">${r.icono}</span>
                <b>${quien.personaje || quien.nombre || '¡Entregado!'}</b>
                <small>${r.nombre}</small></div>`;
      if (Estado.tieneRareza(r.id))
        return `<div class="cromo llevo"><span class="cara">${r.icono}</span>
                <b>${r.nombre}</b><small>🎒 Lo llevas encima.<br>${r.pista}</small></div>`;
      return `<div class="cromo falta"><span class="cara">📦</span>
              <b>¿?</b><small>${r.pista}</small></div>`;
    }).join('');
    return {
      cuenta: `Has devuelto lo suyo a <b>${hechos}</b> de <b>${RAREZAS.length}</b> vecinos`,
      fichas,
      pie: 'Los objetos raros que encuentras <b>no son adornos: son de alguien</b>. Lee lo que ' +
           'pone en cada uno y piensa a quién de la isla le pega. Al devolvérselo, pasa algo.',
    };
  },
};

/* ===================================================== EL COFRE =========
   Recompensa variable: a veces, después de leer bien a la primera, aparece
   un cofre. Nunca se sabe cuándo ni qué trae, y siempre es algo modesto. */
const Cofre = {

  toca() { return novedad('cofre') && Math.random() < AJUSTES.cofre.probabilidad; },

  abrir(seguir) {
    Sonido.cristal();
    UI.abrir(`
      <div class="quien">¡Un cofre!</div>
      <p class="cuenta-grande">🧰</p>
      <p class="dice">Como lo has leído bien a la primera, ha aparecido un cofre.</p>
      <div class="botones"><button class="btn defecto" id="abrirCofre">Abrirlo<span class="tecla">espacio</span></button></div>
    `);
    document.getElementById('abrirCofre').onclick = () => {
      Sonido.clic();
      const dentro = this.sacar();
      Sonido.fiesta();
      UI.refrescarHud();
      UI.abrir(`
        <div class="quien">Dentro del cofre…</div>
        <p class="cuenta-grande">✨</p>
        <p class="dice">${dentro}</p>
        <div class="botones"><button class="btn defecto" id="cerrarCofre">¡Bien!<span class="tecla">espacio</span></button></div>
      `);
      document.getElementById('cerrarCofre').onclick = () => { Sonido.clic(); seguir(); };
    };
  },

  /* Unas conchas, o una prenda barata de la tienda que aún no tiene */
  sacar() {
    const c = AJUSTES.cofre;
    const prendas = Object.keys(ROPA).filter(k => k !== 'mascotas' && Array.isArray(ROPA[k]))
      .flatMap(k => ROPA[k])
      .filter(o => typeof o.precio === 'number' && o.precio > 0 && o.precio <= c.precioMaxPrenda &&
                   !Estado.tiene(o));
    if (prendas.length && Math.random() < c.probPrenda) {
      const o = prendas[Math.floor(Math.random() * prendas.length)];
      Estado.dar(o.id);
      return '🎁 <b>' + o.nombre + '</b><br><small>Ya es tuyo: póntelo en el espejo de tu casa.</small>';
    }
    const n = AZ(c.conchas[0], c.conchas[1]);
    Estado.darConchas(n);
    return '🐚 <b>+' + n + ' conchas</b>';
  },
};

/* ================================================ TEO, EL REPARTIDOR =====
   Teo trae las cosas nuevas a la tienda de Mila. De vez en cuando pasa por
   allí y pregunta si quieren pedirle algo, y ellas le pueden dejar escrito lo
   que les gustaría que hubiera.

   IMPORTANTE, para que no haya malentendidos: la petición se guarda EN EL
   APARATO donde juegan, porque el juego es una página web sin servidor. No se
   envía a ningún sitio ni la ve nadie más. Antonio las lee desde la pantalla
   de inicio, en «📦 peticiones». */
const Pedidos = {

  /* ¿Está Teo hoy en la tienda? Si nunca han pedido nada, siempre; y si ya han
     pedido, una de cada tres veces, para que siga siendo un encuentro. */
  estaTeo() {
    const p = Estado.actual;
    if (!p.pedidos || !p.pedidos.length) return true;
    if (this._hoy === undefined) this._hoy = Math.random() < 0.34;
    return this._hoy;
  },

  cartel() {
    if (!this.estaTeo()) {
      return '<p class="pista"><button class="enlace" id="abrirPedido">📦 dejarle una petición a Teo</button></p>';
    }
    return `
      <div class="aviso-tienda" style="text-align:left">
        <b>📦 Teo, el repartidor:</b> «¡Buenas! Mañana salgo a buscar género para Mila.
        Si se te ocurre algo que te gustaría que hubiera en la tienda, escríbemelo y lo miro.»
        <div style="margin-top:8px"><button class="btn" id="abrirPedido">Pedirle algo a Teo</button></div>
      </div>`;
  },

  engancharBoton() {
    const b = document.getElementById('abrirPedido');
    if (b) b.onclick = () => { Sonido.clic(); this.formulario(); };
  },

  formulario() {
    UI.abrir(`
      <div class="quien">Teo, el repartidor</div>
      <p class="dice">¿Qué te gustaría que hubiera en la tienda?</p>
      <p class="pista">Un peinado, una mascota, un complemento, una zona nueva de la isla…
         lo que se te ocurra. Escríbelo como quieras.</p>
      <textarea id="textoPedido" rows="4" maxlength="400"
                placeholder="Me gustaría que hubiera…"></textarea>
      <p class="pista" id="avisoPedido"></p>
      <div class="botones">
        <button class="btn defecto" id="darPedido">Dárselo a Teo</button>
        <button class="btn gris" id="dejarPedido">Ahora no</button>
      </div>
    `);
    const caja = document.getElementById('textoPedido');
    caja.focus();
    document.getElementById('dejarPedido').onclick = () => { Sonido.clic(); Tienda.pintar(); };
    document.getElementById('darPedido').onclick = () => {
      const texto = caja.value.trim();
      if (!texto) {
        document.getElementById('avisoPedido').textContent = 'Escribe algo primero, aunque sea corto.';
        return;
      }
      const p = Estado.actual;
      if (!p.pedidos) p.pedidos = [];
      p.pedidos.push({ texto: texto, fecha: new Date().toISOString(), quien: p.nombre });
      Estado.guardar();
      Sonido.moneda();
      this._hoy = false;
      UI.dialogo('Teo', 'Apuntado. <b>«' + texto.slice(0, 120) + '»</b><br><br>' +
        'Lo llevo en la libreta y lo miro con Mila. No prometo nada, ¡pero se hace lo que se puede!', [
        { texto: 'Gracias, Teo', accion: () => Tienda.pintar() },
      ]);
    };
  },

  /* La libreta de Teo: aquí las lee Antonio */
  cuantas() {
    return (Estado.perfiles || []).reduce((n, p) => n + ((p.pedidos || []).length), 0);
  },

  libreta() {
    const todas = [];
    (Estado.perfiles || []).forEach(p => (p.pedidos || []).forEach(x => todas.push(x)));
    todas.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));

    const filas = todas.length ? todas.map(x => {
      const f = new Date(x.fecha);
      const cuando = isNaN(f) ? '' : f.toLocaleDateString('es-ES',
        { day: 'numeric', month: 'long' }) + ', ' + f.toLocaleTimeString('es-ES',
        { hour: '2-digit', minute: '2-digit' });
      return `<div class="rareza"><div><b>${x.quien || ''}</b>
              <small>${cuando}</small><br>${x.texto.replace(/</g, '&lt;')}</div></div>`;
    }).join('') : '<p class="pista">Todavía no le han pedido nada a Teo.</p>';

    UI.abrir(`
      <div class="quien">La libreta de Teo</div>
      <p class="pista">Lo que han pedido para la tienda. Se guarda <b>solo en este aparato</b>:
         el juego no envía nada a ningún sitio.</p>
      <div class="rarezas">${filas}</div>
      <div class="botones">
        <button class="btn" id="copiarPedidos">Copiar todo</button>
        <button class="btn gris" id="cerrarLibreta">Cerrar</button>
      </div>
    `);
    document.getElementById('cerrarLibreta').onclick = () => UI.cerrar();
    document.getElementById('copiarPedidos').onclick = (ev) => {
      const texto = todas.map(x => '· [' + (x.quien || '') + '] ' + x.texto).join('\n');
      try { navigator.clipboard.writeText(texto); ev.target.textContent = '¡Copiado!'; }
      catch (e) { ev.target.textContent = 'No se ha podido copiar'; }
    };
  },
};

<script>
/* === motor/mapa.js === */
/* EL MAPA DE LA ISLA
   Se abre con la tecla M o con el botón 🗺. Lo que ya ha visitado sale con su
   nombre y su color; lo que no, en gris y con una interrogación, para que sepa
   que ahí hay algo y le entren ganas de ir. */

const Mapa = {

  ANCHO: 660, ALTO: 450,

  abrir() {
    const total = MUNDO.lugares.length;
    const vistos = MUNDO.lugares.filter(p => Estado.estaDescubierto(p.id)).length;

    UI.abrir(`
      <div class="quien">Mapa de la isla</div>
      <canvas id="mapaLienzo" width="${this.ANCHO}" height="${this.ALTO}"></canvas>
      <p class="contador">Has encontrado <b>${vistos}</b> de <b>${total}</b> sitios</p>
      <p class="pista">🏠 casa · 🛒 tienda · 🎲 juegos · 🐾 animalario · 🎡 feria · 💡 el Farol<br>
      Lo <b>oscuro</b> es lo que todavía no has pisado: camina por ahí y se irá abriendo.</p>
      <div class="botones"><button class="btn defecto" id="cerrarMapa">Seguir explorando<span class="tecla">espacio</span></button></div>
    `);
    document.getElementById('cerrarMapa').onclick = () => UI.cerrar();
    this.pintar();
  },

  pintar() {
    const c = document.getElementById('mapaLienzo');
    if (!c) return;
    const ctx = c.getContext('2d');
    const k = Math.min(this.ANCHO / MUNDO.ancho, this.ALTO / MUNDO.alto);
    const dx = (this.ANCHO - MUNDO.ancho * k) / 2;
    const dy = (this.ALTO - MUNDO.alto * k) / 2;
    const X = x => dx + x * k, Y = y => dy + y * k;

    // mar y contorno de la isla
    ctx.fillStyle = '#BFE9F2';
    ctx.fillRect(0, 0, this.ANCHO, this.ALTO);
    const i = MUNDO.isla;
    ctx.fillStyle = '#F3E3B8';
    ctx.beginPath(); ctx.ellipse(X(i.cx), Y(i.cy), i.rx * k, i.ry * k, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#C7E6B4';
    ctx.beginPath(); ctx.ellipse(X(i.cx), Y(i.cy), (i.rx - 95) * k, (i.ry - 80) * k, 0, 0, 7); ctx.fill();

    // el río
    ctx.fillStyle = '#9BD9E8';
    ctx.save();
    ctx.beginPath(); ctx.ellipse(X(i.cx), Y(i.cy), i.rx * k, i.ry * k, 0, 0, 7); ctx.clip();
    ctx.fillRect(X(MUNDO.rio.x1), 0, (MUNDO.rio.x2 - MUNDO.rio.x1) * k, this.ALTO);
    ctx.restore();

    /* LA NIEBLA: lo que todavía no conoce se queda a oscuras. Se abren claros
       por donde ha caminado y alrededor de los sitios que ya ha encontrado. */
    const niebla = document.createElement('canvas');
    niebla.width = this.ANCHO; niebla.height = this.ALTO;
    const nx = niebla.getContext('2d');
    nx.fillStyle = 'rgba(24,34,58,0.74)';
    nx.fillRect(0, 0, this.ANCHO, this.ALTO);
    nx.globalCompositeOperation = 'destination-out';

    const claro = (cx, cy, r) => {
      const g = nx.createRadialGradient(cx, cy, r * 0.35, cx, cy, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      nx.fillStyle = g;
      nx.beginPath(); nx.arc(cx, cy, r, 0, 7); nx.fill();
    };

    const visitadas = Estado.actual.visitadas || {};
    const lado = Estado.CASILLA * k;
    Object.keys(visitadas).forEach(clave => {
      const c = clave.split(',');
      claro(X((+c[0] + 0.5) * Estado.CASILLA), Y((+c[1] + 0.5) * Estado.CASILLA), lado * 1.5);
    });
    MUNDO.lugares.forEach(p => {
      if (Estado.estaDescubierto(p.id)) claro(X(p.x), Y(p.y), lado * 1.8);
    });
    if (Juego.jugador) claro(X(Juego.jugador.x), Y(Juego.jugador.y), lado * 1.6);

    ctx.drawImage(niebla, 0, 0);

    // el recinto de la feria
    MUNDO.recintos.forEach(r => {
      ctx.strokeStyle = 'rgba(232,80,107,0.75)'; ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.ellipse(X(r.x), Y(r.y), r.rx * k, r.ry * k, 0, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    });

    // los sitios, por encima de la niebla
    ctx.textAlign = 'center';
    MUNDO.lugares.forEach(p => {
      const visto = Estado.estaDescubierto(p.id);
      const x = X(p.x), y = Y(p.y);

      let color = '#9AA0A6';
      if (visto) {
        if (p.accion === 'reto' || p.accion === 'letras')
          color = Estado.tieneCristal(p.id) ? '#4FA96B' : '#E8A33D';
        else if (p.accion === 'armario' || p.accion === 'tienda') color = '#D96C9A';
        else if (p.accion === 'animalario') color = '#8CBF6A';
        else if (p.accion === 'juego') color = '#5AA9DC';
        else if (p.accion === 'meta') color = '#E8C33D';
        else color = '#7FA9C9';
      }

      /* Los sitios a los que hay que volver una y otra vez llevan su icono,
         para reconocerlos de un vistazo. Los demás, un punto de color. */
      const ICONO_MAPA = { cabana: '🏠', tienda: '🛒', animalario: '🐾', salon: '🎲',
                           farol: '💡', taquilla: '🎡', elefantes: '🐘', ponis: '🐴',
                           ovejas: '🐑' };
      const icono = ICONO_MAPA[p.id];

      if (icono && visto) {
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.stroke();
        ctx.font = '17px system-ui';
        ctx.fillText(icono, x, y + 6);
      } else {
        ctx.fillStyle = visto ? 'rgba(255,255,255,0.9)' : 'rgba(120,140,180,0.55)';
        ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fill();
        ctx.fillStyle = visto ? color : '#5A6B8C';
        ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill();
      }

      ctx.font = visto ? 'bold 12px system-ui, sans-serif' : 'bold 14px system-ui, sans-serif';
      if (visto) {
        ctx.fillStyle = '#2F2A28';
        const nombre = p.mapa || p.nombre;
        const ancho = ctx.measureText(nombre).width;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(x - ancho / 2 - 4, y + 12, ancho + 8, 16);
        ctx.fillStyle = '#2F2A28';
        ctx.fillText(nombre, x, y + 24);
      } else {
        ctx.fillStyle = '#DCE4F2';
        ctx.fillText('?', x, y + 5);
      }
    });

    // los secretos que ya ha encontrado
    MUNDO.secretos.forEach(s => {
      if (!Estado.tieneSecreto(s.id)) return;
      ctx.font = '16px system-ui';
      ctx.fillText('✨', X(s.x), Y(s.y) + 5);
    });

    // dónde está ahora
    const j = Juego.jugador;
    if (j) {
      ctx.fillStyle = '#E8506B';
      ctx.beginPath(); ctx.arc(X(j.x), Y(j.y), 6, 0, 7); ctx.fill();
      ctx.strokeStyle = '#E8506B'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(j.x), Y(j.y), 11, 0, 7); ctx.stroke();
      ctx.fillStyle = '#E8506B'; ctx.font = 'bold 11px system-ui';
      ctx.fillText('aquí estás', X(j.x), Y(j.y) - 16);
    }
  },
};

</script>

  },

  pintar() {
    const p = this.pasos[this.paso];
    const ultimo = this.paso === this.pasos.length - 1;

    UI.abrir(`
      <div class="tuto-icono">${p.icono}</div>
      <div class="quien">${p.titulo}</div>
      <p class="dice">${p.texto}</p>
      <div class="altavoz" id="zonaVoz"></div>
      <div class="tuto-puntos">${this.pasos.map((_, i) =>
        `<span class="punto ${i === this.paso ? 'activo' : ''}"></span>`).join('')}</div>
      <div class="botones">
        ${this.paso > 0 ? '<button class="btn gris" id="atras">Atrás</button>' : ''}
        <button class="btn defecto" id="siguiente">${ultimo ? '¡A jugar!' : 'Siguiente'}<span class="tecla">espacio</span></button>
      </div>
      <p class="pista">Paso ${this.paso + 1} de ${this.pasos.length}</p>
    `, () => this.terminar());

    UI.prepararAltavoz(p.titulo + '. ' + p.texto.replace(/<[^>]*>/g, ' '));

    document.getElementById('siguiente').onclick = () => {
      Sonido.clic();
      if (ultimo) return this.terminar();
      this.paso++;
      this.pintar();
    };
    const atras = document.getElementById('atras');
    if (atras) atras.onclick = () => { Sonido.clic(); this.paso--; this.pintar(); };
  },

  terminar() {
    UI.cerrar();
    if (Estado.actual) { Estado.actual.tutorialVisto = true; Estado.guardar(); }
    if (this.alTerminar) { const f = this.alTerminar; this.alTerminar = null; f(); }
  },
};

<script>
/* === motor/musica.js === */
/* LA MÚSICA

   Melodías de las de consola antigua, fabricadas nota a nota por el navegador:
   ni un archivo de audio. Cada sitio tiene la suya y cambia sola al llegar.

   Para que no cansen (que es el peligro de este tipo de música):
   - suenan bajito, por debajo de los efectos;
   - las melodías son largas y con silencios, no un bucle de dos segundos;
   - en los retos casi no hay melodía, para no distraer de la cuenta;
   - el botón 🔊 de siempre las apaga todas.

   Las notas van por su nombre. Cambiar una melodía es cambiar su lista. */

const NOTAS = {
  '-': 0,
  do3: 130.8, re3: 146.8, mi3: 164.8, fa3: 174.6, sol3: 196.0, la3: 220.0, si3: 246.9,
  do: 261.6, re: 293.7, mi: 329.6, fa: 349.2, sol: 392.0, la: 440.0, si: 493.9,
  do4: 523.3, re4: 587.3, mi4: 659.3, fa4: 698.5, sol4: 784.0, la4: 880.0, si4: 987.8,
  do5: 1046.5, re5: 1174.7, mi5: 1318.5, sol5: 1568.0,
};

const TEMAS = {

  // La isla: tranquila y espaciada, para que se pueda estar mucho rato
  isla: { tempo: 0.42, onda: 'triangle', vol: 0.055,
    melodia: ['do4','-','mi4','-','sol4','-','mi4','-', 'fa4','-','mi4','-','re4','-','-','-',
              'mi4','-','sol4','-','la4','-','sol4','-', 'mi4','-','re4','-','do4','-','-','-'],
    bajo:    ['do3','-','-','-','sol3','-','-','-', 'fa3','-','-','-','sol3','-','-','-',
              'do3','-','-','-','mi3','-','-','-', 'fa3','-','-','-','sol3','-','-','-'] },

  // La feria: un vals de tiovivo, alegre y con chispa
  feria: { tempo: 0.20, onda: 'square', vol: 0.05,
    melodia: ['do4','mi4','sol4','mi4','do5','-','sol4','-', 'la4','fa4','la4','do5','si4','-','sol4','-',
              'do5','si4','la4','sol4','fa4','mi4','re4','-', 'do4','mi4','sol4','do5','sol4','mi4','do4','-'],
    bajo:    ['do3','-','sol3','-','do3','-','sol3','-', 'fa3','-','do3','-','sol3','-','sol3','-',
              'do3','-','sol3','-','fa3','-','sol3','-', 'do3','-','sol3','-','do3','-','-','-'] },

  // Los retos: casi solo un pulso, para no molestar mientras se piensa
  reto: { tempo: 0.55, onda: 'sine', vol: 0.035,
    melodia: ['la3','-','-','-','do4','-','-','-', 'si3','-','-','-','la3','-','-','-'],
    bajo:    ['la3','-','-','-','-','-','-','-', 'fa3','-','-','-','-','-','-','-'] },

  // La casa y la tienda: cálida y corta
  casa: { tempo: 0.34, onda: 'triangle', vol: 0.05,
    melodia: ['sol4','la4','si4','-','la4','sol4','-','-', 'mi4','sol4','la4','-','sol4','-','-','-',
              'si4','la4','sol4','-','mi4','re4','-','-', 'sol4','-','mi4','-','do4','-','-','-'],
    bajo:    ['do3','-','-','-','sol3','-','-','-', 'la3','-','-','-','mi3','-','-','-',
              'fa3','-','-','-','do3','-','-','-', 'sol3','-','-','-','do3','-','-','-'] },

  // El bosque de las sombras: grave, misteriosa, sin dar miedo de verdad
  bosque: { tempo: 0.62, onda: 'sine', vol: 0.05,
    melodia: ['la3','-','do4','-','mi4','-','-','-', 'fa4','-','mi4','-','do4','-','-','-',
              'si3','-','re4','-','fa4','-','-','-', 'mi4','-','do4','-','la3','-','-','-'],
    bajo:    ['la3','-','-','-','-','-','-','-', 'fa3','-','-','-','-','-','-','-',
              'sol3','-','-','-','-','-','-','-', 'la3','-','-','-','-','-','-','-'] },

  // Yendo en algo: rítmica y con marcha
  paseo: { tempo: 0.17, onda: 'square', vol: 0.05,
    melodia: ['do4','do4','sol4','sol4','la4','la4','sol4','-', 'fa4','fa4','mi4','mi4','re4','re4','do4','-',
              'sol4','sol4','fa4','fa4','mi4','mi4','re4','-', 'do4','mi4','sol4','do5','sol4','mi4','do4','-'],
    bajo:    ['do3','-','do3','-','sol3','-','sol3','-', 'fa3','-','fa3','-','sol3','-','sol3','-',
              'do3','-','do3','-','mi3','-','mi3','-', 'fa3','-','sol3','-','do3','-','-','-'] },

  // El Farol: solemne y bonita, para el final del juego
  farol: { tempo: 0.46, onda: 'triangle', vol: 0.055,
    melodia: ['do4','-','sol4','-','do5','-','-','-', 'si4','-','sol4','-','mi4','-','-','-',
              'fa4','-','do5','-','la4','-','-','-', 'sol4','-','mi4','-','do4','-','-','-'],
    bajo:    ['do3','-','-','-','sol3','-','-','-', 'mi3','-','-','-','sol3','-','-','-',
              'fa3','-','-','-','do3','-','-','-', 'sol3','-','-','-','do3','-','-','-'] },
};

const Musica = {

  tema: null,
  nombre: null,
  paso: 0,
  reloj: null,

  /* Pone un tema. Si ya está sonando ese, no hace nada. */
  poner(nombre) {
    if (this.nombre === nombre) return;
    this.nombre = nombre;
    this.tema = TEMAS[nombre] || null;
    this.paso = 0;
    this.arrancar();
  },

  parar() {
    this.nombre = null;
    this.tema = null;
    clearTimeout(this.reloj);
  },

  arrancar() {
    clearTimeout(this.reloj);
    if (!this.tema || !Sonido.ctx) return;
    this.sonar();
  },

  sonar() {
    if (!this.tema) return;
    const t = this.tema;
    const i = this.paso % t.melodia.length;

    if (Sonido.encendido && !document.hidden) {
      const m = NOTAS[t.melodia[i]];
      if (m) Sonido.nota(m, t.tempo * 1.7, t.onda, t.vol);
      const b = NOTAS[t.bajo[i % t.bajo.length]];
      if (b) Sonido.nota(b, t.tempo * 2.2, 'sine', t.vol * 0.75);
    }

    this.paso++;
    this.reloj = setTimeout(() => this.sonar(), t.tempo * 1000);
  },

  /* Qué música toca según dónde esté la jugadora */
  segunSitio() {
    if (!Sonido.ctx || !Estado.actual) return;
    if (UI.estaAbierto()) return;              // los modales ponen la suya
    const j = Juego.jugador;
    if (!j) return;

    if (Juego.vehiculo) return this.poner('paseo');

    const dentroDe = (z) => z &&
      Math.pow((j.x - z.x) / z.rx, 2) + Math.pow((j.y - z.y) / z.ry, 2) <= 1;

    const feria = MUNDO.recintos.find(r => r.id === 'feria');
    if (dentroDe(feria)) return this.poner('feria');

    const sombras = MUNDO.zonas.find(z => z.tipo === 'tinieblas');
    if (dentroDe(sombras)) return this.poner('bosque');

    const farol = MUNDO.lugares.find(l => l.id === 'farol');
    if (farol && Math.hypot(farol.x - j.x, farol.y - j.y) < 420) return this.poner('farol');

    const casa = MUNDO.lugares.find(l => l.id === 'cabana');
    const tienda = MUNDO.lugares.find(l => l.id === 'tienda');
    if ((casa && Math.hypot(casa.x - j.x, casa.y - j.y) < 230) ||
        (tienda && Math.hypot(tienda.x - j.x, tienda.y - j.y) < 230)) return this.poner('casa');

    this.poner('isla');
  },
};

</script>
<script>
/* === motor/hada.js === */
/* LUMI, EL HADA QUE ACOMPAÑA

   Todo lo que el juego tiene que explicar lo dice Lumi, un hada pequeñita que
   revolotea en una esquina de la pantalla. La idea es que nadie tenga que
   explicarles el juego: lo van descubriendo ellas y Lumi les va contando lo
   que se encuentran, como una amiga que va al lado.

   Lumi nunca manda ni riñe: comenta, se sorprende y anima. */

const Hada = {

  NOMBRE: 'Lumi',
  lienzo: null, ctx: null, globo: null,
  t: 0,
  saltito: 0,
  temporizador: null,
  textoAccion: null,        // lo que hay aquí al lado (se queda mientras estés cerca)
  hablando: false,          // hay una frase suya sonando ahora mismo

  iniciar() {
    this.lienzo = document.getElementById('hadaLienzo');
    if (!this.lienzo) return;
    this.ctx = this.lienzo.getContext('2d');
    this.globo = document.getElementById('hadaGlobo');
    document.getElementById('hada').classList.remove('oculto');
    document.getElementById('hada').onclick = () => Tutorial.abrir();
  },

  /* Lumi dice algo durante unos segundos. Cuando acaba, vuelve a lo que
     hubiera aquí al lado (si es que hay algo). */
  decir(texto, segundos) {
    if (!this.globo) return;
    this.pintarGlobo(texto);
    this.hablando = true;
    this.saltito = 1;
    Sonido.nota(1046, 0.14, 'sine', 0.10);
    Sonido.nota(1568, 0.18, 'sine', 0.07, 0.08);
    clearTimeout(this.temporizador);
    this.temporizador = setTimeout(() => {
      this.hablando = false;
      if (this.textoAccion) this.pintarGlobo(this.textoAccion);
      else this.globo.classList.add('oculto');
    }, (segundos || 6) * 1000);
  },

  /* Lo que se puede hacer aquí mismo. Se queda puesto mientras estés cerca,
     y no pisa lo que Lumi esté diciendo en ese momento. */
  accion(texto) {
    if (!this.globo) return;
    if (this.textoAccion === texto) return;
    this.textoAccion = texto;
    if (!this.hablando) this.pintarGlobo(texto);
  },

  sinAccion() {
    if (!this.globo || this.textoAccion === null) return;
    this.textoAccion = null;
    if (!this.hablando) this.globo.classList.add('oculto');
  },

  pintarGlobo(texto) {
    this.globo.innerHTML = texto;
    this.globo.classList.remove('oculto');
  },

  callar() {
    if (this.globo) this.globo.classList.add('oculto');
    this.textoAccion = null;
    this.hablando = false;
    clearTimeout(this.temporizador);
  },

  /* El dibujo: un hada diminuta con alas que aletean y polvo de estrellas */
  dibujar() {
    if (!this.ctx) return;
    const ctx = this.ctx, W = this.lienzo.width, H = this.lienzo.height;
    this.t += 0.016;
    if (this.saltito > 0) this.saltito = Math.max(0, this.saltito - 0.012);

    ctx.clearRect(0, 0, W, H);
    const cx = W / 2;
    const cy = H / 2 + Math.sin(this.t * 2) * 6 - this.saltito * 14;

    // polvo de hadas
    for (let k = 0; k < 7; k++) {
      const a = this.t * 1.4 + k * 0.9;
      const r = 26 + Math.sin(this.t * 2 + k) * 8;
      ctx.fillStyle = 'rgba(255,236,150,' + (0.25 + Math.sin(this.t * 3 + k) * 0.25) + ')';
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8, 2.4, 0, 7);
      ctx.fill();
    }

    // resplandor
    const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 34);
    g.addColorStop(0, 'rgba(255,240,170,0.55)');
    g.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 34, 0, 7); ctx.fill();

    // alas
    const bat = Math.abs(Math.sin(this.t * 11));
    ctx.fillStyle = 'rgba(190,240,255,0.72)';
    ctx.beginPath(); ctx.ellipse(cx - 11, cy - 6, 6 + bat * 5, 12, -0.6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 11, cy - 6, 6 + bat * 5, 12, 0.6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(215,250,255,0.6)';
    ctx.beginPath(); ctx.ellipse(cx - 9, cy + 5, 4 + bat * 3, 8, -0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 9, cy + 5, 4 + bat * 3, 8, 0.4, 0, 7); ctx.fill();

    // vestido y cuerpo
    ctx.fillStyle = '#7ED6A5';
    ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 4); ctx.lineTo(cx + 5, cy - 4);
    ctx.lineTo(cx + 8, cy + 11); ctx.lineTo(cx - 8, cy + 11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#A8E8C4';
    ctx.beginPath(); ctx.moveTo(cx - 8, cy + 11); ctx.lineTo(cx + 8, cy + 11);
    ctx.lineTo(cx + 6, cy + 8); ctx.lineTo(cx - 6, cy + 8); ctx.fill();

    ctx.fillStyle = '#F5D6BE';                       // brazos y piernas
    ctx.fillRect(cx - 9, cy - 2, 3, 7);
    ctx.fillRect(cx + 6, cy - 2, 3, 7);
    ctx.fillRect(cx - 4, cy + 11, 3, 6);
    ctx.fillRect(cx + 1, cy + 11, 3, 6);

    ctx.fillStyle = '#F5D6BE';                       // cabeza
    ctx.beginPath(); ctx.arc(cx, cy - 11, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#FFD98A';                       // melena
    ctx.beginPath(); ctx.arc(cx, cy - 13, 8.5, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx - 7, cy - 8, 3.5, 6, 0.3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 7, cy - 8, 3.5, 6, -0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#3A3A3A';                       // ojos y sonrisa
    ctx.beginPath(); ctx.arc(cx - 2.6, cy - 11, 1.3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 2.6, cy - 11, 1.3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#C4776B'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy - 9, 2.2, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.fillStyle = 'rgba(240,140,150,0.4)';
    ctx.beginPath(); ctx.arc(cx - 5, cy - 8, 1.8, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 5, cy - 8, 1.8, 0, 7); ctx.fill();

    // varita
    ctx.strokeStyle = '#E8DCC0'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx + 8, cy + 2); ctx.lineTo(cx + 16, cy - 6); ctx.stroke();
    ctx.fillStyle = '#FFE066';
    const brillo = 2.6 + Math.sin(this.t * 6) * 0.9;
    ctx.beginPath(); ctx.arc(cx + 17, cy - 7, brillo, 0, 7); ctx.fill();
  },

  /* La presentación: Lumi sale grande en el centro, se presenta, y después
     vuela hasta su esquina, que es desde donde va a hablar el resto del juego. */
  presentarse() {
    const hada = document.getElementById('hada');
    hada.classList.remove('oculto');
    hada.classList.add('presentando');          // se pone en medio y grande
    document.getElementById('modal').classList.add('con-hada');
    this.globo.classList.add('oculto');

    UI.dialogo('✨ ' + this.NOMBRE,
      '¡Hola! Soy <b>Lumi</b>, el hada de esta isla.<br><br>' +
      'Voy contigo y te voy contando lo que encuentres. <b>Tú anda y prueba cosas.</b><br><br>' +
      'Empieza por lo que <b>brille en el suelo</b>.', [
      { texto: '¡Vamos!', accion: () => {
          UI.cerrar();
          Hada.volarASuSitio();
        } },
    ]);
  },

  /* El vuelo del centro a la esquina */
  volarASuSitio() {
    const hada = document.getElementById('hada');
    this.saltito = 1;
    Sonido.nota(880, 0.2, 'sine', 0.10);
    Sonido.nota(1318, 0.3, 'sine', 0.08, 0.12);
    hada.classList.remove('presentando');
    document.getElementById('modal').classList.remove('con-hada');
    setTimeout(() => this.decir('Me quedo aquí al lado. Muévete con las <b>flechas</b>: las del teclado o los botones de abajo.', 7), 1300);
  },

  /* Y un saludo corto cuando vuelve a jugar otro día */
  saludar() {
    const p = Estado.actual;
    const frases = [
      '¡Hola otra vez! ¿Por dónde seguimos?',
      '¡Has vuelto! La isla estaba muy aburrida sin ti.',
      '¡Bienvenida! Hoy hace un día precioso en la isla.',
    ];
    setTimeout(() => this.decir('✨ ' + frases[Math.floor(Math.random() * frases.length)], 5), 800);
  },
};

</script>
<script>
/* === motor/pistas.js === */
/* LAS PISTAS QUE APARECEN SOLAS

   En vez de un tutorial largo antes de empezar, cada cosa se explica LA PRIMERA
   VEZ QUE PASA: cuando ves un brillo, cuando te acercas a alguien, cuando ganas
   la primera concha. Se aprende jugando y no hay que leerse nada de antemano.

   Reglas de la casa:
   - Una pista se enseña UNA sola vez por jugadora, y queda guardada.
   - No bloquean: son globos que salen y se van solos. Nunca hay que cerrarlos.

   - El tutorial largo sigue estando para quien lo quiera (botón ❓ o tecla T). */

const Pistas = {

  cola: [],
  ultima: 0,
  mostrando: false,

  textos: {

    armario: { i: '👗', t: 'Tu cabaña. Dentro están el <b>espejo</b>, el <b>armario</b> y el <b>baño</b>. Dale al <b>espacio</b>.' },

    animalario:  { i: '🐾', t: 'El <b>animalario</b>. Aquí vivirán tus mascotas cuando encuentres alguna.' },

    mapa:    { i: '🗺️', t: 'Vas encontrando sitios. Toca <b>🗺️</b> arriba (o la tecla <b>M</b>) para ver el <b>mapa</b>.' },
    mascota: { i: '🐾', t: '¡Tu primera mascota! En el <b>animalario</b> puedes elegir quién te acompaña.' },
    dormido: { i: '💤', t: 'Se ha ido a dormir. Ve al <b>salón de Coco</b>, juega una ronda y vuelve.' },
    mochila: { i: '🎒', t: 'Lo que encuentres se guarda en tu <b>mochila</b>, arriba a la derecha. ' +
                          'Nada es un adorno: <b>todo es de alguien o va en algún sitio</b>.' },
    pantalla:{ i: '⛶', t: 'Con el botón <b>⛶</b> de arriba (o la tecla <b>P</b>) lo pones a <b>pantalla completa</b>.' },
